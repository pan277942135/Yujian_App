completion_rules:
  pass_requires:
    - "Observed evidence exists"
    - "Evidence is bound to exact source SHA"
    - "Required runtime suite actually ran"
    - "Required assertions passed"
    - "Required screenshots/geometry/motion evidence exists"
    - "No unresolved P0/P1 blocker for the claimed scope"
  forbidden_shortcuts:
    - "Build PASS => Runtime PASS"
    - "Unit PASS => End-to-end PASS"
    - "Historical PASS => Current PASS"
    - "AI statement => Evidence"
    - "Artifact exists => Release ready"

state_update:
  trigger_events:
    - "commit"
    - "branch change"
    - "PR change"
    - "phase status change"
    - "feature status change"
    - "runtime result"
    - "blocker open/close"
    - "APK generated"
    - "evidence generated"
    - "material product/design decision"
  protocol_file: "harness/STATE_UPDATE_PROTOCOL.md"
  work_log: "harness/build-log.md"

agent_recovery:
  startup_order:
    - "AGENTS.md"
    - "PROJECT_MASTER_STATE.yaml"
    - "verify current Git HEAD"
    - "read current_work_state"
    - "read applicable contract"
    - "read latest build-log entry"
    - "check blockers"
    - "execute next_actions"
  interruption_rule: "Resume from the last committed state; never rely on chat memory as the only checkpoint."
