<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#18343a" flood-opacity=".08"/>
    </filter>
    <style>
      .t{font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#17364b}
      .muted{fill:#6d8388}.small{font-size:24px}.body{font-size:30px}.title{font-size:42px;font-weight:700}
      .strong{font-weight:700}.chip{fill:#eef4f2;stroke:#d7e4df;stroke-width:2}
      .glass{fill:#ffffff;fill-opacity:.78;stroke:#dfeae6;stroke-width:2}
      .line{stroke:#bfd0cb;stroke-width:2}.gold{fill:#a67a2b}
    </style>
  </defs>
  <image href="../../../../../system/backgrounds/morning_lake_v1/assets/Morning_Lake_Master_V1.png" x="0" y="0" width="1080" height="1920" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1920" fill="#fff" opacity=".30"/>
  
  
  <text class="t" x="70" y="165" font-size="58">‹</text>
  <rect class="glass" x="150" y="100" rx="32" ry="32" width="700" height="100"/>
  <text class="t" x="195" y="166" font-size="42">⌕</text>
  <text class="t body strong" x="245" y="165">鳄鱼</text><circle cx="810" cy="150" r="20" fill="#879aa0"/><text x="810" y="160" text-anchor="middle" fill="#fff" font-size="28">×</text>
  <text class="t body strong" x="885" y="165">取消</text>
  <g transform="translate(0 520)">
    <text class="t title" x="540" y="200" text-anchor="middle">没有找到相关鱼获</text>
    <text class="t body muted" x="540" y="260" text-anchor="middle">你可以搜索：鱼种、地点、日期</text>
    <rect x="390" y="320" rx="34" width="300" height="78" fill="#fff" fill-opacity=".62" stroke="#8ca9a4" stroke-width="2"/>
    <text class="t body strong" x="540" y="371" text-anchor="middle">清除搜索</text>
  </g>

  <g transform="translate(436 1685)">
    <image href="../../../../../system/components/primary_capture_button/assets/capture_button_base.png" x="0" y="0" width="208" height="208"/>
    <image href="../../../../../system/components/primary_capture_button/assets/capture_button_gold_rim.png" x="0" y="0" width="208" height="208"/>
  </g>
</svg>