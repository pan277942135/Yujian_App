    <text x="296" y="475" font-size="10" text-anchor="middle" fill="#2d4b56" font-weight="700">遮挡过多</text>
    <text x="296" y="488" font-size="7" text-anchor="middle" fill="#8b5c4e">SOURCE BLOCKED</text>
