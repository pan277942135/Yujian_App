    <text x="184" y="488" font-size="7" text-anchor="middle" fill="#8b5c4e">SOURCE BLOCKED</text>
  </g><g id="p02.error.3">
    <rect x="244" y="395" width="104" height="103" rx="10" fill="#f8fafb" stroke="#d5e0e5"/>
    <rect x="251" y="402" width="90" height="58" rx="6" fill="#dce8eb" stroke="#b7cbd1" stroke-dasharray="4 3"/>
