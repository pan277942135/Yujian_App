<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="667" viewBox="0 0 375 667" role="img" aria-labelledby="title desc" data-authority="STRUCTURE_ONLY_CANDIDATE">
  <title id="title">P02 首次拍照教学结构拆分预览</title>
  <desc id="desc">仅展示组件和资源绑定关系；不是真实照片，不是冻结高保真，也不代表精确几何。独立原始照片仍然缺失。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5f6"/><stop offset="1" stop-color="#d8e7eb"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2edf0"/><stop offset="1" stop-color="#c8dce2"/></linearGradient>
  </defs>
  <rect width="375" height="667" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="373" height="665" rx="27" fill="none" stroke="#b6c9cf"/>
  <rect x="14" y="14" width="347" height="27" rx="8" fill="#e6eff2"/>
  <text x="24" y="31" font-size="9" fill="#52727d" font-weight="700">P02 · 结构拆分预览</text>
  <text x="350" y="31" font-size="8" text-anchor="end" fill="#b05f4d">非冻结视觉</text>
  <g id="p02.navigation">
    <circle cx="31" cy="61" r="12" fill="#fff" stroke="#c5d7dc"/>
    <path d="M 35 55 L 29 61 L 35 67" fill="none" stroke="#355d6a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="53" y="64" font-size="9" fill="#45646f">上一张</text>
    <text x="344" y="64" font-size="10" text-anchor="end" fill="#42616b">跳过</text>
  </g>
  <g id="p02.title_block">
    <text x="20" y="91" font-size="17" fill="#1e3f4b" font-weight="700">竖拍鱼类拍摄示意</text>
    <text x="20" y="110" font-size="10" fill="#5b7780">请保持鱼体完整、清晰，并符合竖向构图要求</text>
  </g>
  <g id="p02.correct_hero">
    <rect x="20" y="124" width="335" height="242" rx="13" fill="url(#hero)" stroke="#789ba6" stroke-dasharray="6 4"/>
    <g opacity="0.85"><ellipse cx="187" cy="230" rx="17.92" ry="45.6" fill="#9bb2b7"/><path d="M 187 177.2 L 174.2 155.6 L 199.8 155.6 Z" fill="#9bb2b7"/><path d="M 187 280.4 L 175.48 304.4 L 198.52 304.4 Z" fill="#9bb2b7"/><circle cx="181.88" cy="215.6" r="1.7" fill="#203b45"/></g>
    <rect x="78" y="278" width="219" height="44" rx="10" fill="#f7fbfc" stroke="#d1e0e4"/>
    <text x="187" y="295" text-anchor="middle" font-size="12" fill="#244c59" font-weight="700">正确示范主图 · 原图缺失</text>
    <text x="187" y="311" text-anchor="middle" font-size="9" fill="#a45d4c">ASSET_SOURCE_BLOCKED</text>
  </g>
