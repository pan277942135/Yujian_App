<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <title>NH02 · First Catch Home · Hi-Fi Review</title>
  <desc>Derived directly from NH01 Normal Home visual authority. Only the single-record state delta is applied: 1/1/1 statistics and removal of adjacent pager cards.</desc>
  <defs>
    <linearGradient id="fadeLeft" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="1"/>
      <stop offset="0.78" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.22" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fadeRow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.14" stop-color="white" stop-opacity="1"/>
      <stop offset="0.86" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="leftMask"><rect x="0" y="0" width="185" height="1920" fill="url(#fadeLeft)"/></mask>
    <mask id="rightMask"><rect x="895" y="0" width="185" height="1920" fill="url(#fadeRight)"/></mask>
    <mask id="rowMask"><rect x="0" y="275" width="1080" height="170" fill="url(#fadeRow)"/></mask>
  </defs>

  <image href="../../../../../system/core_visual_v1/reference/normal_home_v1.png"
         x="0" y="0" width="1080" height="1920" preserveAspectRatio="none"/>

  <g mask="url(#leftMask)">
    <image href="../../../../../system/backgrounds/morning_lake_v1/assets/Morning_Lake_Master_V1.png"
           x="0" y="0" width="1080" height="1920" preserveAspectRatio="none"/>
  </g>
  <g mask="url(#rightMask)">
    <image href="../../../../../system/backgrounds/morning_lake_v1/assets/Morning_Lake_Master_V1.png"
           x="0" y="0" width="1080" height="1920" preserveAspectRatio="none"/>
  </g>

  <g mask="url(#rowMask)">
    <image href="../../../../../system/backgrounds/morning_lake_v1/assets/Morning_Lake_Master_V1.png"
           x="0" y="0" width="1080" height="1920" preserveAspectRatio="none"/>
  </g>
  <g font-family="system-ui,-apple-system,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
     text-anchor="middle" fill="#102D35">
    <text x="270" y="347" font-size="37" font-weight="500">1</text>
    <text x="540" y="347" font-size="37" font-weight="500">1</text>
    <text x="810" y="347" font-size="37" font-weight="500">1</text>
    <text x="270" y="393" font-size="27" font-weight="450" opacity="0.78">鱼种</text>
    <text x="540" y="393" font-size="27" font-weight="450" opacity="0.78">鱼获</text>
    <text x="810" y="393" font-size="27" font-weight="450" opacity="0.78">记录天数</text>
  </g>
  <g stroke="#6E8791" stroke-opacity="0.28" stroke-width="1.5">
    <line x1="405" y1="318" x2="405" y2="394"/>
    <line x1="675" y1="318" x2="675" y2="394"/>
  </g>
</svg>
