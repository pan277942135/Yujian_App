<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1680" viewBox="0 0 1600 1680">
  <defs>
    <style>
      .bg{fill:#F7FAFB}
      .panel{fill:#FFFFFF;stroke:#E2EBE8;stroke-width:2}
      .title{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:42px;font-weight:700;fill:#18343A}
      .subtitle{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:22px;font-weight:500;fill:#71868B}
      .section{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:26px;font-weight:700;fill:#28474D}
      .meta{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:600;fill:#7A8F93}
      .variant{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:800;fill:#71868B;letter-spacing:1px}
      .label{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:32px;font-weight:600;text-anchor:middle;dominant-baseline:middle}
      .small{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:500;fill:#7A8F93}
      .state{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:800;fill:#71868B;text-anchor:middle}
      .pill{fill:#EAF4F1;stroke:#CFE1DC;stroke-width:2}
      .pilltext{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:700;fill:#416B64;text-anchor:middle;dominant-baseline:middle}
    </style>
    <filter id="primaryShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B2D4B" flood-opacity=".10"/>
    </filter>
    <filter id="secondaryShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B2D4B" flood-opacity=".05"/>
    </filter>
