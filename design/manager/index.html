<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>渔见设计管理</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">渔见</div>
        <div>
          <h1>设计管理</h1>
          <p>设计资产、版本与体验规范</p>
        </div>
      </div>

      <div class="filters">
        <input id="searchInput" type="search" placeholder="搜索模块…" aria-label="搜索模块">
        <select id="statusFilter" aria-label="按状态筛选">
          <option value="">全部状态</option>
        </select>
      </div>

      <div id="summary" class="summary"></div>
      <nav id="moduleList" class="module-list" aria-label="模块列表"></nav>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <div class="eyebrow">渔见 · 设计权威管理</div>
          <h2 id="pageTitle">设计管理</h2>
        </div>
        <div id="pageStatus"></div>
      </header>

      <section id="emptyState" class="empty-state">
        <h3>选择一个模块</h3>
        <p>查看当前设计版本、视觉、动效、震动、声音、资产与权威来源。</p>
      </section>

      <section id="detail" class="detail hidden">
        <div class="hero-grid">
          <article class="panel overview-panel">
            <div class="panel-head">
              <div>
                <div class="eyebrow">当前设计权威</div>
                <h3 id="moduleName"></h3>
              </div>
              <div id="overallBadge"></div>
            </div>
            <div id="moduleMeta" class="meta-grid"></div>
            <div id="moduleNote" class="note hidden"></div>
          </article>

          <article class="panel preview-panel">
            <div class="panel-head">
              <div>
                <div class="eyebrow">视觉预览</div>
                <h3>当前视觉权威</h3>
              </div>
            </div>
            <div id="visualPreview" class="visual-preview"></div>
          </article>
        </div>

        <article class="panel">
          <div class="panel-head">
            <div>
              <div class="eyebrow">设计维度</div>
              <h3>设计完整度</h3>
            </div>
          </div>
          <div id="modalityGrid" class="modality-grid"></div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <div>
              <div class="eyebrow">版本历史</div>
              <h3>版本与冻结关系</h3>
            </div>
          </div>
          <div id="versionTimeline" class="version-timeline"></div>
        </article>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
