org.gradle.jvmargs=-Xmx11264m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build/diagnostics/ -Xlog:gc*,safepoint:file=build/diagnostics/gc-%p.log:time,uptime,level,tags
# Reuse the repository's Android QA build strategy to avoid a second Kotlin heap.
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
