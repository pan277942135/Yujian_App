  NEXT_STATE: CANCELLED | explicit_retry → CAPTURED(new Attempt)
  BACK_TARGET: Camera Ready per approved NAV-03; Result technical issue Back follows its registered route
  ERROR_PATH: Failure report itself remains evidence; no synthetic species
  RECOVERY_PATH: Retry retained image explicitly with a fresh Attempt ID; Retake if image unavailable
  PERSISTENCE: No FishRecord; retain failure trace without retaining live Bitmap
