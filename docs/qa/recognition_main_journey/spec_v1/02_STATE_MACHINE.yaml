  NEXT_STATE: EMPTY_HOME (for QA_RECOGNITION_001)
  BACK_TARGET: Home source recorded at session start
  ERROR_PATH: 'Back-stack mismatch: fail gate; do not silently go to Capture'
  RECOVERY_PATH: Re-enter camera creates clean session and fresh image/Attempt IDs
  PERSISTENCE: Unconfirmed edits discarded only after explicit confirmation; zero FishRecord
  OWNER: Navigation coordinator
  TEST_CASE_IDS:
  - NAV-04
  - NAV-05
  - NAV-06
- PAGE_ID: recognition.result.v3_1
  STATE_ID: RETAKE
  ENTRY_CONDITION: User explicitly chooses “重新拍摄” on a result/recovery branch
  EVENT: retake_confirmed | discard_confirmed
  GUARD: Unsaved edits trigger discard confirmation; a save request must first become terminal
  SIDE_EFFECT: Invalidate prior result/Attempt; release image lease; navigate to Capture
  NEXT_STATE: PERMISSION_REQUIRED | CAMERA_INITIALIZING
  BACK_TARGET: N/A; this is an explicit action distinct from Back
  ERROR_PATH: Camera cannot initialize
  RECOVERY_PATH: Gallery/Back remain available
  PERSISTENCE: No FishRecord unless prior save already succeeded
  OWNER: Navigation/Capture coordinator
  TEST_CASE_IDS:
  - NAV-06
  - CAP-01
- PAGE_ID: recognition.lifecycle.v1
  STATE_ID: FOREGROUND
  ENTRY_CONDITION: Process/activity visible and resumed
  EVENT: on_resume | permission_return
  GUARD: Recheck current system permission and live Attempt owner; image-file existence/hash checked when needed
  SIDE_EFFECT: Reconnect observers; rebind CameraX only if Capture owns route and permission is granted
  NEXT_STATE: FOREGROUND | CAMERA_READY | PERMISSION_DENIED | ATTEMPT_RECOVERABLE | ATTEMPT_LOST | IMAGE_LOST
  BACK_TARGET: Preserve current route only if current owner/state is valid
  ERROR_PATH: Stale image or owner fails integrity check
  RECOVERY_PATH: Prompt explicit Retry or Retake according to image availability
  PERSISTENCE: Persist only session metadata needed for recovery; no Bitmap in saved state
  OWNER: Recognition lifecycle coordinator
  TEST_CASE_IDS:
  - PER-06
  - PER-07
  - NAV-07
- PAGE_ID: recognition.lifecycle.v1
  STATE_ID: BACKGROUND
  ENTRY_CONDITION: App leaves foreground during Capture/Processing/Result
  EVENT: on_pause | process_background
  GUARD: No elapsed-time-only resume rule; inspect actual owner, cancellation and image lease
  SIDE_EFFECT: Capture releases/pauses CameraX; Processing owner retains same live Attempt only while safe
  NEXT_STATE: FOREGROUND | ATTEMPT_RECOVERABLE | ATTEMPT_LOST | IMAGE_LOST
  BACK_TARGET: Existing route retained if safe; otherwise explicit recovery screen
  ERROR_PATH: Owner interrupted or permission revoked
  RECOVERY_PATH: Recheck at resume; retry/retake, never synthesize Result
  PERSISTENCE: No long-term Bitmap persistence
  OWNER: Recognition lifecycle coordinator
  TEST_CASE_IDS:
  - EN-04
  - PER-07
  - NAV-07
- PAGE_ID: recognition.lifecycle.v1
  STATE_ID: ACTIVITY_RECREATED
  ENTRY_CONDITION: Configuration recreation or Activity recreation occurs
  EVENT: activity_recreated
  GUARD: Same ViewModel/navigation owner is proven alive and holds same Attempt object/ID
  SIDE_EFFECT: Reattach UI observer without invoking detector/classifier again
  NEXT_STATE: ATTEMPT_RECOVERABLE | ATTEMPT_LOST | IMAGE_LOST
  BACK_TARGET: Restore current route only with owner proof
  ERROR_PATH: Attempt owner absent or duplicate invocation detected
  RECOVERY_PATH: If owner alive, continue same Attempt; else explicit Retry/Retake
  PERSISTENCE: SavedStateHandle may hold IDs/status only; image bytes remain app-private file
  OWNER: Recognition Attempt coordinator/ViewModel
  TEST_CASE_IDS:
  - NAV-07
  - SYS-05
- PAGE_ID: recognition.lifecycle.v1
  STATE_ID: ATTEMPT_RECOVERABLE
  ENTRY_CONDITION: Original Attempt owner still executes or safely reattaches and image lease is valid
  EVENT: owner_alive | callback_for_current_id
  GUARD: Current ID equals one active attempt; one pipeline invocation only
  SIDE_EFFECT: Resume observation on same Attempt ID; accept one terminal event
  NEXT_STATE: FOREGROUND → PROCESSING/RESULT
  BACK_TARGET: Existing source-home mapping preserved
  ERROR_PATH: Callback attempt ID mismatch or duplicate event
  RECOVERY_PATH: Ignore stale/duplicate callback and log reason
  PERSISTENCE: Do not save live coroutine/Bitmap in persistent state
  OWNER: Recognition Attempt coordinator
  TEST_CASE_IDS:
  - NAV-07
- PAGE_ID: recognition.lifecycle.v1
  STATE_ID: ATTEMPT_LOST
  ENTRY_CONDITION: Execution owner was destroyed or cannot prove in-flight work identity
  EVENT: owner_lost | process_recreated
  GUARD: No trustworthy live job exists
  SIDE_EFFECT: Invalidate old Attempt ID; release orphaned runtime resources; keep no inferred result
  NEXT_STATE: EXPLICIT_RETRY | RETAKE | IMAGE_LOST
  BACK_TARGET: Recovery route → source Home or explicit Capture action
  ERROR_PATH: Old callback arrives after loss
  RECOVERY_PATH: Ignore old callback; if image is valid offer explicit Retry with new ID
  PERSISTENCE: Persist only safe session metadata and source image reference/hash
  OWNER: Recognition Attempt coordinator
  TEST_CASE_IDS:
  - NAV-07
- PAGE_ID: recognition.lifecycle.v1
  STATE_ID: IMAGE_LOST
  ENTRY_CONDITION: Normalized source file missing, unreadable, or digest mismatch
  EVENT: image_missing | file_corrupt | lease_expired
  GUARD: No verified input remains available for this attempt
  SIDE_EFFECT: Mark attempt unrecoverable; no automatic detector invocation
  NEXT_STATE: RETAKE | BACK_TO_SOURCE_HOME
  BACK_TARGET: Back → source Home
  ERROR_PATH: Source cannot be reconstructed from result/screenshot
  RECOVERY_PATH: Explicit Retake or return Home
  PERSISTENCE: Delete stale metadata; never persist photo reconstruction
  OWNER: Image store/lifecycle coordinator
  TEST_CASE_IDS:
  - NAV-07
  - RES-07
transitions:
- from: EMPTY_HOME
  event: tap_capture
  guard: user action; route not already active
  side_effect: capture source route; request CAMERA only now if required
  to: PERMISSION_REQUIRED | CAMERA_INITIALIZING
- from: EMPTY_HOME
  event: tap_gallery
  guard: system picker available
  side_effect: launch image-only Photo Picker; no camera permission request; bypass first-use guide
  to: CAPTURE_SUCCESS | CAPTURE_ERROR
- from: PERMISSION_REQUIRED
  event: permission_granted
  guard: checkSelfPermission == GRANTED
  side_effect: start CameraX initialization
  to: CAMERA_INITIALIZING
- from: PERMISSION_REQUIRED
  event: permission_denied_or_dismissed
  guard: current permission check remains DENIED
  side_effect: keep Gallery/Back; expose explicit retry and settings option
  to: PERMISSION_DENIED
- from: PERMISSION_DENIED
  event: tap_retry_permission
  guard: not already in flight; no unsolicited repeat
  side_effect: one platform request; inspect actual callback/system state
  to: PERMISSION_REQUIRED
- from: PERMISSION_DENIED
  event: tap_open_settings
  guard: ACTION_APPLICATION_DETAILS_SETTINGS resolves
  side_effect: launch Intent with package:currentPackageName; recheck grant on resume
  to: PERMISSION_DENIED | CAMERA_INITIALIZING
- from: CAMERA_INITIALIZING
  event: camera_ready
  guard: permission granted AND provider bound AND Preview STREAMING AND ImageCapture ready
  side_effect: enable one shutter; evaluate guide eligibility
  to: GUIDE.P01 | CAMERA_READY
- from: CAMERA_INITIALIZING
  event: provider_failure
  guard: no usable Preview
  side_effect: release partial CameraX binding and offer retry
  to: CAPTURE_ERROR
- from: CAMERA_READY
  event: tap_shutter
  guard: cameraCanCapture AND no in-flight capture
  side_effect: reserve one capture request ID
  to: CAPTURING
- from: CAPTURING
  event: readable_normalized_image
  guard: exactly one valid image handoff
  side_effect: create fresh Recognition Attempt ID
  to: PROCESSING.CAPTURED
- from: CAPTURE_ERROR
  event: tap_gallery
  guard: picker independent of CAMERA
  side_effect: normalize chosen image; cancellation is non-mutating
  to: CAPTURE_SUCCESS | CAPTURE_ERROR
- from: GUIDE.P01
  event: next
  guard: active guide
  side_effect: render P02; preserve incomplete flag
  to: GUIDE.P02
- from: GUIDE.P02
  event: next
  guard: active guide
  side_effect: render P03; preserve incomplete flag
  to: GUIDE.P03
- from: GUIDE.P03
  event: start
  guard: explicit P03 Start
  side_effect: persist completed; close overlay; no capture request
  to: GUIDE.COMPLETED → CAMERA_READY
- from: GUIDE.P01 | GUIDE.P02 | GUIDE.P03
  event: skip
  guard: explicit Skip
  side_effect: persist completed and close overlay; no capture request
  to: GUIDE.COMPLETED → CAMERA_READY
- from: GUIDE.P01 | GUIDE.P02 | GUIDE.P03
  event: back_or_dismiss
  guard: not Skip/Start
  side_effect: close without setting completed
  to: GUIDE.DISMISSED
- from: PROCESSING.CAPTURED
  event: detector_started
  guard: live Attempt owner + readable image
  side_effect: start total inference monotonic clock immediately before dispatch
  to: PROCESSING.DETECTING
- from: PROCESSING.DETECTING
  event: eligible_real_fish_bbox
  guard: real detector payload and minimum phase elapsed
  side_effect: record bbox/model/version and make outline geometry
  to: PROCESSING.OUTLINE
- from: PROCESSING.DETECTING
  event: no_fish_or_invalid
  guard: actual quality gate; NO_FISH precedence
  side_effect: terminalize pipeline route without classifier as dictated by gate
  to: RESULT.NO_FISH | RESULT.INVALID
- from: PROCESSING.OUTLINE
  event: crop_success_and_classifier_started
  guard: actual detector geometry + crop valid + minimum phase elapsed
  side_effect: release crop at terminal finally; start Classifier
  to: PROCESSING.CLASSIFYING
- from: PROCESSING.CLASSIFYING
  event: actual_classifier_result
  guard: current Attempt ID + ≥250ms phase beat
  side_effect: stop timeout clock; deliver exactly once
  to: PROCESSING.RESULT_READY
- from: PROCESSING.*
  event: technical_failure_or_timeout
  guard: real failure/approved configured timeout; not animation duration
  side_effect: invalidate attempt and ignore late callbacks
  to: RESULT.TECHNICAL_FAILURE
- from: PROCESSING.*
  event: user_back
  guard: NAV-03
  side_effect: cancel/invalidate current Attempt; release owner resources
  to: CAMERA_READY
- from: RESULT.HIGH | RESULT.MEDIUM | RESULT.LOW
  event: top_back_or_system_back
  guard: no save in progress; confirm discard if draft is dirty
  side_effect: clear session; pop to source route
  to: EMPTY_HOME (QA_RECOGNITION_001)
- from: RESULT.*
  event: explicit_retake
  guard: no active save; confirm dirty draft
  side_effect: invalidate old attempt/result; release image; create a fresh Capture session
  to: CAMERA_INITIALIZING
- from: RESULT.SAVE_IN_PROGRESS
  event: top_back_or_system_back
  guard: save request not terminal
  side_effect: top action disabled; consume System Back; await persistence terminal
  to: RESULT.SAVE_IN_PROGRESS
- from: RESULT.SAVE_IN_PROGRESS
  event: save_error
  guard: no successful record
  side_effect: retain draft/destination/idempotency key; re-enable exit and retry
  to: RESULT.SAVE_ERROR
- from: RESULT.SAVE_IN_PROGRESS
  event: save_success
  guard: exactly one persisted record ID
  side_effect: dispatch requested destination and exit this scope
  to: OUT_OF_SCOPE_DESTINATION
- from: LIFECYCLE.BACKGROUND
  event: foreground_resume
  guard: evaluate owner alive + active ID + file exists/hash; do not use elapsed seconds alone
  side_effect: recheck permission and reattach same observer or show explicit recovery
  to: LIFECYCLE.ATTEMPT_RECOVERABLE | ATTEMPT_LOST | IMAGE_LOST
- from: LIFECYCLE.ACTIVITY_RECREATED
  event: owner_check
  guard: same ViewModel/job owner and ID proven alive
  side_effect: reattach observer; no second pipeline dispatch
  to: LIFECYCLE.ATTEMPT_RECOVERABLE
- from: LIFECYCLE.ATTEMPT_LOST
  event: explicit_retry
  guard: image file exists and sha256 matches retained metadata
  side_effect: new Attempt ID; same immutable normalized image
  to: PROCESSING.CAPTURED
- from: LIFECYCLE.ATTEMPT_LOST
  event: explicit_retake
  guard: image missing/invalid or user chooses new photo
  side_effect: delete stale image lease; new capture session
  to: CAPTURE_INITIALIZING
state_graph:
  source: EMPTY_HOME
  normal_camera_route:
  - PERMISSION_REQUIRED
  - CAMERA_INITIALIZING
  - CAMERA_READY
  - GUIDE.P01?
  - GUIDE.P02?
  - GUIDE.P03?
  - CAMERA_READY
  - CAPTURING
  - CAPTURE_SUCCESS
  - PROCESSING.CAPTURED
  - PROCESSING.DETECTING
  - PROCESSING.OUTLINE?
  - PROCESSING.CLASSIFYING?
  - PROCESSING.RESULT_READY
  - RESULT outcome
  gallery_route:
  - EMPTY_HOME
  - CAPTURE_SUCCESS
  - PROCESSING.CAPTURED
  - PROCESSING.DETECTING
  - PROCESSING.OUTLINE?
  - PROCESSING.CLASSIFYING?
  - PROCESSING.RESULT_READY
  - RESULT outcome
  recovery_routes:
  - RESULT.NO_FISH → explicit RETAKE/GALLERY or BACK_TO_SOURCE_HOME
  - RESULT.INVALID → explicit RETAKE/GALLERY or BACK_TO_SOURCE_HOME
  - RESULT.TECHNICAL_FAILURE → explicit RETRY/RETAKE/GALLERY or BACK_TO_SOURCE_HOME
  result_unsaved_back:
  - RESULT outcome
  - BACK_TO_SOURCE_HOME
  - EMPTY_HOME
  processing_back:
  - PROCESSING active
  - CANCELLED
  - CAMERA_READY
  save_boundary:
  - RESULT eligible
  - SAVE_IN_PROGRESS
  - SAVE_SUCCEEDED → OUT_OF_SCOPE_DESTINATION | SAVE_ERROR → RESULT
  lifecycle_overlay:
  - FOREGROUND ↔ BACKGROUND
  - ACTIVITY_RECREATED → ATTEMPT_RECOVERABLE | ATTEMPT_LOST | IMAGE_LOST
