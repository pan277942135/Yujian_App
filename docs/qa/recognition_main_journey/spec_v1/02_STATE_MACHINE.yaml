  BACK_TARGET: N/A (entry page)
  ERROR_PATH: Home data cannot load
  RECOVERY_PATH: Retry Home; do not create a placeholder FishRecord
  PERSISTENCE: No Recognition Attempt or FishRecord; guest archive count starts at 0
  OWNER: Home navigation owner
