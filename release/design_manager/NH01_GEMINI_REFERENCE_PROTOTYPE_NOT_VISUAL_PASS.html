<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>&#x6E14;&#x89C1; App - Responsive UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background-color: #0f172a;
      color: #ffffff;
      overflow-x: hidden;
    }
    .brand-serif {
      font-family: var(--font-serif);
    }
    
    
    
    .app-viewport {
      container-type: size;
    }
  
    .prototype-dynamic-slot {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      color: rgba(255,255,255,.88);
      background-color: rgba(20,42,58,.45);
      outline: 1px dashed rgba(255,255,255,.66);
      text-align: center;
      font: 10px/1.2 monospace;
    }
    .shared-capture-component-slot {
      width: clamp(54px, 9.5cqh, 66px);
      height: clamp(54px, 9.5cqh, 66px);
      border: 1px dashed rgba(255,255,255,.8);
      border-radius: 9999px;
      background: rgba(20,42,58,.45);
      color: rgba(255,255,255,.92);
      font: 9px/1.2 monospace;
      text-align: center;
      padding: 4px;
    }
  </style>
</head>
<!-- Structure-only reference. No Figma alignment or visual pass is claimed. -->
<body class="min-h-screen flex flex-col items-center justify-start">

  <!-- Top Responsive Control Bar -->
  <!-- Device controls are test tooling, excluded from the product page. -->

  <!-- Main Stage -->
  <main id="stage-container" class="w-full flex-1 flex items-center justify-center"></main>

  <!-- Screen Template -->
  <template id="yujian-screen-template">
    <section
      data-layer="Screen-Yujian-Home"
      class="app-viewport relative w-full h-full overflow-hidden flex flex-col justify-between select-none bg-slate-700"
    >
      <!-- 1. Background Group -->
      <div data-layer="BG-Scenic-Group" class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
        <div data-layer="BG-Mountain-Mist" data-binding="background_asset" data-asset-id="system_backgrounds_morning_lake_v1_assets_morning_lake_master_v1_png" data-source-sha256="5fba741088ea186e898cd3bee5777e35978436f427492e6e6122528ef6aa91d7" data-prototype-only="true" class="prototype-dynamic-slot" role="img" aria-label="Official background slot; Figma import pending">background_asset</div>
        
        
        
      </div>

      <!-- 2. Top Container (Header + Stats) -->
      <div
        data-layer="Top-Section-AutoLayout"
        class="relative z-10 w-full max-w-[560px] mx-auto flex flex-col pt-[clamp(24px,5.5cqh,44px)] px-[clamp(24px,7.5cqw,40px)] gap-[clamp(14px,3.6cqh,32px)]"
      >
        <!-- 2.1 Header Bar -->
        <div data-layer="Header-Bar" class="w-full flex items-center justify-between">
          <div data-layer="Brand-Title" data-asset-id="brand_title_primary" data-source-sha256="2dd41f5138e88e3bd48178dd26a15dfbb29c434536e4e3cc887fe2db13bdfddc" data-prototype-only="true" class="brand-serif prototype-dynamic-slot" role="img" aria-label="Frozen brand artwork slot; official image not rendered here">brand_title_primary</div>
          <button
            data-layer="User-Avatar-Btn" data-interaction="onProfileClick" data-binding="avatar_state"
            aria-label="Profile"
            class="relative w-[clamp(36px,6cqh,44px)] h-[clamp(36px,6cqh,44px)] rounded-full border-[2px] border-white/95 shadow-md overflow-hidden shrink-0 bg-slate-200 focus:outline-none"
          >
            <span data-layer="Avatar-Image" data-binding="avatar_image" data-prototype-only="true" class="prototype-dynamic-slot" role="img" aria-label="NH07 avatar state slot">avatar_image</span>
          </button>
        </div>

        
        <div data-layer="Stats-Bar" class="w-full grid grid-cols-3 items-center py-1 px-2">
          <div data-layer="Stat-Item-Species" data-interaction="none" class="flex flex-col items-center justify-center gap-0.5">
            <span data-layer="Stat-Value-Species" data-binding="species_count" class="text-[#0F172A] font-semibold text-[clamp(17px,3cqh,21px)] leading-tight tracking-tight">{{species_count}}</span>
            <span data-layer="Stat-Label-Species" class="text-[#1E293B]/80 font-normal text-[clamp(11px,1.9cqh,13px)]">
              &#x9C7C;&#x79CD;
            </span>
          </div>

          <div data-layer="Stat-Item-Catches" data-interaction="onCatchesClick" class="relative flex flex-col items-center justify-center gap-0.5 border-x border-[#0F172A]/20">
            <span data-layer="Stat-Value-Catches" data-binding="catch_count" class="text-[#0F172A] font-semibold text-[clamp(17px,3cqh,21px)] leading-tight tracking-tight">{{catch_count}}</span>
            <span data-layer="Stat-Label-Catches" class="text-[#1E293B]/80 font-normal text-[clamp(11px,1.9cqh,13px)]">
              &#x9C7C;&#x83B7;
            </span>
          </div>

          <div data-layer="Stat-Item-Days" data-interaction="none" class="flex flex-col items-center justify-center gap-0.5">
            <span data-layer="Stat-Value-RecordDays" data-binding="record_days" class="text-[#0F172A] font-semibold text-[clamp(17px,3cqh,21px)] leading-tight tracking-tight">{{record_days}}</span>
            <span data-layer="Stat-Label-Days" class="text-[#1E293B]/80 font-normal text-[clamp(11px,1.9cqh,13px)]">
              &#x8BB0;&#x5F55;&#x5929;&#x6570;
            </span>
          </div>
        </div>
      </div>

      <!-- 3. Middle Section (Section Header + Carousel Cards) -->
      <div
        data-layer="Middle-Carousel-Section"
        class="relative z-10 w-full flex-1 min-h-0 flex flex-col justify-center my-[clamp(6px,1.5cqh,16px)] gap-[clamp(8px,1.8cqh,14px)]"
      >
        <!-- 3.1 Section Header: 最近鱼获 | 全部 > -->
        <div
          data-layer="Section-Header-Bar"
          class="w-full max-w-[560px] mx-auto flex items-center justify-between px-[clamp(24px,8.8cqw,42px)]"
        >
          <h2
            data-layer="Section-Title-Recent"
            class="text-white font-medium text-[clamp(16px,2.7cqh,19px)] tracking-wide m-0"
          >
            &#x6700;&#x8FD1;&#x9C7C;&#x83B7;
          </h2>
          <button type="button" data-layer="Section-Action-All" data-interaction="onCatchesClick" 
            class="inline-flex items-center gap-1 text-white/95 hover:text-white text-[clamp(13px,2.1cqh,15px)] font-normal transition"
          >
            <span>&#x5168;&#x90E8;</span>
            <svg data-layer="Icon-Chevron-Right" class="w-3.5 h-3.5 stroke-[2.2]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>

        <!-- 3.2 Carousel Track -->
        <div
          data-layer="Carousel-Track-Container"
          class="relative w-full flex-1 min-h-0 flex items-center justify-center gap-[clamp(10px,3.2cqw,16px)] overflow-hidden py-1"
        >
          <!-- Left Peeking Card -->
          <article
            data-layer="Card-Peek-Left"
            class="relative shrink-0 w-[62cqw] max-w-[260px] h-[67%] max-h-[340px] -ml-[50cqw] sm:-ml-[160px] rounded-[18px] border-[1.5px] border-white/85 overflow-hidden shadow-lg bg-slate-800/60 transition-all duration-300"
          >
            <div data-layer="Card-Left-Photo" data-binding="previous_catch_image" data-prototype-only="true" class="prototype-dynamic-slot" role="img" aria-label="Authorized record photo source required">previous_catch_image</div>
            <div class="absolute inset-0 bg-slate-900/15"></div>
          </article>

          <!-- Center Main Active Card -->
          <article
            data-layer="Card-Main-Active" data-binding="catch_id" data-interaction="onCatchClick(recordId)"
            class="relative shrink-0 w-[68.6cqw] max-w-[360px] h-full max-h-[480px] rounded-[22px] border-[2px] border-white/95 overflow-hidden shadow-[0_16px_36px_rgba(8,22,38,0.45)] bg-slate-800 flex flex-col justify-end"
          >
            <div data-layer="Card-Main-Photo" data-binding="catch_image" data-prototype-only="true" class="prototype-dynamic-slot" role="img" aria-label="Authorized record photo source required">catch_image</div>
            <div
              data-layer="Card-Bottom-Gradient"
              class="absolute inset-x-0 bottom-0 h-[44%] pointer-events-none"
              style="background: linear-gradient(180deg, rgba(12, 20, 28, 0) 0%, rgba(12, 20, 28, 0.52) 52%, rgba(10, 16, 24, 0.84) 100%);"
            ></div>

            
            <div
              data-layer="Card-Meta-Info"
              class="relative z-10 w-full p-[clamp(14px,4.2cqw,20px)] flex flex-col items-start gap-[clamp(2px,0.6cqh,5px)] text-white"
            >
              <h3
                data-layer="Catch-Species-Name" data-binding="species_name"
                class="font-bold text-[clamp(20px,3.6cqh,26px)] leading-snug tracking-wide m-0 drop-shadow-sm"
              >{{species_name}}</h3>
              <p
                data-layer="Catch-Specs-Measure" data-binding="length_cm,weight_kg"
                class="font-medium text-[clamp(13px,2.3cqh,16px)] leading-snug tracking-wide text-white/95 m-0"
              >{{length_cm}} cm · {{weight_kg}} kg</p>
              <p
                data-layer="Catch-TimeLocation" data-binding="captured_at,location"
                class="font-normal text-[clamp(11px,1.9cqh,13px)] leading-normal text-white/80 m-0"
              >{{captured_at}} · {{location}}</p>
            </div>
          </article>

          <!-- Right Peeking Card -->
          <article
            data-layer="Card-Peek-Right"
            class="relative shrink-0 w-[62cqw] max-w-[260px] h-[67%] max-h-[340px] -mr-[50cqw] sm:-mr-[160px] rounded-[18px] border-[1.5px] border-white/85 overflow-hidden shadow-lg bg-slate-800/60 transition-all duration-300"
          >
            <div data-layer="Card-Right-Photo" data-binding="next_catch_image" data-prototype-only="true" class="prototype-dynamic-slot" role="img" aria-label="Authorized record photo source required">next_catch_image</div>
            <div class="absolute inset-0 bg-slate-900/15"></div>
          </article>
        </div>
      </div>

      <!-- 4. Footer CTA: 记录下一条鱼 + Camera Shutter Button -->
      <footer
        data-layer="Footer-CTA-Section"
        class="relative z-10 w-full flex flex-col items-center justify-center pb-[clamp(18px,4.2cqh,36px)] pt-1 gap-[clamp(8px,1.6cqh,14px)]"
      >
        <span
          data-layer="CTA-Label-RecordNext"
          class="text-white/95 font-normal text-[clamp(12px,2.1cqh,14px)] tracking-wider"
        >
          &#x8BB0;&#x5F55;&#x4E0B;&#x4E00;&#x6761;&#x9C7C;
        </span>

        <button type="button" data-layer="CTA-Camera-Button" data-binding="identify_action" data-interaction="onIdentify" data-component-id="38:25" data-asset-id="normal_home_camera_primary_v1" data-source-sha256="fb6417e372d08328ac8559d004d1c6f5b03fc17551646be46031df641660e8f2" aria-label="Camera Shutter" class="shared-capture-component-slot">Shared capture component · Figma/asset readback pending</button>
      </footer>
    </section>
  </template>

  <script>
    const stage = document.getElementById('stage-container');
    const template = document.getElementById('yujian-screen-template');
    stage.className = 'w-full flex-1 flex items-stretch justify-center';
    const frame = document.createElement('div');
    frame.className = 'w-full h-[100dvh] max-w-[520px] mx-auto overflow-hidden';
    frame.appendChild(template.content.cloneNode(true));
    stage.appendChild(frame);
  </script>
</body>
</html>
