name: Materialize Avatar Change V1

on:
  push:
    branches:
      - chore/design-experience-governance-v1
    paths:
      - '.avatar_assets/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/design-experience-governance-v1
          fetch-depth: 0

      - name: Rebuild Avatar Change V1 authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p design/pages/account_privacy/My/Edit_Profile/02_Avatar_Edit/frozen
          cat .avatar_assets/avatar_*.b64 | base64 -d > design/pages/account_privacy/My/Edit_Profile/02_Avatar_Edit/frozen/Avatar_Change_V1_Frozen.webp
          test "$(sha256sum design/pages/account_privacy/My/Edit_Profile/02_Avatar_Edit/frozen/Avatar_Change_V1_Frozen.webp | awk '{print $1}')" = "7261d5b21fa750d3eb25f89e52819ebdb095ecb615f35550de0bceae3e0e3b4f"
          file design/pages/account_privacy/My/Edit_Profile/02_Avatar_Edit/frozen/Avatar_Change_V1_Frozen.webp
          rm -rf .avatar_assets
          rm -f .github/workflows/materialize-avatar-change-v1.yml

      - name: Commit authority asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(design): archive Avatar Change V1 frozen authority"
          for attempt in 1 2 3 4 5; do
            git fetch origin chore/design-experience-governance-v1
            git rebase origin/chore/design-experience-governance-v1
            if git push origin HEAD:chore/design-experience-governance-v1; then
              exit 0
            fi
            sleep 2
          done
          exit 1
