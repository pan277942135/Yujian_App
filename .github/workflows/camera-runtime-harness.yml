name: Camera Runtime Harness P0

on:
  push:
    branches:
      - infra/camera-runtime-harness-p0-v1
      - infra/camera-runtime-harness-p0-v1-1
      - fix/recognition-camera-capture-p0-v2
      - integration/android-product-closure-v1
      - main
      - work/m1-parallel-delivery-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yujian-camera-runtime-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Verify hosted KVM
        run: test -c /dev/kvm -a -r /dev/kvm -a -w /dev/kvm

      - name: Preflight hosted API28 Pixel 2 camera environment
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back emulated -partition-size 4096
          script: |
            set -euo pipefail
            out=evidence/camera-runtime-inventory
            mkdir -p "$out"
            adb version > "$out/adb-version.txt"
            emulator -version > "$out/emulator-version.txt" 2>&1
            sdkmanager --list_installed > "$out/sdk-components.txt"
            grep -q 'system-images;android-28;google_apis;x86_64' "$out/sdk-components.txt"
            sdk="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            size="$(adb shell wm size | tr -d '\r')"
            density="$(adb shell wm density | tr -d '\r')"
            test "$sdk" = "28"
            printf '%s\n' "$size" | grep -q 'Physical size: 1080x1920'
            camera_service="$(adb shell service check media.camera | tr -d '\r')"
            printf 'RUNNER_OS=%s\nRUNNER_ARCH=%s\nAVD_PROFILE=Pixel_2\nAPI_LEVEL=%s\n' \
              "$RUNNER_OS" "$RUNNER_ARCH" "$sdk" > "$out/camera_preflight.txt"
            printf '%s\n%s\nCAMERA_SERVICE=%s\n' "$size" "$density" "$camera_service" \
              >> "$out/camera_preflight.txt"
            adb shell dumpsys window displays |
              grep -E 'mCurrentFocus|mFocusedApp|mDisplayId|mDisplayInfo|InsetsState|DisplayFrames|DisplayCutout' \
              > "$out/window-insets.txt" || true
            adb exec-out screencap -p > "$out/native-preflight.png"

      - name: Upload hosted camera preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-runtime-inventory-${{ github.sha }}
          path: evidence/camera-runtime-inventory
          if-no-files-found: warn
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      model_id: ${{ steps.model_trace.outputs.model_id }}
      product_sha: ${{ steps.product_source.outputs.product_sha }}
    env:
      YUJIAN_API_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
      YUJIAN_FISH_KNOWLEDGE_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
      YUJIAN_FEEDBACK_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
    steps:
      - name: Checkout product source
        uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref_name, 'infra/camera-runtime-harness-') && 'fix/recognition-camera-capture-p0-v2' || github.ref_name }}

      - name: Record product source and harness provenance
        id: product_source
        shell: bash
        run: |
          set -euo pipefail
          product_sha="$(git rev-parse HEAD)"
          test -s app/src/main/java/com/yujian/ai/ui/screens/IdentifyScreen.kt
          echo "PRODUCT_SOURCE_SHA=$product_sha" >> "$GITHUB_ENV"
          echo "product_sha=$product_sha" >> "$GITHUB_OUTPUT"
          printf 'PRODUCT_SOURCE_SHA=%s\nINFRASTRUCTURE_HEAD=%s\nBUILD_SHA=%s\n' \
            "$product_sha" "$GITHUB_SHA" "$product_sha" | tee build-source-provenance.txt
          cat build-source-provenance.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python asset verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow for asset verification
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Verify frozen runtime asset contracts
        run: |
          python3 scripts/verify_empty_home_runtime_v2.py
          python3 scripts/verify_normal_home_runtime_v1.py
          python3 scripts/verify_recognition_design_closure_v1_1.py
          python3 scripts/verify_recognition_runtime_contract.py

      - name: Test camera runtime gate permission handling
        run: bash scripts/android_runtime/tests/test_camera_runtime_gate.sh

      - name: Test runtime terminal-result classification
        run: bash scripts/android_runtime/tests/test_contract.sh

      - name: Bootstrap verified recognition assets
        run: GITHUB_SHA="$PRODUCT_SOURCE_SHA" python3 scripts/bootstrap_android_recognition_assets.py
        env:
          YUJIAN_GITHUB_TOKEN: ${{ github.token }}

      - name: Read production model identity
        id: model_trace
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re
          path = pathlib.Path('app/src/main/assets/model_release_contract.json')
          contract = json.loads(path.read_text(encoding='utf-8'))
          if contract.get('build_sha') != '${{ steps.product_source.outputs.product_sha }}':
              raise SystemExit('model snapshot build_sha does not match the checked-out product source')
          model_id = str(contract.get('model_id') or '')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+', model_id):
              raise SystemExit(f'invalid model_id for artifact naming: {model_id!r}')
          print(f'model_id={model_id}')
          print(f'model_sha256={contract["sha256"]}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve stable SDK AAPT2
        shell: bash
        run: |
          set -euo pipefail
          aapt2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$aapt2"
          echo "YUJIAN_AAPT2=$aapt2" >> "$GITHUB_ENV"

      - name: Compile unit and camera instrumentation tests
        run: |
          gradle -Pandroid.aapt2FromMavenOverride="$YUJIAN_AAPT2" \
            test :app:assembleDebug :app:assembleDebugAndroidTest \
            --stacktrace --no-daemon --max-workers=2

      - name: Stage exact runtime APK pair and provenance
        shell: bash
        run: |
          set -euo pipefail
          out="build/camera-runtime-apks"
          mkdir -p "$out"
          cp app/build/outputs/apk/debug/app-debug.apk "$out/app-debug.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$out/app-debug-androidTest.apk"
          cp app/src/main/assets/model_release_contract.json "$out/model_release_contract.json"
          cat build-source-provenance.txt > "$out/camera_runtime_provenance.txt"
          printf 'MODEL_ID=%s\nMODEL_SHA256=%s\n' \
            "${{ steps.model_trace.outputs.model_id }}" \
            "${{ steps.model_trace.outputs.model_sha256 }}" >> "$out/camera_runtime_provenance.txt"
          (cd "$out" && sha256sum app-debug.apk app-debug-androidTest.apk model_release_contract.json > SHA256SUMS)
          cat "$out/camera_runtime_provenance.txt" >> "$GITHUB_STEP_SUMMARY"
          cat "$out/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload camera runtime APK pair
        uses: actions/upload-artifact@v4
        with:
          name: camera-runtime-apks-${{ github.sha }}
          path: build/camera-runtime-apks
          if-no-files-found: error
          retention-days: 14

  camera-runtime:
    needs: [inventory, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.product_sha }}

      - name: Download hosted preflight
        uses: actions/download-artifact@v4
        with:
          name: camera-runtime-inventory-${{ github.sha }}
          path: evidence/camera-runtime-inventory

      - name: Download Build Once APK pair
        uses: actions/download-artifact@v4
        with:
          name: camera-runtime-apks-${{ github.sha }}
          path: build/camera-runtime-apks

      - name: Verify APK provenance and source freeze
        shell: bash
        run: |
          set -euo pipefail
          (cd build/camera-runtime-apks && sha256sum -c SHA256SUMS)
          grep -Fx "PRODUCT_SOURCE_SHA=${{ needs.build.outputs.product_sha }}" \
            build/camera-runtime-apks/camera_runtime_provenance.txt
          test "$(git rev-parse HEAD)" = "${{ needs.build.outputs.product_sha }}"
          grep -q 'API_LEVEL=28' evidence/camera-runtime-inventory/camera_preflight.txt

      - name: Install camera evidence dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user --break-system-packages Pillow==11.3.0

      - name: Run existing CameraX and smoke gates on hosted Pixel 2
        id: runtime
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back emulated -partition-size 4096
          script: |
            set +e
            out=evidence/camera-runtime-v1
            mkdir -p "$out/infra"
            sdk="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            size="$(adb shell wm size | tr -d '\r')"
            density="$(adb shell wm density | tr -d '\r')"
            test "$sdk" = "28" || exit 20
            printf '%s\n' "$size" | grep -q 'Physical size: 1080x1920' || exit 20
            {
              printf 'AVD_PROFILE=Pixel_2\nAPI_LEVEL=%s\n' "$sdk"
              printf '%s\n%s\n' "$size" "$density"
            } > "$out/infra/device-profile.txt"
            adb shell dumpsys window displays |
              grep -E 'mCurrentFocus|mFocusedApp|mDisplayId|mDisplayInfo|InsetsState|DisplayFrames|DisplayCutout' \
              > "$out/infra/window-insets.txt" || true
            API_LEVEL=28 BUILD_SHA='${{ needs.build.outputs.product_sha }}' ADB=adb \
              bash scripts/run_android_runtime_gate.sh \
                --gate camera-runtime-v1 --api-level 28 \
                --build-sha '${{ needs.build.outputs.product_sha }}' \
                --app-apk build/camera-runtime-apks/app-debug.apk \
                --test-apk build/camera-runtime-apks/app-debug-androidTest.apk \
                --evidence-dir evidence/runtime/camera-runtime-v1
            camera_rc=$?
            API_LEVEL=28 BUILD_SHA='${{ needs.build.outputs.product_sha }}' ADB=adb \
              bash scripts/run_android_runtime_gate.sh \
                --gate camera-runtime-smoke --api-level 28 \
                --build-sha '${{ needs.build.outputs.product_sha }}' \
                --app-apk build/camera-runtime-apks/app-debug.apk \
                --test-apk build/camera-runtime-apks/app-debug-androidTest.apk \
                --evidence-dir evidence/runtime/existing-harness-smoke
            smoke_rc=$?
            test "$camera_rc" = 0 && test "$smoke_rc" = 0

      - name: Materialize separate NOT_RUN results if hosted emulator did not reach Harness
        if: always()
        run: |
          set -euo pipefail
          for spec in "camera-runtime-v1 evidence/runtime/camera-runtime-v1" \
                      "camera-runtime-smoke evidence/runtime/existing-harness-smoke"; do
            read -r gate out <<< "$spec"
            result="$out/runtime_gate_result.json"
            if [[ ! -s "$result" ]]; then
              mkdir -p "$out"
              python3 scripts/android_runtime/result.py \
                --output "$result" --gate "$gate" --api-level 28 \
                --build-sha "${{ needs.build.outputs.product_sha }}" \
                --adb-state unknown --boot-completed unknown --data-free-kb "" \
                --preflight FAIL --install NOT_RUN --instrumentation NOT_RUN --evidence NOT_RUN \
                --classification BLOCKED_INFRA --failure-phase EMULATOR_RUNNER \
                --failure-reason CAMERA_RUNTIME_PREPARATION_FAILED \
                --summary-file "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload exact-source camera evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-runtime-evidence-${{ github.sha }}
          path: |
            evidence/camera-runtime-inventory
            evidence/camera-runtime-v1
            evidence/runtime/camera-runtime-v1
            evidence/runtime/existing-harness-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce individual camera gate classifications
        if: always()
        run: |
          set -euo pipefail
          camera_class="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["classification"])' evidence/runtime/camera-runtime-v1/runtime_gate_result.json)"
          smoke_class="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["classification"])' evidence/runtime/existing-harness-smoke/runtime_gate_result.json)"
          echo "camera-runtime-v1=$camera_class"
          echo "camera-runtime-smoke=$smoke_class"
          test "$camera_class" = PASS
          test "$smoke_class" = PASS
          test "${{ steps.runtime.outcome }}" = success
