name: Work Control Tower · GitHub command handshake

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/work-control-command-bridge.yml"

permissions:
  contents: read

jobs:
  contract-smoke:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify no uncontrolled issue-command execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/work-control-command-bridge.yml").read_text()
          for marker in ("github.event.issue.number == 173",
                         "github.event.comment.user.login == github.repository_owner",
                         "github.event.comment.body == '/work-control ping'",
                         "github.event.comment.body == '/work-control status'",
                         "issues: write", "github.rest.issues.createComment"):
              assert marker in p, marker
          assert not any(line.strip() == "workflow_dispatch:" for line in p.splitlines())
          print("CONTROL_TOWER_HANDSHAKE_CONTRACT=PASS")
          PY

  github-command-receipt:
    if: >-
      ${{ github.event_name == 'issue_comment' &&
          github.event.issue.number == 173 &&
          github.event.comment.user.login == github.repository_owner &&
          (github.event.comment.body == '/work-control ping' ||
           github.event.comment.body == '/work-control status') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = 173;
            const command = context.payload.comment.body;
            const trigger = context.payload.comment.id;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            let lines = [
              '### Work Control Tower · GitHub channel receipt',
              `Command: \`${command}\` · issue comment ${trigger}`,
              `Run: ${runUrl}`,
              'Verified: owner-only GitHub issue → Actions workflow → GitHub issue reply.',
              '**This is NOT a ChatGPT Work session start and does NOT modify product code.**'
            ];
            if (command === '/work-control status') {
              const checks = [];
              const [home, optical] = await Promise.all([
                github.rest.pulls.get({owner, repo, pull_number: 170}),
                github.rest.pulls.get({owner, repo, pull_number: 166})
              ]);
              checks.push(`NH01 #170: ${home.data.state} / merged=${home.data.merged} / ${home.data.head.sha.slice(0,12)}`);
              checks.push(`EdgeGlow #166: ${optical.data.state} / merged=${optical.data.merged} / ${optical.data.head.sha.slice(0,12)}`);
              const branch = await github.rest.repos.getBranch({owner, repo, branch:'main'});
              checks.push(`main: ${branch.data.commit.sha.slice(0,12)}`);
              lines.push('', '**Live GitHub metadata (not acceptance PASS):**', ...checks.map(s => '- '+s));
            }
            await github.rest.issues.createComment({owner,repo,issue_number,body:lines.join('\n')});
