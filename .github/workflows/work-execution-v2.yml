name: Work Execution V2 · Contract Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/work_execution_v2/**"
      - ".github/workflows/work-execution-v2.yml"
      - ".github/workflows/nh01-cloud-runtime.yml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-retry-and-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify cross-SHA budget, capability and CI routing
        run: python3 -m unittest discover -s tools/work_execution_v2 -p 'test_*.py' -v
      - name: Show optical-only routing decision
        run: |
          printf '%s\n' \
            'design/manager/optical-lab/index.html' \
            'design/manager/nh01_acceptance/edgeglow-fish-static/index.html' \
            'scripts/capture_optical_lab_static_closure_v3.cjs' > /tmp/optical_paths.txt
          python3 tools/work_execution_v2/work_control.py route \
            --repo-root . --changed-file /tmp/optical_paths.txt
