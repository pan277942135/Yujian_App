name: NH01 Gemini Native V3 Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "design/**"
      - "scripts/android_runtime/**"
      - "scripts/run_android_runtime_gate.sh"
      - "scripts/verify_normal_home_*.py"
      - "scripts/verify_nh01_gemini_native_source.py"
      - "scripts/design/**"
      - ".github/workflows/nh01-cloud-runtime.yml"

concurrency:
  group: nh01-gemini-v3-runtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  YUJIAN_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  YUJIAN_RUNTIME_EVIDENCE: evidence/runtime/gemini-home-v3

jobs:
  runtime:
    runs-on: macos-15-intel
    timeout-minutes: 100
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      runtime_status: ${{ steps.package.outputs.classification }}
    steps:
      - name: Checkout exact pull request source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record canonical source commit
        id: source
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$YUJIAN_SOURCE_SHA"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "NH01_GEMINI_SOURCE_SHA=$actual"

      - name: Set up Python evidence dependencies
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install GNU coreutils for runtime gate contract tests and timeouts
        run: |
          set -euo pipefail
          if ! command -v timeout >/dev/null 2>&1 || ! command -v sha256sum >/dev/null 2>&1; then
            brew install coreutils
            echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          fi
          command -v timeout
          command -v sha256sum

      - name: Validate source package and Gemini route
        run: |
          set -euo pipefail
          mkdir -p "$YUJIAN_RUNTIME_EVIDENCE"
          python -m pip install --disable-pip-version-check -r scripts/design/requirements_nh01_cloud.txt Pillow==11.3.0
          python3 scripts/design/build_nh01_cloud_bundle.py
          python3 scripts/design/validate_nh01_cloud_bundle.py
          python3 scripts/design/build_nh01_authority_inventory.py
          python3 scripts/design/verify_nh01_cloud_viewer.py
          python3 -m unittest discover -s scripts/design/tests -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/android_runtime/tests -p 'test_nh01_*.py' -v
          python3 scripts/verify_nh01_gemini_native_source.py | tee "$YUJIAN_RUNTIME_EVIDENCE/source_audit.txt"
          python3 -m py_compile scripts/design/package_nh01_gemini_runtime_evidence.py scripts/android_runtime/aggregate_nh01_adaptive_matrix.py scripts/android_runtime/nh01_emulator_outcome.py
          bash scripts/android_runtime/tests/test_contract.sh
          bash scripts/android_runtime/tests/test_nh01_display_profile.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bootstrap verified Android recognition assets
        env:
          YUJIAN_GITHUB_TOKEN: ${{ github.token }}
        run: env -u GITHUB_SHA BUILD_SHA="$YUJIAN_SOURCE_SHA" python3 scripts/bootstrap_android_recognition_assets.py

      - name: Resolve stable SDK AAPT2
        run: |
          set -euo pipefail
          YUJIAN_AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$YUJIAN_AAPT2"
          echo "YUJIAN_AAPT2=$YUJIAN_AAPT2" >> "$GITHUB_ENV"

      - name: Android unit tests and exact-source APK build
        id: android_build
        run: |
          set -euo pipefail
          gradle -Pandroid.aapt2FromMavenOverride="$YUJIAN_AAPT2" test --stacktrace --no-daemon --max-workers=2
          gradle -Pandroid.aapt2FromMavenOverride="$YUJIAN_AAPT2" :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon --max-workers=2
          mkdir -p build/runtime-apks
          cp app/build/outputs/apk/debug/app-debug.apk build/runtime-apks/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/runtime-apks/app-debug-androidTest.apk
          python3 scripts/export_apk_model_trace.py --apk build/runtime-apks/app-debug.apk --output-dir build/runtime-apks --build-sha "$YUJIAN_SOURCE_SHA"
          (cd build/runtime-apks && sha256sum app-debug.apk app-debug-androidTest.apk model_release_contract.json apk_model_trace.json > SHA256SUMS)
          (cd build/runtime-apks && sha256sum -c SHA256SUMS)

      - name: Select standard Intel macOS emulator environment
        id: emulator_env
        run: |
          set -euo pipefail
          mkdir -p "$YUJIAN_RUNTIME_EVIDENCE/infra"
          {
            echo "runner=$RUNNER_NAME"
            echo "os=$RUNNER_OS"
            echo "architecture=$(uname -m)"
            echo "selected_acceleration=Apple_Hypervisor_Framework"
            echo "available=false"
          } | tee "$YUJIAN_RUNTIME_EVIDENCE/infra/hosted_runner_emulator_diagnostic.log"
          if [[ "$RUNNER_OS" == "macOS" && "$(uname -m)" == "x86_64" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gemini V3 Android gate on Pixel 2 API 28
        id: emulator_runtime
        if: steps.emulator_env.outputs.available == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none -partition-size 4096
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            bash scripts/design/run_nh01_emulator_runtime.sh

      - name: Record device metadata when no emulator evidence exists
        if: always()
        run: |
          if [[ -s "$YUJIAN_RUNTIME_EVIDENCE/infra/device_metadata.json" ]]; then
            echo "Preserving captured device metadata."
            exit 0
          fi
          python3 scripts/design/capture_nh01_device_metadata.py \
            --output "$YUJIAN_RUNTIME_EVIDENCE/infra/device_metadata.json" \
            --insets-dump "$YUJIAN_RUNTIME_EVIDENCE/infra/window_insets_dump.txt" \
            --allow-unavailable

      - name: Record emulator outcome when the runtime gate produced no result
        if: always() && steps.android_build.outcome == 'success'
        run: |
          set -euo pipefail
          result="$YUJIAN_RUNTIME_EVIDENCE/runtime_gate_result.json"
          if [[ ! -s "$result" ]]; then
            mkdir -p "$(dirname "$result")"
            outcome="$(python3 - "${{ steps.emulator_env.outputs.available }}" "${{ steps.emulator_runtime.outcome }}" <<'PY'
          import sys
          from scripts.android_runtime.nh01_emulator_outcome import classify_emulator_outcome
          result = classify_emulator_outcome(sys.argv[1].lower() == "true", sys.argv[2])
          print("\t".join((result.classification, result.failure_phase, result.failure_reason)))
          PY
            )"
            IFS=$'\t' read -r classification failure_phase failure_reason <<< "$outcome"
            python3 scripts/android_runtime/result.py \
              --output "$result" \
              --gate gemini-home-v2 \
              --api-level 28 \
              --build-sha "$YUJIAN_SOURCE_SHA" \
              --adb-state unknown \
              --boot-completed unknown \
              --data-free-kb "" \
              --preflight FAIL \
              --install NOT_RUN \
              --instrumentation NOT_RUN \
              --evidence NOT_RUN \
              --classification "$classification" \
              --failure-phase "$failure_phase" \
              --failure-reason "$failure_reason" \
              --summary-file "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package Gemini V3 APK and runtime evidence
        id: package
        if: always() && steps.android_build.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p build/nh01-gemini-artifact
          python3 scripts/design/package_nh01_gemini_runtime_evidence.py \
            --evidence-dir "$YUJIAN_RUNTIME_EVIDENCE" \
            --source-sha "$YUJIAN_SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --apk build/runtime-apks/app-debug.apk \
            --test-apk build/runtime-apks/app-debug-androidTest.apk \
            --source-audit "$YUJIAN_RUNTIME_EVIDENCE/source_audit.txt" \
            --device-metadata "$YUJIAN_RUNTIME_EVIDENCE/infra/device_metadata.json" \
            --artifact-dir build/nh01-gemini-artifact
          classification="$(python3 -c 'import json; print(json.load(open("build/nh01-gemini-artifact/evidence/runtime_gate_result.json"))["classification"])')"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"

      - name: Upload installable Gemini V3 APK and evidence
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-NH01-Gemini-V3-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: build/nh01-gemini-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Android build, install, launch, and core interaction gate
        if: always() && steps.package.outcome == 'success'
        run: |
          python3 - "build/nh01-gemini-artifact/evidence/runtime_gate_result.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if result.get("classification") != "PASS":
              raise SystemExit("NH01_GEMINI_ANDROID_RUNTIME_NOT_PASS: " + str(result.get("classification")))
          PY
