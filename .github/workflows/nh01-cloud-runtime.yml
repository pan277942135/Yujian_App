name: NH01 Exact-SHA API28 Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "design/**"
      - "scripts/android_runtime/**"
      - "scripts/run_android_runtime_gate.sh"
      - "scripts/verify_normal_home_*.py"
      - "scripts/design/**"
      - ".github/workflows/nh01-cloud-runtime.yml"
      - ".github/workflows/design-manager-pages.yml"

concurrency:
  group: design-manager-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  YUJIAN_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  YUJIAN_RUNTIME_EVIDENCE: evidence/runtime/normal-home-v1

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      pages_ready: ${{ steps.pages_ready.outputs.ready }}
      runtime_status: ${{ steps.status.outputs.classification }}
    steps:
      - name: Checkout exact pull request source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record canonical source commit
        id: source
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$YUJIAN_SOURCE_SHA"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "NH01_SOURCE_SHA=$actual"

      - name: Set up Python evidence dependencies
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate NH01 source package
        run: |
          python -m pip install --disable-pip-version-check -r scripts/design/requirements_nh01_cloud.txt Pillow==11.3.0
          python3 scripts/design/build_nh01_cloud_bundle.py
          python3 scripts/design/validate_nh01_cloud_bundle.py
          python3 scripts/design/build_nh01_authority_inventory.py
          python3 scripts/design/verify_nh01_cloud_viewer.py
          python3 -m unittest discover -s scripts/design/tests -p 'test_*.py' -v
          bash scripts/android_runtime/tests/test_contract.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bootstrap verified Android recognition assets
        env:
          YUJIAN_GITHUB_TOKEN: ${{ github.token }}
        run: env -u GITHUB_SHA BUILD_SHA="$YUJIAN_SOURCE_SHA" python3 scripts/bootstrap_android_recognition_assets.py

      - name: Resolve stable SDK AAPT2
        run: |
          set -euo pipefail
          YUJIAN_AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$YUJIAN_AAPT2"
          echo "YUJIAN_AAPT2=$YUJIAN_AAPT2" >> "$GITHUB_ENV"

      - name: Android unit tests and one-time APK build
        run: |
          set -euo pipefail
          gradle -Pandroid.aapt2FromMavenOverride="$YUJIAN_AAPT2" test --stacktrace --no-daemon --max-workers=2
          gradle -Pandroid.aapt2FromMavenOverride="$YUJIAN_AAPT2" :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon --max-workers=2
          mkdir -p build/runtime-apks
          cp app/build/outputs/apk/debug/app-debug.apk build/runtime-apks/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/runtime-apks/app-debug-androidTest.apk
          python3 scripts/export_apk_model_trace.py --apk build/runtime-apks/app-debug.apk --output-dir build/runtime-apks --build-sha "$YUJIAN_SOURCE_SHA"
          (cd build/runtime-apks && sha256sum app-debug.apk app-debug-androidTest.apk model_release_contract.json apk_model_trace.json > SHA256SUMS)
          (cd build/runtime-apks && sha256sum -c SHA256SUMS)

      - name: Single hosted-runner KVM preflight
        id: kvm
        run: |
          set -euo pipefail
          mkdir -p "$YUJIAN_RUNTIME_EVIDENCE/infra"
          {
            echo "runner=$RUNNER_NAME"
            echo "os=$RUNNER_OS"
            echo "kernel=$(uname -r)"
            if [[ -e /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
              echo "kvm_available=true"
              echo "available=true" >> "$GITHUB_OUTPUT"
            else
              echo "kvm_available=false"
              echo "available=false" >> "$GITHUB_OUTPUT"
            fi
          } | tee "$YUJIAN_RUNTIME_EVIDENCE/infra/hosted_runner_kvm_preflight.log"

      - name: Run existing Normal Home harness on Pixel 2 API 28
        id: emulator_runtime
        if: steps.kvm.outputs.available == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 4096
          disable-animations: true
          script: |
            set -uo pipefail
            mkdir -p "$YUJIAN_RUNTIME_EVIDENCE/infra"
            python3 scripts/design/capture_nh01_device_metadata.py \
              --output "$YUJIAN_RUNTIME_EVIDENCE/infra/device_metadata.json" \
              --insets-dump "$YUJIAN_RUNTIME_EVIDENCE/infra/window_insets_dump.txt"
            export ADB="$(command -v adb)"
            rc=0
            bash scripts/run_android_runtime_gate.sh \
              --gate normal-home-v1 \
              --api-level 28 \
              --build-sha "$YUJIAN_SOURCE_SHA" \
              --app-apk build/runtime-apks/app-debug.apk \
              --test-apk build/runtime-apks/app-debug-androidTest.apk \
              --evidence-dir "$YUJIAN_RUNTIME_EVIDENCE" || rc=$?
            screenshot="$YUJIAN_RUNTIME_EVIDENCE/normal-home-v1/04_normal_home_runtime_1080x1920.png"
            if [[ -s "$screenshot" ]]; then
              apk_sha="$(sha256sum build/runtime-apks/app-debug.apk | awk '{print $1}')"
              python3 scripts/design/compare_nh01_android_runtime.py \
                --screenshot "$screenshot" \
                --output-dir "$YUJIAN_RUNTIME_EVIDENCE/normal-home-v1" \
                --source-sha "$YUJIAN_SOURCE_SHA" \
                --apk-sha256 "$apk_sha" \
                --run-id "$GITHUB_RUN_ID" || echo "NH01_ANDROID_PIXEL_DIFF=REVIEW_REQUIRED_SCRIPT_FAILED"
            fi
            exit "$rc"

      - name: Record unavailable device metadata if Runner did not start
        if: always()
        run: |
          python3 scripts/design/capture_nh01_device_metadata.py \
            --output "$YUJIAN_RUNTIME_EVIDENCE/infra/device_metadata.json" \
            --insets-dump "$YUJIAN_RUNTIME_EVIDENCE/infra/window_insets_dump.txt" \
            --allow-unavailable

      - name: Materialize truthful BLOCKED_INFRA when Runtime did not start
        if: always()
        run: |
          set -euo pipefail
          result="$YUJIAN_RUNTIME_EVIDENCE/runtime_gate_result.json"
          if [[ ! -s "$result" ]]; then
            mkdir -p "$(dirname "$result")"
            if [[ "${{ steps.kvm.outputs.available }}" != "true" ]]; then
              reason="HOSTED_RUNNER_KVM_UNAVAILABLE"
            else
              reason="EMULATOR_RUNNER_FAILED_BEFORE_HARNESS"
            fi
            python3 scripts/android_runtime/result.py \
              --output "$result" \
              --gate normal-home-v1 \
              --api-level 28 \
              --build-sha "$YUJIAN_SOURCE_SHA" \
              --adb-state unknown \
              --boot-completed unknown \
              --data-free-kb "" \
              --preflight FAIL \
              --install NOT_RUN \
              --instrumentation NOT_RUN \
              --evidence NOT_RUN \
              --classification BLOCKED_INFRA \
              --failure-phase EMULATOR_RUNNER \
              --failure-reason "$reason" \
              --summary-file "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage source SHA, APK, Runtime and visual evidence
        id: status
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/nh01-runtime-artifact
          python3 scripts/design/package_nh01_runtime_evidence.py \
            --evidence-dir "$YUJIAN_RUNTIME_EVIDENCE" \
            --source-sha "$YUJIAN_SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --apk build/runtime-apks/app-debug.apk \
            --test-apk build/runtime-apks/app-debug-androidTest.apk \
            --model-contract build/runtime-apks/model_release_contract.json \
            --model-trace build/runtime-apks/apk_model_trace.json \
            --device-metadata "$YUJIAN_RUNTIME_EVIDENCE/infra/device_metadata.json" \
            --artifact-dir build/nh01-runtime-artifact \
            --web-root .
          classification="$(python3 -c 'import json; print(json.load(open("build/nh01-runtime-artifact/runtime_gate_result.json"))["classification"])')"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"

      - name: Upload installable APK and Runtime evidence
        id: upload_runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-NH01-API28-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: build/nh01-runtime-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Prepare exact-SHA Acceptance Center source
        if: always()
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R design _site/design
          BUILD_SHORT="$(printf '%.12s' "$YUJIAN_SOURCE_SHA")"
          sed -i "s/__DESIGN_MANAGER_BUILD__/$YUJIAN_SOURCE_SHA/g" _site/design/manager/index.html
          sed -i "s/__DESIGN_MANAGER_BUILD_SHORT__/$BUILD_SHORT/g" _site/design/manager/index.html
          sed -i "s/__NH01_SOURCE_SHA__/$YUJIAN_SOURCE_SHA/g" _site/design/manager/nh01_acceptance/index.html
          sed -i "s/__NH01_VIEWER_BUILD__/$YUJIAN_SOURCE_SHA/g" _site/design/manager/nh01_acceptance/index.html
          printf '{"sha":"%s","short_sha":"%s"}\n' "$YUJIAN_SOURCE_SHA" "$BUILD_SHORT" > _site/design/manager/build.json
          touch _site/.nojekyll

      - name: Install Chromium for exact-source Viewer checks
        if: always()
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/nh01-playwright" playwright@1.63.0
          "$RUNNER_TEMP/nh01-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Build Runtime Viewer and verify with Chromium
        id: browser
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/design/package_nh01_runtime_evidence.py \
            --evidence-dir "$YUJIAN_RUNTIME_EVIDENCE" \
            --source-sha "$YUJIAN_SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --apk build/runtime-apks/app-debug.apk \
            --device-metadata "$YUJIAN_RUNTIME_EVIDENCE/infra/device_metadata.json" \
            --web-root _site
          python3 -m http.server 8766 --directory _site > "$RUNNER_TEMP/nh01-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/design/manager/nh01_acceptance/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8766/design/manager/nh01_acceptance/ >/dev/null
          PLAYWRIGHT_MODULE_DIR="$RUNNER_TEMP/nh01-playwright/node_modules" \
            node scripts/design/verify_nh01_viewer_browser.mjs \
              --base-url=http://127.0.0.1:8766 \
              --expected-source-sha="$YUJIAN_SOURCE_SHA" \
              --output-dir "$RUNNER_TEMP/nh01-browser"
          mkdir -p "$RUNNER_TEMP/nh01-preview-diff"
          python3 scripts/design/compare_nh01_structured_preview.py \
            --structured "$RUNNER_TEMP/nh01-browser/NH01_Structured_Preview_1080x1920.png" \
            --output-dir "$RUNNER_TEMP/nh01-preview-diff" \
            --source-sha "$YUJIAN_SOURCE_SHA"
          python3 scripts/design/record_nh01_browser_evidence.py \
            --report "$RUNNER_TEMP/nh01-browser/NH01_Browser_Viewer_Report.json" \
            --site-root _site \
            --expected-source-sha "$YUJIAN_SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --preview-diff-report "$RUNNER_TEMP/nh01-preview-diff/NH01_ROI_Report.json" \
            --preview-screenshot "$RUNNER_TEMP/nh01-browser/NH01_Structured_Preview_1080x1920.png" \
            --preview-diff-dir "$RUNNER_TEMP/nh01-preview-diff"
          PLAYWRIGHT_MODULE_DIR="$RUNNER_TEMP/nh01-playwright/node_modules" \
            node scripts/design/verify_nh01_viewer_browser.mjs \
              --base-url=http://127.0.0.1:8766 \
              --expected-source-sha="$YUJIAN_SOURCE_SHA" \
              --require-browser-diff \
              --output-dir "$RUNNER_TEMP/nh01-browser-final"
          python3 scripts/design/record_nh01_browser_evidence.py \
            --report "$RUNNER_TEMP/nh01-browser-final/NH01_Browser_Viewer_Report.json" \
            --site-root _site \
            --expected-source-sha "$YUJIAN_SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --preview-diff-report "$RUNNER_TEMP/nh01-preview-diff/NH01_ROI_Report.json" \
            --preview-screenshot "$RUNNER_TEMP/nh01-browser/NH01_Structured_Preview_1080x1920.png" \
            --preview-diff-dir "$RUNNER_TEMP/nh01-preview-diff"
          python3 scripts/design/package_nh01_runtime_evidence.py \
            --evidence-dir "$YUJIAN_RUNTIME_EVIDENCE" \
            --source-sha "$YUJIAN_SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --artifact-url "${{ steps.upload_runtime.outputs.artifact-url }}" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --apk build/runtime-apks/app-debug.apk \
            --device-metadata "$YUJIAN_RUNTIME_EVIDENCE/infra/device_metadata.json" \
            --web-root _site
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload NH01 browser and structured-diff evidence
        if: always() && steps.browser.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NH01-Browser-Comparison-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nh01-browser-final/
            ${{ runner.temp }}/nh01-preview-diff/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Acceptance Center Pages artifact
        id: upload_pages
        if: always() && steps.browser.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Mark Pages artifact ready
        id: pages_ready
        if: steps.upload_pages.outcome == 'success'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Enforce real Android Runtime gate
        if: always()
        run: |
          python3 - "$YUJIAN_RUNTIME_EVIDENCE/runtime_gate_result.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if result.get("classification") != "PASS":
              raise SystemExit("NH01_ANDROID_RUNTIME_NOT_PASS: " + str(result.get("classification")))
          PY

  deploy:
    if: always() && needs.runtime.outputs.pages_ready == 'true'
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: design-manager-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact source for live-browser verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.runtime.outputs.source_sha }}

      - name: Deploy NH01 Acceptance Center
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Set up Node for live browser verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/nh01-playwright" playwright@1.63.0
          "$RUNNER_TEMP/nh01-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify published Viewer against exact source SHA
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/nh01-playwright/node_modules
        run: |
          node scripts/design/verify_nh01_viewer_browser.mjs \
            --base-url="${{ steps.deployment.outputs.page_url }}" \
            --expected-source-sha="${{ needs.runtime.outputs.source_sha }}" \
            --output-dir "$RUNNER_TEMP/nh01-live-browser"

      - name: Upload published Viewer verification
        uses: actions/upload-artifact@v4
        with:
          name: NH01-Published-Viewer-${{ github.run_id }}-${{ needs.runtime.outputs.source_sha }}
          path: ${{ runner.temp }}/nh01-live-browser
          if-no-files-found: error
          retention-days: 30
