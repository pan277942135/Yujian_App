name: Codex Fish Knowledge Release APK

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  YUJIAN_FISH_KNOWLEDGE_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
  DETECTOR_BUNDLE_URL: https://github.com/pan277942135/Yujian/releases/download/detector-model-v0.1/det_fish_v0_1_android_bundle.zip
  DETECTOR_BUNDLE_SHA256: 246ddacaf89ca7ecc9c64a47d3e12c5ee9088d92c763a38626778505ae8c15ee

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download verified classifier asset
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            -o app/src/main/assets/fish_classifier.tflite \
            https://github.com/pan277942135/Yujian/releases/download/mobile-model-v0.2/fish_classifier_v0_2.tflite
          python3 scripts/verify_production_model.py

      - name: Download verified detector bundle
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/detector_bundle.zip "$DETECTOR_BUNDLE_URL"
          echo "$DETECTOR_BUNDLE_SHA256  /tmp/detector_bundle.zip" | sha256sum -c -
          mkdir -p /tmp/detector_bundle app/src/main/assets app/src/androidTest/assets/detector
          unzip -q /tmp/detector_bundle.zip -d /tmp/detector_bundle
          cp /tmp/detector_bundle/fish_detector_yolox_nano_v0_1.onnx app/src/main/assets/
          cp /tmp/detector_bundle/detector_metadata.json app/src/main/assets/
          cp /tmp/detector_bundle/recognition_pipeline_v1.json app/src/main/assets/
          cp /tmp/detector_bundle/golden_cases.json app/src/androidTest/assets/detector/
          rm -rf app/src/androidTest/assets/detector/golden
          cp -R /tmp/detector_bundle/golden app/src/androidTest/assets/detector/golden
          python3 scripts/verify_production_detector.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble release
        shell: bash
        run: |
          gradle :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Align and sign universal APK
        shell: bash
        run: |
          build_tools="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/yujian-codex-release.keystore" \
            -storepass android -keypass android -alias yujian-codex \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Yujian,O=Yujian,C=CN"
          "$build_tools/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/app-universal-release-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/yujian-codex-release.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --out app-universal-release.apk \
            "$RUNNER_TEMP/app-universal-release-aligned.apk"
          "$build_tools/apksigner" verify --verbose app-universal-release.apk
          unzip -l app-universal-release.apk | rg 'classes.*\\.dex|AndroidManifest.xml'
          sha256sum app-universal-release.apk
          du -h app-universal-release.apk

      - name: Upload universal release APK
        uses: actions/upload-artifact@v4
        with:
          name: Yujian-Fish-Knowledge-Production-Verification-v2-8b8e6db
          path: app-universal-release.apk
          if-no-files-found: error
          retention-days: 7
