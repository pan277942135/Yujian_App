name: Normal Home Spec Governance

on:
  push:
    paths:
      - 'design/pages/home/normal_home/**'
      - 'design/system_v3/07_Responsive_System/**'
      - 'scripts/design/validate_nh01_responsive_layout_contract_v2.py'
      - 'harness/FEATURE_MATRIX.yaml'
      - 'harness/PHASE_TASK_STATE_MACHINE.yaml'
      - 'harness/UNIFIED_CONTRACT_REGISTRY.yaml'
      - 'design/qa/NH01_ADAPTIVE_VISUAL_BALANCE_V2.md'
      - 'scripts/design/verify_normal_home_contract_v1.py'
      - 'scripts/design/measure_normal_home_frozen_roi_v1.py'
      - 'scripts/design/audit_normal_home_real_media_v1.py'
      - 'design/system/core_visual_v1/reference/normal_home_v1.png'
      - 'design/system/backgrounds/morning_lake_v1/assets/Morning_Lake_Master_V1.png'
  pull_request:
    paths:
      - 'design/pages/home/normal_home/**'
      - 'design/system_v3/07_Responsive_System/**'
      - 'scripts/design/validate_nh01_responsive_layout_contract_v2.py'
      - 'harness/FEATURE_MATRIX.yaml'
      - 'harness/PHASE_TASK_STATE_MACHINE.yaml'
      - 'harness/UNIFIED_CONTRACT_REGISTRY.yaml'
      - 'design/qa/NH01_ADAPTIVE_VISUAL_BALANCE_V2.md'
      - 'scripts/design/verify_normal_home_contract_v1.py'
      - 'design/system/core_visual_v1/reference/normal_home_v1.png'
      - 'design/system/backgrounds/morning_lake_v1/assets/Morning_Lake_Master_V1.png'

permissions:
  contents: read

jobs:
  verify-normal-home-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit and immutable source pixels
        uses: actions/checkout@v4
      - name: Check Normal Home authority, source SHA and legacy 46-case and current Gemini 20-case matrices
        run: python3 scripts/design/verify_normal_home_contract_v1.py
      - name: Measure verified Frozen CTA and Camera pixel candidates
        run: python3 scripts/design/measure_normal_home_frozen_roi_v1.py
      - name: Install responsive-contract validation dependencies
        run: python -m pip install jsonschema==4.25.1 PyYAML==6.0.3
      - name: Validate NH01 responsive contract, six frozen anchors and control-plane bindings
        run: python3 scripts/design/validate_nh01_responsive_layout_contract_v2.py
      - name: Inventory available original fish photograph candidates
        run: python3 scripts/design/audit_normal_home_real_media_v1.py
