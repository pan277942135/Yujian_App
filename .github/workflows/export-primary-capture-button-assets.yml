name: Export Primary Capture Button Source Assets

on:
  push:
    branches:
      - chore/design-experience-governance-v1
    paths:
      - ".github/workflows/export-primary-capture-button-assets.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload source assets
        uses: actions/upload-artifact@v4
        with:
          name: Primary-Capture-Button-Source-Assets
          path: design/system/components/primary_capture_button/assets/
          if-no-files-found: error
          retention-days: 1
