name: Materialize Auth Frozen Authorities

on:
  push:
    branches:
      - chore/design-experience-governance-v1
    paths:
      - '.auth_assets/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/design-experience-governance-v1
          fetch-depth: 0

      - name: Rebuild uploaded sources and convert to PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p design/pages/account_privacy/Login/frozen
          mkdir -p design/pages/account_privacy/Register/frozen

          cat .auth_assets/login_*.b64 | base64 -d > /tmp/login_source
          cat .auth_assets/register_*.b64 | base64 -d > /tmp/register_source

          test "$(sha256sum /tmp/login_source | awk '{print $1}')" = "2d338ae93153339f96d8d06759f4676ca9ee9df83a071375ed537683b6ce114c"
          test "$(sha256sum /tmp/register_source | awk '{print $1}')" = "14f63ae6e051f955fbefb020840c24f42e86ced88476f2fb7e0d233733ee4d35"

          python3 -m pip install --quiet pillow
          python3 -c "from PIL import Image; pairs=[('/tmp/login_source','design/pages/account_privacy/Login/frozen/Login_V2_1_Frozen_Final.png'),('/tmp/register_source','design/pages/account_privacy/Register/frozen/Register_V2_Frozen_Final.png')]; [(lambda im,dst: (im.size==(864,1536) or (_ for _ in ()).throw(AssertionError(im.size)), im.convert('RGB').save(dst,'PNG',optimize=True,compress_level=9)))(Image.open(src),dst) for src,dst in pairs]"

          {
            echo "Login source SHA-256: 2d338ae93153339f96d8d06759f4676ca9ee9df83a071375ed537683b6ce114c"
            echo "Register source SHA-256: 14f63ae6e051f955fbefb020840c24f42e86ced88476f2fb7e0d233733ee4d35"
            sha256sum design/pages/account_privacy/Login/frozen/Login_V2_1_Frozen_Final.png
            sha256sum design/pages/account_privacy/Register/frozen/Register_V2_Frozen_Final.png
          } > design/pages/account_privacy/auth_frozen_visual_sha256.txt

          rm -rf .auth_assets
          rm -f .github/workflows/materialize-auth-design-assets.yml

      - name: Commit final PNG authorities
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(design): archive final Login and Register PNG authorities"
          git push origin HEAD:chore/design-experience-governance-v1
