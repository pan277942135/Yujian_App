name: Materialize Auth Frozen Authorities

on:
  push:
    branches:
      - chore/design-experience-governance-v1
    paths:
      - '.auth_assets/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/design-experience-governance-v1
          fetch-depth: 0

      - name: Rebuild exact PNG authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p design/pages/account_privacy/Login/frozen
          mkdir -p design/pages/account_privacy/Register/frozen

          cat .auth_assets/login/login_* | base64 -d > design/pages/account_privacy/Login/frozen/Login_V2_1_Frozen_Final.png
          cat .auth_assets/register/register_* | base64 -d > design/pages/account_privacy/Register/frozen/Register_V2_Frozen_Final.png

          test "$(sha256sum design/pages/account_privacy/Login/frozen/Login_V2_1_Frozen_Final.png | awk '{print $1}')" = "c9323f11a9d935f8e98b95276a73930b549b20262eddb5a57968a10835c7486e"
          test "$(sha256sum design/pages/account_privacy/Register/frozen/Register_V2_Frozen_Final.png | awk '{print $1}')" = "d96f5d2d1df254336031ca68f67bc63b680f73d0924b82fc96ebe22abb13d0fe"

          rm -rf .auth_assets
          rm -f .github/workflows/materialize-auth-design-assets.yml

      - name: Commit exact PNG authorities
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(design): archive exact Login and Register frozen PNG authorities"
          git push origin HEAD:chore/design-experience-governance-v1
