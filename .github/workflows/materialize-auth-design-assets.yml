name: Materialize Auth Design Assets

on:
  push:
    branches:
      - chore/design-experience-governance-v1
    paths:
      - '.auth_assets/**'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/design-experience-governance-v1
          fetch-depth: 0

      - name: Check complete chunk set
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          required=(
            login_00 login_01 login_02 login_03 login_04 login_05
            register_00 register_01 register_02 register_03 register_04 register_05
          )
          for n in "${required[@]}"; do
            if [[ ! -f ".auth_assets/${n}.b64" ]]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Materialize frozen assets
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p design/pages/account_privacy/Login/frozen
          mkdir -p design/pages/account_privacy/Register/frozen
          mkdir -p design/pages/account_privacy/shared/auth_v1

          cat .auth_assets/login_*.b64 | base64 -d > /tmp/login_source
          cat .auth_assets/register_*.b64 | base64 -d > /tmp/register_source

          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for src, dst in [
              ('/tmp/login_source', 'design/pages/account_privacy/Login/frozen/Login_V2_1_Frozen_Final.png'),
              ('/tmp/register_source', 'design/pages/account_privacy/Register/frozen/Register_V2_Frozen_Final.png'),
          ]:
              im = Image.open(src).convert('RGB')
              assert im.size == (864, 1536), (src, im.size)
              im.save(dst, 'PNG', optimize=True, compress_level=9)
          PY

          sha256sum             design/pages/account_privacy/Login/frozen/Login_V2_1_Frozen_Final.png             design/pages/account_privacy/Register/frozen/Register_V2_Frozen_Final.png             design/pages/account_privacy/shared/auth_v1/Auth_Form_States_V1.webp             design/pages/account_privacy/shared/auth_v1/Auth_Interaction_Layout_Contract_V1.webp             > design/pages/account_privacy/shared/auth_v1/asset_sha256.txt

          rm -rf .auth_assets

      - name: Commit materialized assets
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(design): materialize frozen auth visual assets"
          git push origin HEAD:chore/design-experience-governance-v1
