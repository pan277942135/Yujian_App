name: Materialize Login Frozen Authority

on:
  push:
    branches:
      - chore/design-experience-governance-v1
    paths:
      - '.auth_assets/login_*.b64'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/design-experience-governance-v1
          fetch-depth: 0
      - name: Check complete chunk set
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq -w 1 6); do
            test -f ".auth_assets/login_${n}.b64" || { echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Materialize exact uploaded visual
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p design/pages/account_privacy/Login/frozen
          cat .auth_assets/login_*.b64 | base64 -d > design/pages/account_privacy/Login/frozen/Login_V2_1_Frozen_Final.jpg
          test "$(sha256sum design/pages/account_privacy/Login/frozen/Login_V2_1_Frozen_Final.jpg | awk '{print $1}')" = "2d338ae93153339f96d8d06759f4676ca9ee9df83a071375ed537683b6ce114c"
          rm -rf .auth_assets
      - name: Commit authority
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(design): archive exact Login V2.1 visual authority"
          git push origin HEAD:chore/design-experience-governance-v1
