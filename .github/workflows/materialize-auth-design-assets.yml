name: Finalize Auth PNG Authorities

on:
  push:
    branches:
      - chore/design-experience-governance-v1
    paths:
      - '.auth_finalize'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/design-experience-governance-v1
          fetch-depth: 0

      - name: Convert frozen authorities to true PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 -c "from PIL import Image; paths=['design/pages/account_privacy/Login/frozen/Login_V2_1_Frozen_Final.png','design/pages/account_privacy/Register/frozen/Register_V2_Frozen_Final.png']; [(lambda p,im: (im.size==(864,1536) or (_ for _ in ()).throw(AssertionError(im.size)), im.convert('RGB').save(p+'.tmp','PNG',optimize=True,compress_level=9)))(p,Image.open(p)) for p in paths]"
          mv design/pages/account_privacy/Login/frozen/Login_V2_1_Frozen_Final.png.tmp design/pages/account_privacy/Login/frozen/Login_V2_1_Frozen_Final.png
          mv design/pages/account_privacy/Register/frozen/Register_V2_Frozen_Final.png.tmp design/pages/account_privacy/Register/frozen/Register_V2_Frozen_Final.png

          {
            echo "Login source SHA-256: 2d338ae93153339f96d8d06759f4676ca9ee9df83a071375ed537683b6ce114c"
            echo "Register source SHA-256: 14f63ae6e051f955fbefb020840c24f42e86ced88476f2fb7e0d233733ee4d35"
            sha256sum design/pages/account_privacy/Login/frozen/Login_V2_1_Frozen_Final.png
            sha256sum design/pages/account_privacy/Register/frozen/Register_V2_Frozen_Final.png
          } > design/pages/account_privacy/auth_frozen_visual_sha256.txt

          rm -f .auth_finalize
          rm -f .github/workflows/materialize-auth-design-assets.yml

      - name: Commit finalized authorities
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(design): finalize auth visual authorities as true PNG"
          git push origin HEAD:chore/design-experience-governance-v1
