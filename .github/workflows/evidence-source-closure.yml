name: Evidence Source Closure

on:
  push:
    branches:
      - fix/evidence-source-verdict-v1
  pull_request:
    branches:
      - audit/design-system-v3-1-phase1-master-baseline
    paths:
      - scripts/verify_runtime_evidence_source_closure.py
      - scripts/verify_normal_home_a4_runtime_evidence.py
      - scripts/create_first_use_camera_guide_visual_evidence.py
      - scripts/test_runtime_evidence_source_closure.py
      - .github/workflows/evidence-source-closure.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-conditional-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Pillow for integrity tests
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Check acceptance scripts syntax
        run: |
          python -m py_compile scripts/verify_runtime_evidence_source_closure.py scripts/verify_normal_home_a4_runtime_evidence.py scripts/create_first_use_camera_guide_visual_evidence.py
      - name: Verify reachable PASS and fail-closed regressions
        run: python -m unittest discover -s scripts -p 'test_runtime_evidence_source_closure.py' -v
