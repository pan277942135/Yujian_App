name: Page Freeze Pipeline W4 Evidence

on:
  push:
    branches:
      - "work/w4-*"
      - "work/w3-w4-integration-*"
    paths:
      - "design/**"
      - "scripts/design/**"
      - ".github/workflows/page-freeze-pipeline-w4-evidence.yml"
  pull_request:
    branches: [main]
    paths:
      - "design/system_v3/06_Asset_System/Page_Resource_Binding*"
      - "design/system_v3/07_Responsive_System/Page_*"
      - "scripts/design/schemas/Page_Evidence_Manifest_Schema_V1.json"
      - "design/pages/**"
      - "design/manager/**"
      - "design/registry/experience_registry_v1.json"
      - "scripts/design/page_freeze_runner.py"
      - "scripts/design/verify_page_workspace.mjs"
      - "scripts/design/validate_page_responsive_contract.py"
      - "scripts/design/validate_page_resource_binding.py"
      - "scripts/design/tests/test_page_freeze_runner.py"
      - "scripts/design/tests/verify_page_workspace_fixtures.mjs"
      - ".github/workflows/page-freeze-pipeline-w4-evidence.yml"

permissions:
  contents: read

concurrency:
  group: page-freeze-w4-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

env:
  BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SITE_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  page-evidence:
    name: W4 exact-SHA page evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install page validator dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r scripts/design/requirements_nh01_cloud.txt PyYAML==6.0.3

      - name: Control Plane Admission
        run: python scripts/validate_control_plane_admission.py

      - name: W4 positive and fail-closed tests
        run: |
          python -m unittest discover -s scripts/design/tests -p 'test_*.py' -v
          python scripts/design/validate_responsive_page_freeze_checklist.py \
            --checklist design/system_v3/07_Responsive_System/Responsive_Page_Freeze_Checklist_Template_V1.json \
            --mode template

      - name: Set up Node for workspace verifier fixtures
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/page-workspace-playwright" playwright@1.63.0
          "$RUNNER_TEMP/page-workspace-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Workspace verifier browser fixtures
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/page-workspace-playwright/node_modules
        run: |
          node --check scripts/design/verify_page_workspace.mjs
          node --check scripts/design/tests/verify_page_workspace_fixtures.mjs
          node scripts/design/tests/verify_page_workspace_fixtures.mjs

      - name: Prepare exact candidate Pages bundle without deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R design _site/design
          if [ -d previews ]; then cp -R previews _site/previews; fi
          mkdir -p _site/app/src/main/res/drawable-nodpi
          cp app/src/main/res/drawable-nodpi/normal_home_default_avatar_v2.png \
            _site/app/src/main/res/drawable-nodpi/normal_home_default_avatar_v2.png
          BUILD_SHORT="${BUILD_SHA:0:12}"
          sed -i "s/__DESIGN_MANAGER_BUILD__/${BUILD_SHA}/g" _site/design/manager/index.html
          sed -i "s/__DESIGN_MANAGER_BUILD_SHORT__/${BUILD_SHORT}/g" _site/design/manager/index.html
          sed -i "s/__NH01_SOURCE_SHA__/${BUILD_SHA}/g" _site/design/manager/nh01_acceptance/index.html
          sed -i "s/__NH01_VIEWER_BUILD__/${BUILD_SHA}/g" _site/design/manager/nh01_acceptance/index.html
          if [ -f _site/previews/pr-176/index.html ]; then
            sed -i "s/__NH01_PREVIEW_BUILD__/${BUILD_SHA}/g" _site/previews/pr-176/index.html
          fi
          if [ -f _site/previews/pr-176/design/manager/nh01_acceptance/gemini-native-preview.html ]; then
            sed -i "s/__NH01_GEMINI_PREVIEW_BUILD__/${BUILD_SHA}/g" _site/previews/pr-176/design/manager/nh01_acceptance/gemini-native-preview.html
            sed -i "s/__NH01_PREVIEW_DEPLOYMENT_SHA__/${BUILD_SHA}/g" _site/previews/pr-176/design/manager/nh01_acceptance/gemini-native-preview.html
          fi
          printf '{"sha":"%s","short_sha":"%s"}\n' "${BUILD_SHA}" "${BUILD_SHORT}" > _site/design/manager/build.json
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./design/manager/">
            <title>YuJian Design Manager</title>
          </head>
          <body>
            <p><a href="./design/manager/">Open YuJian Design Manager</a></p>
          </body>
          </html>
          EOF
          git diff --quiet HEAD --

      - name: Scan the actual staged Pages candidate before artifact upload
        run: |
          python scripts/design/validate_page_resource_binding.py \
            --all-pages \
            --required-page-id home_normal_v1 \
            --required-page-id home_empty_v2 \
            --required-page-id auth_login_v2 \
            --site-root _site \
            --source-sha "$BUILD_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --report "$RUNNER_TEMP/page-resource-binding-report.json"

      - name: Verify actual staged Design Manager workspace when W3 adapter exists
        shell: bash
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/page-workspace-playwright/node_modules
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/page-freeze-w4-evidence/browser"
          mkdir -p "$evidence_root"
          if [ ! -f _site/design/manager/page_workspace_adapters.js ]; then
            echo "W3 workspace adapter is not present on this exact candidate SHA; actual workspace browser checks remain NOT_RUN."
            exit 0
          fi
          python3 -m http.server 8765 --directory _site > "$RUNNER_TEMP/page-workspace-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/design/manager/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/design/manager/ >/dev/null
          failed=0
          for page_id in home_normal_v1 home_empty_v2 auth_login_v2; do
            output_dir="$evidence_root/$page_id"
            if ! python scripts/design/page_freeze_runner.py verify-page-workspace \
              --page-id "$page_id" \
              --candidate-url http://127.0.0.1:8765/design/manager/ \
              --source-sha "$BUILD_SHA" \
              --output-dir "$output_dir"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Generate per-page W4 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/page-freeze-w4-evidence"
          mkdir -p "$evidence_root"
          failed=0
          for entry in "home_normal_v1:NH01" "home_empty_v2:EmptyHome" "auth_login_v2:Login"; do
            page_id="${entry%%:*}"
            label="${entry##*:}"
            browser_args=()
            browser_report="$evidence_root/browser/$page_id/workspace-browser-report.json"
            if [ -f "$browser_report" ]; then browser_args+=(--browser-report "$browser_report"); fi
            if ! python scripts/design/page_freeze_runner.py validate-page \
              --page-id "$page_id" \
              --evidence-name "$label" \
              --source-sha "$BUILD_SHA" \
              --publication-report "$RUNNER_TEMP/page-resource-binding-report.json" \
              "${browser_args[@]}" \
              --output-dir "$evidence_root"; then
              failed=1
              continue
            fi
            if ! python scripts/design/page_freeze_runner.py validate-manifest \
              --manifest "$evidence_root/${label}_Evidence/evidence-manifest.json" \
              --expected-source-sha "$BUILD_SHA" \
              --expected-run-id "$GITHUB_RUN_ID"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload W4 manifests and validator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W4-Page-Evidence-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/page-freeze-w4-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload W2 Pages bundle scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: W4-Pages-Bundle-Scan-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/page-resource-binding-report.json
          if-no-files-found: warn
          retention-days: 30
