name: SWOS Web Input Pack Live SHA Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "design/pages/recognition/web/implementation_input_pack/**"
      - "design/pages/recognition/web/WEB_HIFI_GAP_MATRIX_V2.md"
      - "design/pages/recognition/web/contracts/Authority_References_V2.json"
      - "design/pages/recognition/web/contracts/Work_B_Implementation_Mapping_V2.json"
      - "scripts/verify_swos_web_input_pack_live.sh"
      - ".github/workflows/swos-web-input-pack-live-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swos-web-input-pack-live-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'pan277942135/Yujian_App'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the exact proposed design tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate manifest and audit live cross-repository refs
        env:
          DESIGN_REF: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_swos_web_input_pack_live.sh --report | tee "$RUNNER_TEMP/swos-live-audit.txt"
          cat "$RUNNER_TEMP/swos-live-audit.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live audit report
        uses: actions/upload-artifact@v4
        with:
          name: swos-web-input-pack-live-audit
          path: ${{ runner.temp }}/swos-live-audit.txt
          if-no-files-found: error
          retention-days: 14
