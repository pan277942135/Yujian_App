name: Normal Home Real Photo E2E V2

on:
  push:
    branches:
      - test/normal-home-real-photo-e2e-v2
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: normal-home-real-photo-e2e-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-photo-e2e:
    name: Real photo Normal Home E2E (API 28 only)
    runs-on: [self-hosted, yujian-android, api28]
    timeout-minutes: 75
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout validation HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        continue-on-error: true

      - name: Record runner and verify exact validation scope
        id: preflight
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p evidence/logs evidence/photo evidence/screenshots
          exec > >(tee -a evidence/logs/runner.log) 2>&1
          fail() { printf '%s\n' "$1" > evidence/failure_step.txt; echo "BLOCKED_AT_EXACT_STEP=$1: $2"; exit 1; }
          echo "runner_name=$RUNNER_NAME"
          echo "hostname=$(hostname)"
          echo "runner_os=$RUNNER_OS"
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then fail RUNNER "checkout did not produce a git worktree"; fi
          validation_head=$(git rev-parse HEAD)
          if [[ "$validation_head" != "$GITHUB_SHA" ]]; then fail RUNNER "checked out HEAD $validation_head does not match event SHA $GITHUB_SHA"; fi
          printf '%s\n' "$validation_head" > evidence/validation_head.txt
          expected_main=3cd0753be926c3a8cc94ac56c97c9103febc6663
          if ! git cat-file -e "$expected_main^{commit}"; then fail RUNNER "authoritative main commit $expected_main is missing from checkout"; fi
          merge_base=$(git merge-base "$expected_main" "$validation_head" 2>/dev/null || true)
          if [[ "$merge_base" != "$expected_main" ]]; then fail RUNNER "validation branch is not based on exact authoritative main $expected_main"; fi
          printf '%s\n' "$expected_main" > evidence/product_baseline_sha.txt
          printf 'validation_head=%s\nproduct_baseline_sha=%s\n' "$validation_head" "$expected_main"
          changed=$(git diff --name-only "$expected_main" "$validation_head" | sort)
          printf '%s\n' "$changed" > evidence/validation_changed_files.txt
          printf 'changed_files:\n%s\n' "$changed"
          expected=$(printf '%s\n' '.github/workflows/normal-home-real-photo-e2e-v2.yml' 'validation_v2/app/src/androidTest/java/com/yujian/ai/NormalHomeRealPhotoE2ETest.kt' 'validation_v2/scripts/hifi_acceptance/compare_normal_home_real_photo_v2.py' | sort)
          if [[ "$changed" != "$expected" ]]; then fail RUNNER "validation diff contains unexpected or missing files"; fi
          printf '%s\n' "$validation_head" > evidence/harness_sha.txt
          adb_bin=/opt/android-sdk/platform-tools/adb
          if [[ ! -x "$adb_bin" ]]; then fail RUNNER "ADB is missing at $adb_bin"; fi
          export ANDROID_ADB="$adb_bin"
          "$adb_bin" start-server
          mapfile -t attached < <("$adb_bin" devices | awk 'NR > 1 && $2 == "device" {print $1}')
          if [[ ${#attached[@]} -gt 1 ]]; then fail RUNNER "expected at most one connected Android device, got ${#attached[@]}"; fi
          if [[ ${#attached[@]} -eq 0 ]]; then
            emulator_bin=/opt/android-sdk/emulator/emulator
            if [[ ! -x "$emulator_bin" || ! -e /dev/kvm ]]; then fail RUNNER "API 28 emulator binary or KVM device is unavailable"; fi
            avd_list=$("$emulator_bin" -list-avds 2>&1) || fail RUNNER "Android AVD inventory could not be read: $avd_list"
            avd_name=$(printf '%s\n' "$avd_list" | awk '/28/ {print; exit}')
            if [[ -z "$avd_name" ]]; then avd_name=$(printf '%s\n' "$avd_list" | awk 'NF {print; exit}'); fi
            if [[ -z "$avd_name" ]]; then fail RUNNER "no Android virtual device is configured on this runner"; fi
            printf 'selected_avd=%s\n' "$avd_name" | tee -a evidence/logs/runner.log
            if ! pgrep -f -- "$emulator_bin -avd" >/dev/null 2>&1; then
              nohup "$emulator_bin" -avd "$avd_name" -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 4096 -skin 1080x1920 > evidence/logs/emulator.log 2>&1 &
              printf 'emulator_pid=%s\n' "$!" | tee -a evidence/logs/runner.log
            fi
          fi
          ready=0
          for wait_attempt in 1 2; do
            if timeout 90s "$adb_bin" wait-for-device; then ready=1; break; fi
            "$adb_bin" kill-server || true
            "$adb_bin" start-server
          done
          if [[ "$ready" != 1 ]]; then fail RUNNER "ADB did not connect to the runner emulator after two bounded waits"; fi
          mapfile -t attached < <("$adb_bin" devices | awk 'NR > 1 && $2 == "device" {print $1}')
          if [[ ${#attached[@]} -ne 1 ]]; then fail RUNNER "expected exactly one booted Android device, got ${#attached[@]}"; fi
          serial=${attached[0]}
          booted=0
          for boot_attempt in $(seq 1 60); do
            state=$("$adb_bin" -s "$serial" get-state 2>/dev/null | tr -d '\r' || true)
            boot=$("$adb_bin" -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            api=$("$adb_bin" -s "$serial" shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r' || true)
            printf 'android_readiness attempt=%s state=%s boot=%s api=%s\n' "$boot_attempt" "$state" "$boot" "$api" | tee -a evidence/logs/runner.log
            if [[ "$state" == device && "$boot" == 1 && "$api" == 28 ]]; then booted=1; break; fi
            sleep 2
          done
          if [[ "$booted" != 1 ]]; then fail RUNNER "API 28 Android device did not finish booting in 120 seconds"; fi
          export DEVICE_SERIAL="$serial"
          "$adb_bin" -s "$serial" shell getprop ro.build.version.sdk > evidence/device_api.txt
          api=$(tr -d '\r\n' < evidence/device_api.txt)
          if [[ "$api" != 28 ]]; then fail RUNNER "runner device API was $api, expected API 28"; fi
          python3 - <<'PY'
          import json, os, re, subprocess, socket
          adb=os.environ['ANDROID_ADB']; serial=os.environ['DEVICE_SERIAL']
          def shell(command):
              return subprocess.check_output([adb,'-s',serial,'shell',*command.split()],text=True,stderr=subprocess.STDOUT).strip().replace('\r','')
          def prop(key): return shell('getprop '+key)
          size=shell('wm size')
          match=re.search(r'(\d+)x(\d+)',size)
          qemu=prop('ro.kernel.qemu') == '1'
          info={
            'runner_name':os.environ.get('RUNNER_NAME'), 'runner_hostname':socket.gethostname(),
            'serial':serial, 'model':prop('ro.product.model'), 'manufacturer':prop('ro.product.manufacturer'),
            'api_level':int(prop('ro.build.version.sdk')), 'release':prop('ro.build.version.release'),
            'device_type':'EMULATOR' if qemu else 'PHYSICAL', 'ro_kernel_qemu':prop('ro.kernel.qemu'),
            'native_width':int(match.group(1)) if match else None, 'native_height':int(match.group(2)) if match else None,
            'wm_size_output':size, 'wm_density_output':shell('wm density'),
          }
          with open('evidence/device_info.json','w',encoding='utf-8') as f: json.dump(info,f,ensure_ascii=False,indent=2)
          print(json.dumps(info,ensure_ascii=False))
          PY
          touch evidence/.preflight_ok

      - name: Set up Python and Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
        continue-on-error: true

      - name: Install visual report dependency
        continue-on-error: true
        run: |
          if [[ -f evidence/failure_step.txt ]]; then exit 0; fi
          python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Download and authenticate licensed Commons original
        id: photo
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -f evidence/.preflight_ok ]]; then exit 0; fi
          fail() { printf '%s\n' PHOTO_DOWNLOAD > evidence/failure_step.txt; echo "BLOCKED_AT_EXACT_STEP=PHOTO_DOWNLOAD: $1"; exit 1; }
          exec > >(tee -a evidence/logs/runner.log) 2>&1
          photo=evidence/photo/Common_Carp.jpg
          curl --fail --location --retry 3 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/c/ca/Common_Carp.jpg' --output "$photo" || fail "Commons original download failed"
          python - <<'PY' || fail "Commons source JPEG identity did not match the licensed original"
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          from PIL import Image
          p=Path('evidence/photo/Common_Carp.jpg'); data=p.read_bytes()
          with Image.open(p) as im:
              dims=list(im.size); fmt=im.format
          sha1=hashlib.sha1(data).hexdigest()
          if fmt!='JPEG' or dims != [2048,1536] or len(data)!=877945 or sha1!='18b0f4ff8d6a6c8791230020c90c8e4a7bbc84a9':
              raise SystemExit(f'original identity mismatch: format={fmt} dimensions={dims} bytes={len(data)} sha1={sha1}')
          result={
            'source_page':'https://commons.wikimedia.org/wiki/File:Common_Carp.jpg',
            'original_file_url':'https://upload.wikimedia.org/wikipedia/commons/c/ca/Common_Carp.jpg',
            'author':'Gavin Bradley','license':'CC BY-SA 3.0','license_url':'https://creativecommons.org/licenses/by-sa/3.0/',
            'download_timestamp_utc':datetime.now(timezone.utc).isoformat(), 'file_name':p.name,
            'format':fmt,'original_dimensions':dims,'byte_size':len(data),'sha1':sha1,'sha256':hashlib.sha256(data).hexdigest(),
            'genuine_photo_review':'Wikimedia Commons describes the source as a Michigan angler holding a common carp; source marked own work.'
          }
          Path('evidence/photo/photo_provenance.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY
          touch evidence/.photo_ok

      - name: Download APK pair from verified run 37770419113
        id: prior_apks
        uses: actions/download-artifact@v4
        with:
          name: YuJian-Normal-Home-Real-Photo-E2E-APK-Pair-15897af7422b4fe4dedd464880caff5be7f21cc1
          run-id: 37770419113
          repository: pan277942135/Yujian_App
          github-token: ${{ github.token }}
          path: evidence/reused-apk
        continue-on-error: true

      - name: Set up JDK 17 for AndroidTest compile
        if: steps.photo.outcome == 'success' && steps.prior_apks.outcome == 'success'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
        continue-on-error: true

      - name: Set up Gradle 8.9 for AndroidTest compile
        if: steps.photo.outcome == 'success' && steps.prior_apks.outcome == 'success'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
        continue-on-error: true

      - name: Rebuild only the AndroidTest APK and verify preserved product APK
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -f evidence/.photo_ok ]]; then exit 0; fi
          fail() { printf '%s\n' APK_BUILD > evidence/failure_step.txt; echo "BLOCKED_AT_EXACT_STEP=APK_BUILD: $1"; exit 1; }
          exec > >(tee -a evidence/logs/apk_build.log) 2>&1
          source_rel=validation_v2/app/src/androidTest/java/com/yujian/ai/NormalHomeRealPhotoE2ETest.kt
          source_copy=app/src/androidTest/java/com/yujian/ai/NormalHomeRealPhotoE2ETest.kt
          mkdir -p evidence/apk "$(dirname "$source_copy")"
          cp evidence/reused-apk/app-debug.apk evidence/apk/app-debug.apk || fail 'verified prior production APK is missing'
          source_blob=$(git rev-parse "HEAD:$source_rel") || fail 'test source is not tracked at validation HEAD'
          worktree_blob=$(git hash-object "$source_rel")
          [[ "$source_blob" == "$worktree_blob" ]] || fail 'working instrumentation source differs from validation HEAD'
          cp "$source_rel" "$source_copy" || fail 'could not stage updated AndroidTest source'
          printf 'validation_head=%s\ntest_source_blob_sha=%s\nproduct_apk_source_run=37770419113\n' "$GITHUB_SHA" "$source_blob"
          gradle :app:assembleDebugAndroidTest --stacktrace --no-daemon --max-workers=2 || fail 'AndroidTest-only APK assembly failed'
          test_apk=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          [[ -s "$test_apk" ]] || fail 'AndroidTest APK output is missing'
          cp "$test_apk" evidence/apk/app-debug-androidTest.apk || fail 'could not stage rebuilt AndroidTest APK'
          python3 - <<'PY' || fail 'APK hash, manifest compatibility, or instrumentation source verification failed'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('evidence/apk')
          app_path=root/'app-debug.apk'
          test_path=root/'app-debug-androidTest.apk'
          def row(p): return {'file':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'byte_size':p.stat().st_size}
          app=row(app_path); test=row(test_path)
          expected_app=('1d0cb6f396b580c14c8b90f61ea327384ce3930f31b3afb906ae6a503dd0fe1c',108061139)
          expected_old_test='ad3d5ed4959a6cd421fcbe30f38b68e577da17dca52e0353350b525829071eae'
          if (app['sha256'],app['byte_size'])!=expected_app:
              raise SystemExit(f'preserved production APK identity mismatch: {app}')
          if test['sha256']==expected_old_test:
              raise SystemExit('AndroidTest APK is the stale APK from Run 37770419113')
          aapt=Path(os.environ['ANDROID_HOME'])/'build-tools'/'35.0.0'/'aapt'
          if not aapt.is_file(): raise SystemExit(f'aapt is missing: {aapt}')
          app_badging=subprocess.check_output([str(aapt),'dump','badging',str(app_path)],text=True)
          test_badging=subprocess.check_output([str(aapt),'dump','badging',str(test_path)],text=True)
          if "package: name='com.yujian.ai.uiv2'" not in app_badging:
              raise SystemExit('preserved production APK package id mismatch')
          if "package: name='com.yujian.ai.uiv2.test'" not in test_badging:
              raise SystemExit('rebuilt AndroidTest APK package id mismatch')
          manifest=subprocess.check_output([str(aapt),'dump','xmltree',str(test_path),'AndroidManifest.xml'],text=True)
          if 'targetPackage' not in manifest or 'com.yujian.ai.uiv2' not in manifest:
              raise SystemExit('AndroidTest manifest does not target the preserved production package')
          dex=subprocess.check_output(['unzip','-Z1',str(test_path)],text=True).splitlines()
          dex=[name for name in dex if name.startswith('classes') and name.endswith('.dex')]
          if not dex: raise SystemExit('rebuilt AndroidTest APK has no DEX payload')
          source_present=False
          for name in dex:
              raw=subprocess.check_output(['unzip','-p',str(test_path),name])
              if b'NormalHomeRealPhotoE2ETest' in raw and b'savesCommonsCarpThroughGalleryRecognitionAndHomeDetail' in raw and b'CHECKPOINT=SETUP_OK' in raw:
                  source_present=True
          if not source_present: raise SystemExit('rebuilt AndroidTest APK does not contain the updated test source/checkpoint')
          provenance={
            'product_baseline_sha':'3cd0753be926c3a8cc94ac56c97c9103febc6663',
            'validation_head':os.environ['GITHUB_SHA'],
            'app_apk_build_head':'15897af7422b4fe4dedd464880caff5be7f21cc1',
            'app_apk_artifact_source_run_id':37770419113,
            'android_test_apk_build_head':os.environ['GITHUB_SHA'],
            'test_source_git_blob_sha':subprocess.check_output(['git','rev-parse','HEAD:validation_v2/app/src/androidTest/java/com/yujian/ai/NormalHomeRealPhotoE2ETest.kt'],text=True).strip(),
            'package':'com.yujian.ai.uiv2',
            'test_package':'com.yujian.ai.uiv2.test',
            'compatibility':{'app_package_verified':True,'test_package_verified':True,'test_target_package_verified':True,'updated_test_dex_verified':True},
            'app_apk':app,
            'android_test_apk':test
          }
          Path('evidence/apk_provenance.json').write_text(json.dumps(provenance,indent=2)+'\n')
          print(json.dumps(provenance,indent=2))
          PY
          touch evidence/.build_ok

      - name: Install app, reset isolated state, and import original photo
        id: install
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -f evidence/.build_ok ]]; then exit 0; fi
          fail() { if [[ ! -f evidence/failure_step.txt ]]; then printf '%s\n' APK_INSTALL > evidence/failure_step.txt; fi; echo "BLOCKED_AT_EXACT_STEP=APK_INSTALL: $1"; exit 1; }
          adb=/opt/android-sdk/platform-tools/adb
          serial=$(python3 -c "import json;print(json.load(open('evidence/device_info.json'))['serial'])")
          python3 - "$serial" <<'PY' || fail 'uninstall refused because target is not the isolated API 28 test emulator'
          import json,subprocess,sys
          serial=sys.argv[1]; info=json.load(open('evidence/device_info.json'))
          adb='/opt/android-sdk/platform-tools/adb'
          devices=subprocess.check_output([adb,'devices'],text=True).splitlines()
          online=[line.split()[0] for line in devices[1:] if len(line.split())>=2 and line.split()[1]=='device']
          qemu=subprocess.check_output([adb,'-s',serial,'shell','getprop','ro.kernel.qemu'],text=True).strip()
          api=subprocess.check_output([adb,'-s',serial,'shell','getprop','ro.build.version.sdk'],text=True).strip()
          if info.get('device_type')!='EMULATOR' or info.get('api_level')!=28 or not serial.startswith('emulator-') or qemu!='1' or api!='28' or online!=[serial]:
              raise SystemExit(f'refuse destructive package cleanup: serial={serial} api={api} qemu={qemu} online={online} info={info}')
          print(json.dumps({'isolated_emulator_cleanup_authorized':True,'serial':serial,'api_level':28,'device_type':'EMULATOR','online_devices':online}))
          PY
          {
            echo 'APK_INSTALL_PRESTATE_BEGIN'
            echo 'previous_failure=INSTALL_FAILED_UPDATE_INCOMPATIBLE: Package com.yujian.ai.uiv2 signatures do not match previously installed version; ignoring!'
            echo "target_serial=$serial"
            for package in com.yujian.ai.uiv2.test com.yujian.ai.uiv2; do
              echo "PACKAGE=$package"
              "$adb" -s "$serial" shell pm path "$package" 2>&1 || true
              "$adb" -s "$serial" shell dumpsys package "$package" 2>&1 | grep -E 'versionCode=|versionName=|userId=|codePath=|installerPackageName=|signatures=' | head -n 12 || true
            done
            echo 'APK_INSTALL_PRESTATE_END'
          } | tee -a evidence/logs/runner.log
          "$adb" -s "$serial" uninstall com.yujian.ai.uiv2.test > evidence/logs/uninstall-test-package.log 2>&1 || true
          "$adb" -s "$serial" uninstall com.yujian.ai.uiv2 > evidence/logs/uninstall-app-package.log 2>&1 || true
          cat evidence/logs/uninstall-test-package.log evidence/logs/uninstall-app-package.log | tee -a evidence/logs/runner.log
          remaining=$("$adb" -s "$serial" shell pm path com.yujian.ai.uiv2 2>&1 || true)
          if [[ "$remaining" == package:* ]]; then fail 'old production package remained after isolated-emulator uninstall'; fi
          remaining=$("$adb" -s "$serial" shell pm path com.yujian.ai.uiv2.test 2>&1 || true)
          if [[ "$remaining" == package:* ]]; then fail 'old AndroidTest package remained after isolated-emulator uninstall'; fi
          "$adb" -s "$serial" install evidence/apk/app-debug.apk || fail 'production APK installation failed after clean uninstall'
          "$adb" -s "$serial" install evidence/apk/app-debug-androidTest.apk || fail 'matching AndroidTest APK installation failed after clean uninstall'
          "$adb" -s "$serial" shell pm clear com.yujian.ai.uiv2 || fail 'could not reset isolated app data before the test'
          "$adb" -s "$serial" shell pm grant com.yujian.ai.uiv2 android.permission.CAMERA || fail 'camera runtime permission grant failed'
          "$adb" -s "$serial" shell mkdir -p /sdcard/Pictures/YuJianRealPhotoE2E || fail 'could not prepare Android media folder'
          "$adb" -s "$serial" push evidence/photo/Common_Carp.jpg /sdcard/Pictures/YuJianRealPhotoE2E/Common_Carp.jpg || fail 'could not copy original JPEG onto Android'
          "$adb" -s "$serial" shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Pictures/YuJianRealPhotoE2E/Common_Carp.jpg || fail 'Android media scan failed'
          "$adb" -s "$serial" shell am force-stop com.yujian.ai.uiv2
          touch evidence/.install_ok

      - name: Run only NormalHomeRealPhotoE2ETest
        id: e2e
        continue-on-error: true
        run: |
          set -uo pipefail
          if [[ ! -f evidence/.install_ok ]]; then exit 0; fi
          adb=/opt/android-sdk/platform-tools/adb
          serial=$(python3 -c "import json;print(json.load(open('evidence/device_info.json'))['serial'])")
          photo_sha=$(python3 -c "import json;print(json.load(open('evidence/photo/photo_provenance.json'))['sha256'])")
          "$adb" -s "$serial" logcat -c || true
          set +e
          "$adb" -s "$serial" shell am instrument -w -e class 'com.yujian.ai.NormalHomeRealPhotoE2ETest#savesCommonsCarpThroughGalleryRecognitionAndHomeDetail' -e photo_sha256 "$photo_sha" com.yujian.ai.uiv2.test/androidx.test.runner.AndroidJUnitRunner > evidence/logs/instrumentation.log 2>&1
          result=$?
          set -e
          echo "instrumentation_exit_code=$result" | tee -a evidence/logs/instrumentation.log
          "$adb" -s "$serial" logcat -d -v threadtime > evidence/logs/logcat.txt || true
          "$adb" -s "$serial" shell dumpsys activity activities > evidence/logs/activity_focus.txt || true
          "$adb" -s "$serial" shell dumpsys window windows >> evidence/logs/activity_focus.txt || true
          mkdir -p evidence/screenshots/pulled
          remote_evidence="/sdcard/Android/data/com.yujian.ai.uiv2/files/normal-home-real-photo-e2e-v2"
          "$adb" -s "$serial" pull "$remote_evidence" evidence/screenshots/pulled > evidence/logs/runner.log.pull 2>&1 || true
          find evidence/screenshots/pulled -type f \( -name '*.png' -o -name '*.xml' \) -print0 | while IFS= read -r -d '' p; do cp "$p" evidence/screenshots/; done
          find evidence/screenshots/pulled -name e2e-result.json -type f -exec cp '{}' evidence/e2e-result.json \; 2>/dev/null || true
          python3 - "$remote_evidence" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path('evidence'); pulled=root/'screenshots'/'pulled'
          files=sorted(p for p in pulled.rglob('*') if p.is_file()) if pulled.exists() else []
          rows=[{'path':str(p.relative_to(pulled)),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'byte_size':p.stat().st_size} for p in files]
          collection={
            'source':'adb pull',
            'remote_directory':sys.argv[1],
            'collected_files':len(rows),
            'png_files':[x['path'] for x in rows if x['path'].lower().endswith('.png')],
            'xml_files':[x['path'] for x in rows if x['path'].lower().endswith('.xml')],
            'result_json_files':[x['path'] for x in rows if x['path'].endswith('e2e-result.json')],
            'files':rows
          }
          (root/'evidence_collection.json').write_text(json.dumps(collection,indent=2)+'\n')
          print(json.dumps({k:v for k,v in collection.items() if k!='files'},indent=2))
          PY
          if [[ ! -s evidence/e2e-result.json ]]; then
            checkpoint_seen() {
              grep -q "$1" evidence/logs/instrumentation.log evidence/logs/logcat.txt 2>/dev/null
            }
            if [[ -s evidence/failure_step.txt ]]; then
              step=$(tr -d '\r\n' < evidence/failure_step.txt)
            elif ! checkpoint_seen 'CHECKPOINT=SETUP_OK'; then
              step=TEST_HARNESS_SETUP
            elif ! checkpoint_seen 'CHECKPOINT=APP_LAUNCHED'; then
              step=APP_LAUNCH
            elif ! checkpoint_seen 'CHECKPOINT=GALLERY'; then
              step=GALLERY
            elif ! checkpoint_seen 'CHECKPOINT=RECOGNITION'; then
              step=RECOGNITION
            elif ! checkpoint_seen 'CHECKPOINT=SPECIES_CONFIRMED'; then
              step=RECOGNITION
            elif ! checkpoint_seen 'CHECKPOINT=SAVE_SUCCESS'; then
              step=SAVE
            elif ! checkpoint_seen 'CHECKPOINT=HOME_RENDER'; then
              step=HOME_RENDER
            elif ! checkpoint_seen 'CHECKPOINT=FISH_RECORD_DETAIL'; then
              step=FISH_RECORD_DETAIL
            else
              step=SCREENSHOT
            fi
            if [[ ! -s evidence/failure_step.txt ]]; then printf '%s\n' "$step" > evidence/failure_step.txt; fi
            python3 - "$step" <<'PY'
          import json,re,sys
          from pathlib import Path
          step=sys.argv[1]
          result={
            'status':'BLOCKED_AT_EXACT_STEP',
            'failure_step':step,
            'failure_message':'Instrumentation produced no e2e-result.json; failure stage inferred from the last verified checkpoint. See instrumentation.log and logcat.txt.',
            'save_mode':'NOT_REACHED'
          }
          checkpoint_logs='\n'.join(
            path.read_text(errors='replace')
            for path in [Path('evidence/logs/instrumentation.log'),Path('evidence/logs/logcat.txt')]
            if path.is_file()
          )
          save=re.search(r'CHECKPOINT=SAVE_SUCCESS mode=(\S+) record_id=(\S+)',checkpoint_logs)
          if save:
            result['save_mode']=save.group(1)
            result['record_id']=save.group(2)
          Path('evidence/e2e-result.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
          fi
          outcome=$(python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/e2e-result.json').read_text())
          print(r.get('status','BLOCKED_AT_EXACT_STEP'))
          print(r.get('failure_step') or '')
          PY
          )
          status=$(printf '%s\n' "$outcome" | sed -n '1p')
          step=$(printf '%s\n' "$outcome" | sed -n '2p')
          if [[ "$status" != PASS_REAL_PHOTO_E2E ]]; then
            if [[ ! -s evidence/failure_step.txt ]]; then printf '%s\n' "${step:-TEST_HARNESS_SETUP}" > evidence/failure_step.txt; fi
            exit 1
          fi
          if [[ $result -ne 0 ]] || ! grep -q 'OK (' evidence/logs/instrumentation.log; then
            if [[ ! -s evidence/failure_step.txt ]]; then printf '%s\n' TEST_RUNNER > evidence/failure_step.txt; fi
            exit 1
          fi
          touch evidence/.e2e_ok

      - name: Verify captured screenshot hashes and foreground provenance
        id: screenshot_verify
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -f evidence/.install_ok ]]; then exit 0; fi
          fail() { if [[ ! -f evidence/failure_step.txt ]]; then printf 'SCREENSHOT\n' > evidence/failure_step.txt; fi; echo "BLOCKED_AT_EXACT_STEP=SCREENSHOT: $1"; exit 1; }
          python3 - <<'PY' || fail 'native Android screenshots or provenance did not validate'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          root=Path('evidence'); shots=root/'screenshots'; result=json.loads((root/'e2e-result.json').read_text())
          rows=result.get('screenshots',[]); by={x.get('file'):x for x in rows if isinstance(x,dict)}
          collection=json.loads((root/'evidence_collection.json').read_text())
          expected_remote='/sdcard/Android/data/com.yujian.ai.uiv2/files/normal-home-real-photo-e2e-v2'
          if collection.get('remote_directory')!=expected_remote: raise SystemExit('evidence was not pulled from the target application external-files directory')
          collected_json={Path(x).name for x in collection.get('result_json_files',[])}
          if 'e2e-result.json' not in collected_json: raise SystemExit('instrumentation result JSON was not collected from the target application external-files directory')
          if result.get('status')=='PASS_REAL_PHOTO_E2E':
              required_xml={'gallery-picker-window.xml','recognition-result-window.xml','recognition-confirmed-window.xml','fish-record-detail-a-window.xml'}
              collected_xml={Path(x).name for x in collection.get('xml_files',[])}
              if not required_xml.issubset(collected_xml): raise SystemExit('one or more Android UI hierarchy XML files were not collected: '+str(sorted(required_xml-collected_xml)))
          required=['gallery-selection.png','recognition-result.png','save-return-home.png','runtime_real_photo.png','fish-record-detail-a.png']
          for name in required:
              p=shots/name
              if not p.is_file(): raise SystemExit('missing screenshot '+name)
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  if im.format!='PNG': raise SystemExit('not PNG '+name)
                  row=by.get(name,{})
                  digest=hashlib.sha256(p.read_bytes()).hexdigest()
                  if digest!=row.get('sha256') or list(im.size)!=[row.get('native_width'),row.get('native_height')]: raise SystemExit('capture hash/native dimensions mismatch '+name)
                  if name in ('runtime_real_photo.png','save-return-home.png','fish-record-detail-a.png'):
                      if row.get('expected_app_foreground') is not True or 'com.yujian.ai.uiv2' not in str(row.get('foreground_package')) or 'com.yujian.ai.uiv2' not in str(row.get('focused_window')): raise SystemExit('app focus mismatch '+name)
          with open(root/'screenshot_capture_manifest.json','w') as f:
              json.dump({'verified_at_utc':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),'screenshots':[{**by[n],'host_verified_sha256':hashlib.sha256((shots/n).read_bytes()).hexdigest()} for n in required]},f,indent=2)
          print('SCREENSHOT_PROVENANCE_PASS')
          PY
          touch evidence/.screenshots_ok

      - name: Collect final Android diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p evidence/logs
          adb=/opt/android-sdk/platform-tools/adb
          if [[ -f evidence/device_info.json && -x "$adb" ]]; then
            serial=$(python3 -c "import json;print(json.load(open('evidence/device_info.json'))['serial'])")
            "$adb" -s "$serial" shell dumpsys activity activities > evidence/logs/activity_focus_final.txt 2>&1 || true
            "$adb" -s "$serial" shell dumpsys window windows >> evidence/logs/activity_focus_final.txt 2>&1 || true
            "$adb" -s "$serial" logcat -d -v threadtime > evidence/logs/logcat_final.txt 2>&1 || true
          fi

      - name: Generate Frozen comparison and complete evidence ZIP
        if: always()
        id: report
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p evidence/logs
          if [[ ! -f evidence/validation_head.txt ]]; then printf '%s\n' "$GITHUB_SHA" > evidence/validation_head.txt; fi
          if [[ ! -s evidence/e2e-result.json ]]; then
            step=RUNNER
            [[ -s evidence/failure_step.txt ]] && step=$(cat evidence/failure_step.txt)
            printf '{"status":"BLOCKED_AT_EXACT_STEP","failure_step":"%s","save_mode":"NOT_REACHED"}\n' "$step" > evidence/e2e-result.json
          fi
          python3 validation_v2/scripts/hifi_acceptance/compare_normal_home_real_photo_v2.py --evidence-root evidence --repository-root . | tee evidence/logs/report_generator.log
          python3 - <<'PY' | tee -a evidence/logs/report_generator.log
          import json
          from pathlib import Path
          report=json.loads(Path('evidence/package/04_report/report.json').read_text())
          visual=report.get('visual_comparison',{})
          if visual.get('images_generated'):
              print('CHECKPOINT=VISUAL_COMPARE status='+str(visual.get('status'))+' images='+','.join(visual['images_generated']))
          else:
              print('VISUAL_COMPARE=NOT_RUN failure_step='+str(report.get('failure_step')))
          PY

      - name: Upload complete Normal Home evidence ZIP and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-Normal-Home-Real-Photo-E2E-V2-${{ github.sha }}
          path: |
            evidence/YuJian_Normal_Home_Real_Photo_E2E_V2.zip
            evidence/logs/**
            evidence/failure_step.txt
            evidence/validation_head.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload exact app and AndroidTest APK pair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-Normal-Home-Real-Photo-E2E-APK-Pair-${{ github.sha }}
          path: evidence/apk/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce evidence result
        if: always()
        run: |
          set -euo pipefail
          status=$(python3 -c "import json;print(json.load(open('evidence/package/04_report/report.json'))['final_status'])" 2>/dev/null || echo BLOCKED_AT_EXACT_STEP)
          screenshot=$(python3 -c "import json;print(json.load(open('evidence/package/04_report/report.json'))['screenshot_evidence'])" 2>/dev/null || echo FAIL)
          echo "REAL_PHOTO_E2E=$status SCREENSHOT_EVIDENCE=$screenshot"
          if [[ "$status" != PASS_REAL_PHOTO_E2E || "$screenshot" != PASS ]]; then exit 1; fi
