name: Recognition Optical Lab · Static + Dynamic Review Evidence

on:
  pull_request:
    branches:
      - main
      - design/processing-remove-early-visual-v1
    paths:
      - "design/manager/index.html"
      - "design/manager/optical-lab/**"
      - "design/pages/recognition/design/Recognition_Processing_Visual_State_Set_V1_2.json"
      - "design/pages/recognition/design/02_AI_Understanding_Frozen.png"
      - "design/pages/recognition/design/03_Fish_Highlight_Frozen.png"
      - "design/pages/recognition/design/04_Fish_Identifying_Frozen.png"
      - "design/pages/recognition/processing/handoff/Processing_Engineering_Import_Config_V1.json"
      - "design/system/fish_media_display_v1/real_photo_cases.json"
      - "design/system/fish_media_display_v1/assets/real_catch_source.jpg"
      - "app/src/main/java/com/yujian/ai/ui/recognition/**"
      - "app/src/main/java/com/yujian/ai/ui/screens/RecognizingScreen.kt"
      - "scripts/verify_processing_optical_lab.mjs"
      - "scripts/smoke_processing_optical_lab.cjs"
      - ".github/workflows/processing-optical-lab.yml"

concurrency:
  group: recognition-optical-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LAB_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  static-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/processing-lab" playwright@1.63.0
          "$RUNNER_TEMP/processing-lab/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify P1–P5 bindings, source SHAs and Frozen bytes
        shell: bash
        env:
          LAB_OUTPUT_DIR: optical-lab-artifacts
        run: |
          set -euo pipefail
          mkdir -p "$LAB_OUTPUT_DIR"
          node scripts/verify_processing_optical_lab.mjs

      - name: Embed verified PR revision and asset manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const head = process.env.LAB_SOURCE_REVISION;
          if (!/^[a-f0-9]{40}$/i.test(head || '')) throw new Error('Expected a full Git commit SHA in LAB_SOURCE_REVISION');
          const info = {
            pull_request: 166,
            head_sha: head,
            source_dependency_verification: 'PASS',
            built_at_utc: new Date().toISOString(),
          };
          await writeFile('design/manager/optical-lab/build-info.js', 'window.OPTICAL_LAB_BUILD_INFO__ = ' + JSON.stringify(info, null, 2) + ';\n');
          NODE
          cp optical-lab-artifacts/asset-manifest.json design/manager/optical-lab/asset-manifest.json

      - name: Run browser smoke and export static evidence
        shell: bash
        env:
          LAB_OUTPUT_DIR: optical-lab-artifacts
        run: |
          set -euo pipefail
          mkdir -p "$LAB_OUTPUT_DIR"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . > "$RUNNER_TEMP/processing-optical-lab-http.log" 2>&1 &
          REPO_SERVER_PID=$!
          python3 -m http.server 8766 --bind 127.0.0.1 --directory design > "$RUNNER_TEMP/processing-optical-lab-design-http.log" 2>&1 &
          DESIGN_SERVER_PID=$!
          trap 'kill "$REPO_SERVER_PID" "$DESIGN_SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/design/manager/optical-lab/ >/dev/null && curl --fail --silent http://127.0.0.1:8766/manager/optical-lab/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/design/manager/optical-lab/ >/dev/null
          curl --fail --silent http://127.0.0.1:8766/manager/optical-lab/ >/dev/null
          LAB_REPO_URL=http://127.0.0.1:8765/design/manager/optical-lab/ \
          LAB_DESIGN_ROOT_URL=http://127.0.0.1:8766/manager/optical-lab/ \
          PLAYWRIGHT_MODULE_DIR="$RUNNER_TEMP/processing-lab/node_modules" node scripts/smoke_processing_optical_lab.cjs

      - name: Record automation checks without visual-approval claim
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const reportPath = 'optical-lab-artifacts/asset-manifest.json';
          const report = JSON.parse(await readFile(reportPath, 'utf8'));
          const smoke = JSON.parse(await readFile('optical-lab-artifacts/browser-smoke.json', 'utf8'));
          if (smoke.result !== 'AUTOMATION_SMOKE_PASSED_VISUAL_REVIEW_REQUIRED' || !Array.isArray(smoke.responsive) || smoke.browserErrors.length !== 0) {
            throw new Error('Cannot record browser pass without a complete Playwright smoke result.');
          }
          report.gates.browser_route_and_runtime_assets = 'PASS';
          report.gates.responsive_viewport_fixtures = 'PASS';
          report.browser_smoke = {
            source_revision: smoke.source_revision,
            states: smoke.states,
            responsive_viewports: smoke.responsive,
            renderer_pixel_changes: smoke.renderers,
            frozen_diff: smoke.diff,
            frozen_photo_identity: smoke.frozen_photo_identity,
            fish_focus: smoke.fishFocus,
            stage_b: smoke.stageB,
            static_candidates: smoke.staticCandidates,
            receiving_field_visibility: smoke.receiving_field_visibility,
            dynamic_candidates: smoke.dynamicCandidates,
            visual_review: smoke.visualReview,
            browser_errors: smoke.browserErrors,
          };
          await writeFile(reportPath, JSON.stringify(report, null, 2) + '\n');
          await writeFile('design/manager/optical-lab/asset-manifest.json', JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Package a runnable browser preview with the verified source assets
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_DIR="$RUNNER_TEMP/recognition-optical-lab-preview"
          mkdir -p "$PACKAGE_DIR/design/manager/optical-lab"
          mkdir -p "$PACKAGE_DIR/design/pages/recognition/processing/handoff"
          mkdir -p "$PACKAGE_DIR/design/pages/recognition/design"
          mkdir -p "$PACKAGE_DIR/design/system/fish_media_display_v1/assets"
          mkdir -p "$PACKAGE_DIR/design/manager/optical-lab/review_v1"
          mkdir -p "$PACKAGE_DIR/app/src/androidTest/assets"
          cp design/manager/optical-lab/index.html "$PACKAGE_DIR/design/manager/optical-lab/index.html"
          cp design/manager/optical-lab/README.md "$PACKAGE_DIR/design/manager/optical-lab/README.md"
          cp design/manager/optical-lab/build-info.js "$PACKAGE_DIR/design/manager/optical-lab/build-info.js"
          cp design/manager/optical-lab/asset-manifest.json "$PACKAGE_DIR/design/manager/optical-lab/asset-manifest.json"
          cp design/manager/optical-lab/review_v1/fish_focus_review_only_alpha.png "$PACKAGE_DIR/design/manager/optical-lab/review_v1/"
          cp design/manager/optical-lab/review_v1/fish_focus_case_b_bbox.json "$PACKAGE_DIR/design/manager/optical-lab/review_v1/"
          cp design/pages/recognition/processing/handoff/Processing_Engineering_Import_Config_V1.json "$PACKAGE_DIR/design/pages/recognition/processing/handoff/"
          cp design/pages/recognition/design/Recognition_Processing_Visual_State_Set_V1_2.json "$PACKAGE_DIR/design/pages/recognition/design/"
          cp design/pages/recognition/design/02_AI_Understanding_Frozen.png "$PACKAGE_DIR/design/pages/recognition/design/"
          cp design/pages/recognition/design/03_Fish_Highlight_Frozen.png "$PACKAGE_DIR/design/pages/recognition/design/"
          cp design/pages/recognition/design/04_Fish_Identifying_Frozen.png "$PACKAGE_DIR/design/pages/recognition/design/"
          cp design/system/fish_media_display_v1/real_photo_cases.json "$PACKAGE_DIR/design/system/fish_media_display_v1/"
          cp design/system/fish_media_display_v1/assets/real_catch_source.jpg "$PACKAGE_DIR/design/system/fish_media_display_v1/assets/"
          cp app/src/androidTest/assets/recognition_real_catch_fixture.jpg "$PACKAGE_DIR/app/src/androidTest/assets/"
          cp app/src/androidTest/assets/detector_case_b_night_flash.jpg "$PACKAGE_DIR/app/src/androidTest/assets/"
          (cd "$PACKAGE_DIR" && zip -qr "$GITHUB_WORKSPACE/optical-lab-artifacts/Recognition-Optical-Lab-Browser-Package.zip" .)

      - name: Upload browser screenshots and comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Recognition-Optical-Lab-Review-V1
          path: optical-lab-artifacts/
          if-no-files-found: warn
          retention-days: 30

