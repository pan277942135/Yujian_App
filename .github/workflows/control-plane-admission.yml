name: control-plane-admission

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - "main"
      - "control/**"
      - "feature/**"
      - "fix/**"
      - "design/**"
      - "integration/**"
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

jobs:
  control-plane-admission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install YAML dependency
        run: python -m pip install PyYAML
      - name: Single control-plane admission
        run: python scripts/validate_control_plane_admission.py
