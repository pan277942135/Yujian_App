name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production TFLite model
        run: python3 scripts/verify_production_model.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Compile Android runtime smoke test
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
