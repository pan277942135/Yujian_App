name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_runtime_parity:
        description: Run the heavy Empty Home and Design System parity evidence gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  YUJIAN_API_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
  YUJIAN_FISH_KNOWLEDGE_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
  YUJIAN_FEEDBACK_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android runtime asset contracts
        run: |
          python3 scripts/verify_empty_home_runtime_assets.py
          python3 scripts/verify_empty_home_runtime_v2.py
          python3 scripts/verify_recognition_runtime_contract.py

      - name: Bootstrap verified recognition assets
        run: python3 scripts/bootstrap_android_recognition_assets.py

      - name: Verify production TFLite model
        run: python3 scripts/verify_production_model.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve stable SDK AAPT2
        shell: bash
        run: |
          YUJIAN_AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$YUJIAN_AAPT2"
          echo "YUJIAN_AAPT2=$YUJIAN_AAPT2" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle -Pandroid.aapt2FromMavenOverride="$YUJIAN_AAPT2" test --stacktrace --no-daemon --max-workers=2

      - name: Assemble debug APK
        run: gradle -Pandroid.aapt2FromMavenOverride="$YUJIAN_AAPT2" :app:assembleDebug --stacktrace --no-daemon --max-workers=2

      - name: Compile Android runtime test APK
        run: gradle -Pandroid.aapt2FromMavenOverride="$YUJIAN_AAPT2" :app:assembleDebugAndroidTest --stacktrace --no-daemon --max-workers=2

      - name: Verify packaged launcher icon in APK
        run: python3 scripts/verify_packaged_launcher_icon.py

      - name: Verify packaged recognition assets in APK
        run: python3 scripts/verify_packaged_android_apk.py

      - name: Android lint
        run: gradle -Pandroid.aapt2FromMavenOverride="$YUJIAN_AAPT2" :app:lintDebug --stacktrace --no-daemon --max-workers=2

      # Build Once contract: the two files below are the only APK pair any
      # Android Runtime job is allowed to install.
      - name: Stage frozen runtime APK pair
        run: |
          mkdir -p build/runtime-apks
          cp app/build/outputs/apk/debug/app-debug.apk build/runtime-apks/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/runtime-apks/app-debug-androidTest.apk
          (cd build/runtime-apks && sha256sum app-debug.apk app-debug-androidTest.apk > SHA256SUMS)
          test -s build/runtime-apks/app-debug.apk
          test -s build/runtime-apks/app-debug-androidTest.apk

      - name: Upload frozen runtime APK pair
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-runtime-apks-${{ github.sha }}
          path: build/runtime-apks
          if-no-files-found: error
          retention-days: 14

      - name: Prepare YuJian debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/YuJian-debug.apk

      - name: Prepare Recognition Visual V1.1 QA APK
        id: recognition_qa_apk
        run: |
          filename="YuJian_Recognition_Visual_V1_1_QA_$(TZ=Asia/Shanghai date +%Y%m%d).apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${filename}"
          echo "filename=${filename}" >> "$GITHUB_OUTPUT"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/YuJian-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Recognition Visual V1.1 QA APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.recognition_qa_apk.outputs.filename }}
          path: app/build/outputs/apk/debug/${{ steps.recognition_qa_apk.outputs.filename }}
          if-no-files-found: error
          retention-days: 14

  # One job, one Harness, and one frozen APK pair.  The optional parity row is
  # part of this same matrix so it cannot grow a second ADB/install path.
  android-runtime:
    needs: build
    runs-on: [self-hosted, Linux, X64, yujian-android, api28]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - gate: recognition-frozen
            api_level: 28
            required: true
            emulator_options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 4096
          - gate: empty-home-v2
            api_level: 28
            required: true
            emulator_options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 4096
          - gate: runtime-parity
            api_level: 28
            required: false
            emulator_options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none

    steps:
      - name: Checkout
        if: ${{ matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true) }}
        uses: actions/checkout@v4

      - name: Download frozen runtime APK pair
        if: ${{ matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true) }}
        uses: actions/download-artifact@v4
        with:
          name: YuJian-runtime-apks-${{ github.sha }}
          path: build/runtime-apks

      - name: Verify exact frozen APK pair
        if: ${{ matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true) }}
        run: |
          test -s build/runtime-apks/app-debug.apk
          test -s build/runtime-apks/app-debug-androidTest.apk
          (cd build/runtime-apks && sha256sum -c SHA256SUMS)
          ! find build/runtime-apks -type f -name '*.apk' | grep -vE '/(app-debug|app-debug-androidTest)\.apk$'

      - name: Install runtime parity dependencies
        if: ${{ matrix.gate == 'empty-home-v2' || (matrix.gate == 'runtime-parity' && github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user Pillow

      - name: Prepare GCP self-hosted Android runtime
        if: ${{ matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true) }}
        shell: bash
        run: |
          echo "/opt/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/opt/android-sdk/emulator" >> "$GITHUB_PATH"
          test -e /dev/kvm
          /opt/android-sdk/platform-tools/adb start-server
          /opt/android-sdk/platform-tools/adb wait-for-device
          test "$(/opt/android-sdk/platform-tools/adb get-state)" = "device"
          test "$(/opt/android-sdk/platform-tools/adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          test "$(/opt/android-sdk/platform-tools/adb shell getprop ro.build.version.sdk | tr -d '\r')" = "${{ matrix.api_level }}"
          /opt/android-sdk/platform-tools/adb devices -l

      - name: Run unified Android Runtime Harness
        id: runtime_gate
        if: ${{ matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true) }}
        continue-on-error: true
        shell: bash
        env:
          ADB: /opt/android-sdk/platform-tools/adb
        run: |
          bash scripts/run_android_runtime_gate.sh --gate "${{ matrix.gate }}" --api-level "${{ matrix.api_level }}" --build-sha "$GITHUB_SHA" --app-apk build/runtime-apks/app-debug.apk --test-apk build/runtime-apks/app-debug-androidTest.apk --evidence-dir "evidence/runtime/${{ matrix.gate }}"

      - name: Materialize runtime status when emulator action fails before Harness startup
        if: ${{ always() && (matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true)) }}
        run: |
          result="evidence/runtime/${{ matrix.gate }}/runtime_gate_result.json"
          if [[ ! -s "$result" ]]; then
            mkdir -p "$(dirname "$result")"
            python3 scripts/android_runtime/result.py \
              --output "$result" \
              --gate "${{ matrix.gate }}" \
              --api-level "${{ matrix.api_level }}" \
              --build-sha "$GITHUB_SHA" \
              --adb-state unknown \
              --boot-completed unknown \
              --data-free-kb "" \
              --preflight FAIL \
              --install NOT_RUN \
              --instrumentation NOT_RUN \
              --evidence NOT_RUN \
              --classification BLOCKED_INFRA \
              --failure-phase EMULATOR_RUNNER \
              --failure-reason EMULATOR_RUNNER_FAILED_BEFORE_HARNESS \
              --summary-file "${GITHUB_STEP_SUMMARY:-}"
          fi

      - name: Upload runtime gate status and diagnostics
        if: ${{ always() && (matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true)) }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-gate-${{ matrix.gate }}-${{ github.sha }}
          path: evidence/runtime/${{ matrix.gate }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce runtime gate classification
        if: ${{ always() && (matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true)) }}
        run: |
          result="evidence/runtime/${{ matrix.gate }}/runtime_gate_result.json"
          classification="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["classification"])' "$result")"
          if [[ "${{ steps.runtime_gate.outcome }}" != "success" || "$classification" != "PASS" ]]; then
            echo "Runtime gate failed: classification=$classification action_outcome=${{ steps.runtime_gate.outcome }}"
            exit 1
          fi
