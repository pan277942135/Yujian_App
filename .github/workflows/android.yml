name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MODEL_TFLITE_URL: https://github.com/pan277942135/Yujian/releases/download/mobile-model-v0.2/fish_classifier_v0_2.tflite
  MODEL_TFLITE_SHA256: b77ea78e7f8554078ea3a79051039af1ace04f0ac4e2604da57d1dd8f0b010e7
  MODEL_TENSOR_CONTRACT_URL: https://github.com/pan277942135/Yujian/releases/download/mobile-model-v0.2/tensor_contract.json
  MODEL_TENSOR_CONTRACT_SHA256: f9a477f4f9ecd23b0162ee7f06c0f6965f005a52f17755e11f7b9283e104b1d8
  DETECTOR_BUNDLE_URL: https://github.com/pan277942135/Yujian/releases/download/detector-model-v0.1/det_fish_v0_1_android_bundle.zip
  DETECTOR_BUNDLE_SHA256: 246ddacaf89ca7ecc9c64a47d3e12c5ee9088d92c763a38626778505ae8c15ee
  YUJIAN_API_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
  YUJIAN_FISH_KNOWLEDGE_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
  YUJIAN_FEEDBACK_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified MODEL_M1_v0.6 mobile asset and tensor contract
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            -o app/src/main/assets/fish_classifier.tflite \
            "$MODEL_TFLITE_URL"
          curl -fL --retry 3 --retry-delay 2 \
            -o app/src/main/assets/model_tensor_contract.json \
            "$MODEL_TENSOR_CONTRACT_URL"
          echo "$MODEL_TFLITE_SHA256  app/src/main/assets/fish_classifier.tflite" | sha256sum -c -
          echo "$MODEL_TENSOR_CONTRACT_SHA256  app/src/main/assets/model_tensor_contract.json" | sha256sum -c -

      - name: Verify production TFLite model
        run: python3 scripts/verify_production_model.py

      - name: Download and install verified DET_FISH_v0.1 Android bundle
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/detector_bundle.zip "$DETECTOR_BUNDLE_URL"
          echo "$DETECTOR_BUNDLE_SHA256  /tmp/detector_bundle.zip" | sha256sum -c -
          rm -rf /tmp/detector_bundle
          mkdir -p /tmp/detector_bundle app/src/main/assets app/src/androidTest/assets/detector
          unzip -q /tmp/detector_bundle.zip -d /tmp/detector_bundle
          cp /tmp/detector_bundle/fish_detector_yolox_nano_v0_1.onnx app/src/main/assets/
          cp /tmp/detector_bundle/detector_metadata.json app/src/main/assets/
          cp /tmp/detector_bundle/recognition_pipeline_v1.json app/src/main/assets/
          cp /tmp/detector_bundle/golden_cases.json app/src/androidTest/assets/detector/
          rm -rf app/src/androidTest/assets/detector/golden
          cp -R /tmp/detector_bundle/golden app/src/androidTest/assets/detector/golden

      - name: Verify production detector model and contract
        run: python3 scripts/verify_production_detector.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Compile Android runtime smoke test
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Prepare YuJian debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/YuJian-debug.apk

      - name: Upload installable debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/YuJian-debug.apk
          if-no-files-found: error
          retention-days: 7

  runtime-parity:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified MODEL_M1_v0.6 mobile asset and tensor contract
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            -o app/src/main/assets/fish_classifier.tflite \
            "$MODEL_TFLITE_URL"
          curl -fL --retry 3 --retry-delay 2 \
            -o app/src/main/assets/model_tensor_contract.json \
            "$MODEL_TENSOR_CONTRACT_URL"
          echo "$MODEL_TFLITE_SHA256  app/src/main/assets/fish_classifier.tflite" | sha256sum -c -
          echo "$MODEL_TENSOR_CONTRACT_SHA256  app/src/main/assets/model_tensor_contract.json" | sha256sum -c -

      - name: Verify production TFLite model
        run: python3 scripts/verify_production_model.py

      - name: Download and install verified DET_FISH_v0.1 Android bundle
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/detector_bundle.zip "$DETECTOR_BUNDLE_URL"
          echo "$DETECTOR_BUNDLE_SHA256  /tmp/detector_bundle.zip" | sha256sum -c -
          rm -rf /tmp/detector_bundle
          mkdir -p /tmp/detector_bundle app/src/main/assets app/src/androidTest/assets/detector
          unzip -q /tmp/detector_bundle.zip -d /tmp/detector_bundle
          cp /tmp/detector_bundle/fish_detector_yolox_nano_v0_1.onnx app/src/main/assets/
          cp /tmp/detector_bundle/detector_metadata.json app/src/main/assets/
          cp /tmp/detector_bundle/recognition_pipeline_v1.json app/src/main/assets/
          cp /tmp/detector_bundle/golden_cases.json app/src/androidTest/assets/detector/
          rm -rf app/src/androidTest/assets/detector/golden
          cp -R /tmp/detector_bundle/golden app/src/androidTest/assets/detector/golden

      - name: Verify production detector model and contract
        run: python3 scripts/verify_production_detector.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run classifier, detector, and pipeline trace parity on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.InferenceParityTest --stacktrace
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.DetectorGoldenParityTest --stacktrace
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.PipelineTraceTest --stacktrace
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.FishDetectionQualityGateTest --stacktrace
            test "$GITHUB_EVENT_NAME" = "push" && test "$GITHUB_REF" = "refs/heads/main" || exit 0
            mkdir -p build/home-evidence
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            adb shell pm clear com.yujian.ai.uiv2
            adb shell wm size 1080x1920
            adb shell monkey -p com.yujian.ai.uiv2 -c android.intent.category.LAUNCHER 1
            sleep 5
            adb exec-out screencap -p > build/home-evidence/home-empty-16-9.png

            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.HomeVisualEvidenceSeedTest#seedSingleGuestCatch --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1080x2340
            adb shell am force-stop com.yujian.ai.uiv2
            adb shell monkey -p com.yujian.ai.uiv2 -c android.intent.category.LAUNCHER 1
            sleep 5
            adb exec-out screencap -p > build/home-evidence/home-normal-guest-one-19-5-9.png

            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.HomeVisualEvidenceSeedTest#seedMultipleGuestCatches --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1080x2400
            adb shell am force-stop com.yujian.ai.uiv2
            adb shell monkey -p com.yujian.ai.uiv2 -c android.intent.category.LAUNCHER 1
            sleep 5
            adb exec-out screencap -p > build/home-evidence/home-normal-guest-multiple-20-9.png

            adb shell wm size 1080x2520
            sleep 3
            adb exec-out screencap -p > build/home-evidence/home-normal-guest-multiple-21-9.png

            adb shell wm size 1080x2400
            sleep 3
            adb shell screenrecord --time-limit 10 /sdcard/home-normal-motion.mp4
            adb pull /sdcard/home-normal-motion.mp4 build/home-evidence/home-normal-motion-10s.mp4


      - name: Upload Home visual evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-home-visual-evidence-${{ github.sha }}
          path: build/home-evidence
          if-no-files-found: error
          retention-days: 7
