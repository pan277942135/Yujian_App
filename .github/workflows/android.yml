name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_frozen_emulator_gate:
        description: Run the deterministic Frozen Recognition emulator gate
        required: false
        default: true
        type: boolean
      run_legacy_runtime_parity:
        description: Run the historical runtime-parity diagnostics
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  YUJIAN_API_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
  YUJIAN_FISH_KNOWLEDGE_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
  YUJIAN_FEEDBACK_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Empty Home runtime asset contract
        run: |
          python3 scripts/verify_empty_home_runtime_assets.py
          python3 scripts/verify_empty_home_runtime_v2.py
          python3 scripts/verify_recognition_runtime_contract.py
          python3 scripts/verify_recognition_runtime_contract.py

      - name: Bootstrap verified recognition assets
        run: python3 scripts/bootstrap_android_recognition_assets.py

      - name: Verify production TFLite model
        run: python3 scripts/verify_production_model.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle test --stacktrace --no-daemon --max-workers=2

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon --max-workers=2

      - name: Compile Android runtime smoke test
        run: gradle :app:assembleDebugAndroidTest --stacktrace --no-daemon --max-workers=2

      - name: Verify packaged recognition assets in APK
        run: python3 scripts/verify_packaged_android_apk.py

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace --no-daemon --max-workers=2

      - name: Prepare YuJian debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/YuJian-debug.apk

      - name: Upload installable debug APK
        if: success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/YuJian-debug.apk
          if-no-files-found: error
          retention-days: 7

  emulator-frozen-flow:
    # Deterministic Recognition gate: run automatically for PR updates and
    # remain manually runnable through workflow_dispatch.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_frozen_emulator_gate == true) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap verified recognition assets
        run: python3 scripts/bootstrap_android_recognition_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble APKs for emulator gate
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon --max-workers=2

      - name: Run deterministic Frozen Recognition emulator gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.RecognitionFrozenFlowEmulatorTest --stacktrace
            gate_status=$?
            mkdir -p evidence/ui_rework_v1/recognition
            adb pull /data/local/tmp/recognition-evidence/. evidence/ui_rework_v1/recognition/ || true
            exit $gate_status

      - name: Upload Frozen Recognition emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recognition-frozen-flow-emulator-evidence-${{ github.sha }}
          path: evidence/ui_rework_v1/recognition
          if-no-files-found: warn
          retention-days: 14

  runtime-parity:
    # Historical/manual diagnostics only. It is intentionally skipped for
    # push and pull_request delivery checks and cannot block a merge.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_legacy_runtime_parity == true }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Empty Home runtime asset contract
        run: |
          python3 scripts/verify_empty_home_runtime_assets.py
          python3 scripts/verify_empty_home_runtime_v2.py

      - name: Install runtime evidence image dependency
        run: python3 -m pip install --user Pillow

      - name: Bootstrap verified recognition assets
        run: python3 scripts/bootstrap_android_recognition_assets.py

      - name: Verify production TFLite model
        run: python3 scripts/verify_production_model.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install FFmpeg for runtime evidence clips
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run classifier, detector, and pipeline trace parity on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.InferenceParityTest --stacktrace
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.DetectorGoldenParityTest --stacktrace
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.PipelineTraceTest --stacktrace
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.FishDetectionQualityGateTest --stacktrace
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.RecognitionRuntimeAssetContractTest --stacktrace
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.RecognitionVisualRuntimeTest --stacktrace
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.EmptyHomeV2RuntimeContractTest --stacktrace
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.ui.designsystem.DesignSystemComponentPreviewTest --stacktrace
            if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then exit 0; fi
            mkdir -p build/designsystem-evidence
            DESIGNSYSTEM_CAPTURE_SETTLE_SECONDS=5 bash scripts/capture_designsystem_runtime_evidence.sh app/build/outputs/apk/debug/app-debug.apk build/designsystem-evidence
            mkdir -p build/home-evidence
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            # The emulator action disables animations for deterministic legacy
            # parity tests. Empty Home has its own reduce-motion contract, so
            # restore the normal animator scales before visual evidence.
            adb shell settings put global animator_duration_scale 1.0 || true
            adb shell settings put global transition_animation_scale 1.0 || true
            adb shell settings put global window_animation_scale 1.0 || true

            adb shell pm clear com.yujian.ai.uiv2
            adb shell wm size 1080x1920
            adb logcat -c
            adb shell monkey -p com.yujian.ai.uiv2 -c android.intent.category.LAUNCHER 1
            sleep 5
            if ! adb shell pidof com.yujian.ai.uiv2 | grep -q '[0-9]'; then echo 'EMPTY_HOME_APP_NOT_RUNNING'; adb logcat -d -b all -v threadtime | tail -n 400; exit 1; fi
            adb exec-out screencap -p > build/home-evidence/runtime_static.png
            sleep 4
            adb exec-out screencap -p > build/home-evidence/runtime_4s.png
            adb shell screenrecord --time-limit 15 /sdcard/full_runtime_15s.mp4
            adb pull /sdcard/full_runtime_15s.mp4 build/home-evidence/full_runtime_15s.mp4
            ffmpeg -y -i build/home-evidence/full_runtime_15s.mp4 -t 10 -c copy build/home-evidence/environment_motion.mp4
            # Android's screenrecord output resolution is device-dependent. Keep
            # evidence crops in normalized reference-space proportions instead
            # of assuming a 1080x1920 recording.
            ffmpeg -y -i build/home-evidence/full_runtime_15s.mp4 -vf "crop=iw/3:ih*0.22:iw*0.324:ih*0.484" -an build/home-evidence/bobber_ripple_crop.mp4
            ffmpeg -y -i build/home-evidence/full_runtime_15s.mp4 -vf "crop=iw*0.39:ih*0.27:iw*0.31:ih*0.69" -an build/home-evidence/camera_motion.mp4
            python3 scripts/build_empty_home_runtime_evidence.py --evidence-dir build/home-evidence --build-sha "$GITHUB_SHA"
            cp design/pages/home/empty_home/source/frozen/Empty_Home_Final_Design_V2_normalized_1080x1920.png build/home-evidence/static_reference.png

            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.HomeVisualEvidenceSeedTest#seedSingleGuestCatch --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1080x2340
            adb shell am force-stop com.yujian.ai.uiv2
            adb shell monkey -p com.yujian.ai.uiv2 -c android.intent.category.LAUNCHER 1
            sleep 5
            adb exec-out screencap -p > build/home-evidence/home-normal-guest-one-19-5-9.png

            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.HomeVisualEvidenceSeedTest#seedMultipleGuestCatches --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 1080x2400
            adb shell am force-stop com.yujian.ai.uiv2
            adb shell monkey -p com.yujian.ai.uiv2 -c android.intent.category.LAUNCHER 1
            sleep 5
            adb exec-out screencap -p > build/home-evidence/home-normal-guest-multiple-20-9.png

            adb shell wm size 1080x2520
            sleep 3
            adb exec-out screencap -p > build/home-evidence/home-normal-guest-multiple-21-9.png

            adb shell wm size 1080x2400
            sleep 3
            adb shell screenrecord --time-limit 10 /sdcard/home-normal-motion.mp4
            adb pull /sdcard/home-normal-motion.mp4 build/home-evidence/home-normal-motion-10s.mp4


      - name: Upload Home visual evidence
        if: success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-home-visual-evidence-${{ github.sha }}
          path: build/home-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Upload YuJian Design System runtime evidence
        if: success() && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-designsystem-runtime-evidence-${{ github.sha }}
          path: build/designsystem-evidence
          if-no-files-found: error
          retention-days: 7
