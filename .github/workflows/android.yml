name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified MODEL_M1_v0.2 mobile asset
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            -o app/src/main/assets/fish_classifier.tflite \
            https://github.com/pan277942135/Yujian/releases/download/mobile-model-v0.2/fish_classifier_v0_2.tflite

      - name: Verify production TFLite model
        run: python3 scripts/verify_production_model.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Compile Android runtime smoke test
        run: gradle :app:assembleDebugAndroidTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Upload installable debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Yujian-App-M1-v0.2-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  runtime-parity:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified MODEL_M1_v0.2 mobile asset
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            -o app/src/main/assets/fish_classifier.tflite \
            https://github.com/pan277942135/Yujian/releases/download/mobile-model-v0.2/fish_classifier_v0_2.tflite

      - name: Verify production TFLite model
        run: python3 scripts/verify_production_model.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run MODEL_M1_v0.2 golden-image parity on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yujian.ai.InferenceParityTest --stacktrace
