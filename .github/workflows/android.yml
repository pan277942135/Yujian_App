name: Android CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
      - 'refactor/**'
      - 'integration/**'
      - audit/design-system-v3-1-phase1-master-baseline
    paths-ignore:
      - ".github/workflows/android.yml"
      - ".github/workflows/nh01-cloud-runtime.yml"
      - ".github/workflows/control-plane-admission.yml"
      - "CONTROL_PLANE_REGISTRY.yaml"
      - "CONTROL_PLANE_CHANGE_SYNC.md"
      - "harness/FEATURE_MATRIX.yaml"
      - "harness/PHASE_TASK_STATE_MACHINE.yaml"
      - "harness/UNIFIED_CONTRACT_REGISTRY.yaml"
      - "harness/UNIFIED_CONTRACT_SCHEMA_V1.md"
      - "harness/CONTRACT_RESOLUTION_PROTOCOL.md"
      - "harness/STATE_UPDATE_PROTOCOL.md"
      - "harness/WORK_EXECUTION_STATE_SCHEMA_V1.json"
      - "harness/WORK_EXECUTION_STATE_TEMPLATE_V1.json"
      - "scripts/validate_project_master_state.py"
      - "scripts/validate_feature_matrix.py"
      - "scripts/validate_phase_task_state_machine.py"
      - "scripts/validate_unified_contract.py"
      - "scripts/validate_control_plane_registry.py"
      - "scripts/validate_control_plane_sync.py"
      - "scripts/validate_work_execution_state.py"
      - "scripts/validate_control_plane_admission.py"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle"
      - "build.gradle.kts"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "scripts/android_runtime/**"
      - "scripts/bootstrap_android_recognition_assets.py"
      - "scripts/export_apk_model_trace.py"
      - "scripts/verify_*.py"
      - "scripts/test_bootstrap_android_recognition_assets.py"
      - "scripts/run_android_runtime_gate.sh"
      - "scripts/run_recognition_frozen_emulator_gate.sh"
      - "design/system_v3/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      run_runtime_parity:
        description: Run the heavy Empty Home and Design System parity evidence gate
        required: false
        default: false
        type: boolean
      runtime_backend:
        description: API 28 emulator runner for exact-head runtime validation
        required: false
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - github-hosted

concurrency:
  group: yujian-android-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.runtime_backend || 'self-hosted' }}-${{ github.event_name == 'workflow_dispatch' && github.sha || 'branch' }}
  # Keep only the latest PR head; do not cancel manual/push release runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  YUJIAN_API_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
  YUJIAN_FISH_KNOWLEDGE_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
  YUJIAN_FEEDBACK_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      model_id: ${{ steps.model_trace.outputs.model_id }}
      model_sha256: ${{ steps.model_trace.outputs.model_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python image verification dependency
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pillow for asset verification
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Verify Android runtime asset contracts
        run: |
          python3 scripts/verify_yujian_resource_package.py
          python3 scripts/verify_empty_home_runtime_v2.py
          python3 scripts/verify_normal_home_runtime_v1.py
          python3 scripts/verify_recognition_design_closure_v1_1.py
          python3 scripts/verify_recognition_runtime_contract.py
          python3 scripts/test_bootstrap_android_recognition_assets.py
          python3 -m unittest discover -s scripts -p 'test_runtime_evidence_source_closure.py'

      - name: Materialize the verified design resource package
        run: >-
          python3 scripts/materialize_yujian_resource_package.py
          --output build/resource-packages/Yujian_NH01_P01-P03_Extracted_Resources_V1.zip

      - name: Upload the verified design resource package
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-NH01-P01-P03-resource-package
          path: build/resource-packages/Yujian_NH01_P01-P03_Extracted_Resources_V1.zip
          if-no-files-found: error
          retention-days: 14

      - name: Bootstrap verified recognition assets
        run: python3 scripts/bootstrap_android_recognition_assets.py
        env:
          YUJIAN_GITHUB_TOKEN: ${{ github.token }}

      - name: Read production model identity
        id: model_trace
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re
          p = pathlib.Path('app/src/main/assets/model_release_contract.json')
          contract = json.loads(p.read_text(encoding='utf-8'))
          if contract.get('build_sha') != '${{ github.sha }}':
              raise SystemExit('model snapshot build_sha does not match the checked-out commit')
          model_id = str(contract.get('model_id') or '')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+', model_id):
              raise SystemExit(f'invalid model_id for artifact naming: {model_id!r}')
          print(f'model_id={model_id}')
          print(f'model_sha256={contract["sha256"]}')
          print('MODEL_RELEASE_TRACE=' + json.dumps({
              key: contract[key] for key in (
                  'model_id', 'dataset_id', 'release_tag', 'sha256', 'bytes',
                  'class_count', 'class_order', 'input_shape', 'output_shape',
                  'class_map_sha256', 'tensor_contract_sha256'
              )
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Verify production TFLite model
        run: python3 scripts/verify_production_model.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Resolve stable SDK AAPT2
        shell: bash
        run: |
          YUJIAN_AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$YUJIAN_AAPT2"
          echo "YUJIAN_AAPT2=$YUJIAN_AAPT2" >> "$GITHUB_ENV"

      - name: Verify capture and Processing raster decoding
        run: python3 scripts/verify_capture_presentation_assets.py

      - name: Unit tests
        run: gradle -Pandroid.aapt2FromMavenOverride="$YUJIAN_AAPT2" test --stacktrace --no-daemon --max-workers=2

      - name: Camera runtime harness contract tests
        run: bash scripts/android_runtime/tests/test_contract.sh

      - name: Provision CI-only debug signing keystore
        run: |
          set -euo pipefail
          if [[ ! -s debug.keystore ]]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Assemble debug APK
        run: gradle -Pandroid.aapt2FromMavenOverride="$YUJIAN_AAPT2" :app:assembleDebug --stacktrace --no-daemon --max-workers=2

      - name: Compile Android runtime test APK
        run: gradle -Pandroid.aapt2FromMavenOverride="$YUJIAN_AAPT2" :app:assembleDebugAndroidTest --stacktrace --no-daemon --max-workers=2

      - name: Verify packaged launcher icon in APK
        run: python3 scripts/verify_packaged_launcher_icon.py

      - name: Verify packaged recognition assets in APK
        run: python3 scripts/verify_packaged_android_apk.py

      - name: Decode capture and Processing rasters from actual APK
        run: python3 scripts/verify_capture_presentation_assets.py --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Export model trace from the actual APK
        run: >-
          python3 scripts/export_apk_model_trace.py
          --apk app/build/outputs/apk/debug/app-debug.apk
          --output-dir build/runtime-apks
          --build-sha "$GITHUB_SHA"

      - name: Android lint
        run: gradle -Pandroid.aapt2FromMavenOverride="$YUJIAN_AAPT2" :app:lintDebug --stacktrace --no-daemon --max-workers=2

      # Build Once contract: the two files below are the only APK pair any
      # Android Runtime job is allowed to install.
      - name: Stage frozen runtime APK pair
        run: |
          mkdir -p build/runtime-apks
          cp app/build/outputs/apk/debug/app-debug.apk build/runtime-apks/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/runtime-apks/app-debug-androidTest.apk
          (cd build/runtime-apks && sha256sum app-debug.apk app-debug-androidTest.apk model_release_contract.json apk_model_trace.json > SHA256SUMS)
          test -s build/runtime-apks/app-debug.apk
          test -s build/runtime-apks/app-debug-androidTest.apk

      - name: Upload frozen runtime APK pair
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-runtime-apks-${{ github.sha }}-${{ steps.model_trace.outputs.model_id }}
          path: build/runtime-apks
          if-no-files-found: error
          retention-days: 14

      - name: Prepare YuJian debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/YuJian-debug.apk

      - name: Prepare Recognition Processing V1.3 QA APK
        id: recognition_qa_apk
        run: |
          filename="YuJian_Recognition_Visual_V1_3_QA_${GITHUB_SHA:0:12}_${{ steps.model_trace.outputs.model_id }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${filename}"
          echo "filename=${filename}" >> "$GITHUB_OUTPUT"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-debug-${{ github.sha }}-${{ steps.model_trace.outputs.model_id }}
          path: |
            app/build/outputs/apk/debug/YuJian-debug.apk
            build/runtime-apks/model_release_contract.json
            build/runtime-apks/apk_model_trace.json
          if-no-files-found: error
          retention-days: 7

      - name: Prepare YuJian Full-Surface APK bundle
        run: |
          filename="YuJian_Full_Surface_Android_${GITHUB_SHA:0:12}_${{ steps.model_trace.outputs.model_id }}.apk"
          mkdir -p build/full-surface-apk
          cp app/build/outputs/apk/debug/app-debug.apk "build/full-surface-apk/${filename}"
          cp build/runtime-apks/model_release_contract.json build/full-surface-apk/model_release_contract.json
          cp build/runtime-apks/apk_model_trace.json build/full-surface-apk/apk_model_trace.json
          (cd build/full-surface-apk && sha256sum "${filename}" model_release_contract.json apk_model_trace.json > SHA256SUMS)
          python3 scripts/verify_full_surface_apk_bundle.py \
            --bundle-dir build/full-surface-apk \
            --build-sha "$GITHUB_SHA" \
            --model-id "${{ steps.model_trace.outputs.model_id }}"

      - name: Upload Full-Surface Android APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-Full-Surface-${{ github.sha }}-${{ steps.model_trace.outputs.model_id }}
          path: build/full-surface-apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Recognition Processing V1.3 QA APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.recognition_qa_apk.outputs.filename }}
          path: |
            app/build/outputs/apk/debug/${{ steps.recognition_qa_apk.outputs.filename }}
            build/runtime-apks/model_release_contract.json
            build/runtime-apks/apk_model_trace.json
          if-no-files-found: error
          retention-days: 14

  # One job, one Harness, and one frozen APK pair.  The optional parity row is
  # part of this same matrix so it cannot grow a second ADB/install path.
  android-runtime:
    if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[normal-home-brand-title-validation]')) || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_backend == 'github-hosted' && 'ubuntu-latest' || fromJSON('["self-hosted", "yujian-android", "api28"]') }}
    timeout-minutes: 60
    env:
      YUJIAN_RUNTIME_BACKEND: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_backend || 'self-hosted' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - gate: normal-home-v1
            api_level: 28
            required: true
            emulator_options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 4096 -skin 1080x1920
          - gate: recognition-frozen
            api_level: 28
            required: true
            emulator_options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 4096 -skin 1080x1920
          - gate: camera-runtime-v1
            api_level: 28
            required: true
            emulator_options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -partition-size 4096 -skin 1080x1920
          - gate: empty-home-v2
            api_level: 28
            required: true
            emulator_options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 4096 -skin 1080x1920
          - gate: login-v2
            api_level: 28
            required: true
            emulator_options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 4096 -skin 1080x1920
          - gate: data-sanitization
            api_level: 28
            required: true
            emulator_options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 4096 -skin 1080x1920
          - gate: fish-guide-v1
            api_level: 28
            required: true
            emulator_options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 4096 -skin 1080x1920
          - gate: runtime-parity
            api_level: 28
            required: false
            emulator_options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 4096 -skin 1080x1920

    steps:
      - name: Checkout
        if: ${{ matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true) }}
        uses: actions/checkout@v4

      - name: Set up JDK 17 for GitHub-hosted API 28 runtime
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_backend == 'github-hosted' && (matrix.required == true || inputs.run_runtime_parity == true) }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK for GitHub-hosted API 28 runtime
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_backend == 'github-hosted' && (matrix.required == true || inputs.run_runtime_parity == true) }}
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Provision Pixel 2 API 28 emulator for GitHub-hosted runtime
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_backend == 'github-hosted' && (matrix.required == true || inputs.run_runtime_parity == true) }}
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          avd_home="$HOME/.android/avd"
          mkdir -p "$avd_home"
          export ANDROID_AVD_HOME="$avd_home"
          echo "ANDROID_AVD_HOME=$avd_home" >> "$GITHUB_ENV"
          sdkmanager --install "emulator" "system-images;android-28;google_apis;x86_64"
          printf 'no\n' | avdmanager create avd \
            --name yujian_pixel2_api28 \
            --package "system-images;android-28;google_apis;x86_64" \
            --device pixel_2 \
            -p "$avd_home/yujian_pixel2_api28.avd" \
            --force
          test -s "$avd_home/yujian_pixel2_api28.ini"
          "$sdk_root/emulator/emulator" -list-avds | grep -Fx yujian_pixel2_api28

      - name: Download frozen runtime APK pair
        if: ${{ matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true) }}
        uses: actions/download-artifact@v4
        with:
          name: YuJian-runtime-apks-${{ github.sha }}-${{ needs.build.outputs.model_id }}
          path: build/runtime-apks

      - name: Verify exact frozen APK pair
        if: ${{ matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true) }}
        run: |
          test -s build/runtime-apks/app-debug.apk
          test -s build/runtime-apks/app-debug-androidTest.apk
          (cd build/runtime-apks && sha256sum -c SHA256SUMS)
          ! find build/runtime-apks -type f -name '*.apk' | grep -vE '/(app-debug|app-debug-androidTest)\.apk$'
      - name: Add production model trace to runtime evidence
        if: ${{ matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true) }}
        run: |
          mkdir -p "evidence/runtime/${{ matrix.gate }}"
          cp build/runtime-apks/model_release_contract.json "evidence/runtime/${{ matrix.gate }}/model_release_contract.json"
          cp build/runtime-apks/apk_model_trace.json "evidence/runtime/${{ matrix.gate }}/apk_model_trace.json"

      - name: Install runtime parity dependencies
        if: ${{ matrix.gate == 'recognition-frozen' || matrix.gate == 'camera-runtime-v1' || matrix.gate == 'empty-home-v2' || matrix.gate == 'normal-home-v1' || matrix.gate == 'login-v2' || matrix.gate == 'fish-guide-v1' || (matrix.gate == 'runtime-parity' && github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          # Ubuntu 24.04 marks its system Python as externally managed
          # (PEP 668). Pillow is an evidence-only user dependency; keep the
          # runner image untouched and opt in explicitly to the user install.
          python3 -m pip install --user --break-system-packages Pillow
          python3 -c 'from PIL import Image; print("Pillow", Image.__version__)'

      - name: Prepare GCP self-hosted Android runtime
        if: ${{ matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true) }}
        shell: bash
        run: |
          set -euo pipefail
          preflight_log="evidence/runtime/${{ matrix.gate }}/infra/workflow_preflight.log"
          emulator_log="evidence/runtime/${{ matrix.gate }}/infra/emulator.log"
          mkdir -p "$(dirname "$preflight_log")"
          : > "$preflight_log"
          : > "$emulator_log"

          if [[ "$YUJIAN_RUNTIME_BACKEND" == "github-hosted" ]]; then
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            test -n "$sdk_root"
            avd_home="$HOME/.android/avd"
            export ANDROID_AVD_HOME="$avd_home"
            printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" | tee -a "$preflight_log"
            test -s "$avd_home/yujian_pixel2_api28.ini"
            echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
            echo "$sdk_root/emulator" >> "$GITHUB_PATH"
            echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            export PATH="$sdk_root/platform-tools:$sdk_root/emulator:$sdk_root/cmdline-tools/latest/bin:$PATH"
            if [[ -e /dev/kvm ]]; then sudo chmod 0666 /dev/kvm; fi
            adb="$sdk_root/platform-tools/adb"
            emulator="$sdk_root/emulator/emulator"
            avd_name="yujian_pixel2_api28"
          else
            echo "/opt/android-sdk/platform-tools" >> "$GITHUB_PATH"
            echo "/opt/android-sdk/emulator" >> "$GITHUB_PATH"
            test -e /dev/kvm
            adb=/opt/android-sdk/platform-tools/adb
            emulator=/opt/android-sdk/emulator/emulator
            avd_list="$("$emulator" -list-avds 2>&1)" || {
              printf '%s\n' "$avd_list" | tee -a "$preflight_log"
              echo 'ANDROID_AVD_LIST_FAILED' | tee -a "$preflight_log"
              exit 1
            }
            avd_name="$(printf '%s\n' "$avd_list" | awk '/28/ {print; exit}')"
            if [[ -z "$avd_name" ]]; then
              avd_name="$(printf '%s\n' "$avd_list" | awk 'NF {print; exit}')"
            fi
          fi

          printf 'ADB_BIN=%s\nEMULATOR_BIN=%s\nAPI_LEVEL=%s\n' \
            "$adb" "$emulator" "${{ matrix.api_level }}" | tee -a "$preflight_log"

          test -x "$emulator"
          "$emulator" -version 2>&1 | head -n 2 | tee -a "$preflight_log" || true
          if [[ "$YUJIAN_RUNTIME_BACKEND" == "github-hosted" ]]; then
            avd_list="$("$emulator" -list-avds 2>&1)" || {
              printf '%s\n' "$avd_list" | tee -a "$preflight_log"
              echo 'ANDROID_AVD_LIST_FAILED' | tee -a "$preflight_log"
              exit 1
            }
          fi
          printf 'AVAILABLE_AVDS_BEGIN\n%s\nAVAILABLE_AVDS_END\n' \
            "$avd_list" | tee -a "$preflight_log"
          if [[ -z "$avd_name" ]]; then
            echo 'ANDROID_AVD_NOT_FOUND' | tee -a "$preflight_log"
            exit 1
          fi
          printf 'SELECTED_AVD=%s\nEMULATOR_OPTIONS=%s\n' \
            "$avd_name" "${{ matrix.emulator_options }}" | tee -a "$preflight_log"

          "$adb" start-server >> "$preflight_log" 2>&1
          emulator_started=0
          existing_device="$("$adb" devices | awk 'NR > 1 && $2 == "device" {print $1; exit}')"
            if [[ "$existing_device" == emulator-* ]]; then
              printf 'RESTART_EXISTING_EMULATOR_FOR_NATIVE_PROFILE device=%s target_skin=1080x1920\n' \
                "$existing_device" | tee -a "$preflight_log"
              "$adb" -s "$existing_device" emu kill >> "$preflight_log" 2>&1
              stopped=0
              for stop_attempt in $(seq 1 30); do
                device_state="$("$adb" -s "$existing_device" get-state 2>/dev/null || true)"
                process_present=0
                pgrep -f -- "$emulator -avd $avd_name" >/dev/null 2>&1 && process_present=1
                if [[ "$device_state" != "device" && "$process_present" == "0" ]]; then
                  stopped=1
                  break
                fi
                sleep 1
              done
              if (( stopped != 1 )); then
                printf 'EXISTING_EMULATOR_DID_NOT_STOP device=%s\n' "$existing_device" | tee -a "$preflight_log"
                exit 1
              fi
              echo 'EXISTING_EMULATOR_STOPPED=1' | tee -a "$preflight_log"
            fi
          if ! "$adb" devices | awk 'NR > 1 && $2 == "device" {found=1} END {exit !found}'; then
            if ! pgrep -f -- "$emulator -avd" >/dev/null 2>&1; then
              read -r -a emulator_options <<< "${{ matrix.emulator_options }}"
              if [[ "$YUJIAN_RUNTIME_BACKEND" == "github-hosted" && ! -e /dev/kvm ]]; then
                emulator_options+=( -accel off )
              fi
              nohup "$emulator" -avd "$avd_name" -no-snapshot \
                "${emulator_options[@]}" > "$emulator_log" 2>&1 &
              emulator_pid=$!
              emulator_started=1
              printf 'EMULATOR_STARTED pid=%s\n' "$emulator_pid" | tee -a "$preflight_log"
            else
              echo 'EMULATOR_PROCESS_ALREADY_PRESENT' | tee -a "$preflight_log"
            fi
          else
            echo 'ADB_DEVICE_ALREADY_PRESENT' | tee -a "$preflight_log"
          fi

          restart_count=0
          wait_ok=0
          for wait_attempt in 1 2; do
            printf 'WAIT_FOR_DEVICE attempt=%s\n' "$wait_attempt" | tee -a "$preflight_log"
            if timeout 90s "$adb" wait-for-device >> "$preflight_log" 2>&1; then
              wait_ok=1
              break
            fi
            if (( restart_count == 0 )); then
              restart_count=1
              printf 'ADB_RESTART_ONCE reason=WAIT_FOR_DEVICE_TIMEOUT\n' | tee -a "$preflight_log"
              "$adb" kill-server >> "$preflight_log" 2>&1 || true
              "$adb" start-server >> "$preflight_log" 2>&1
            fi
          done

          if (( wait_ok != 1 )); then
            "$adb" devices -l >> "$preflight_log" 2>&1 || true
            if (( emulator_started == 1 )); then
              kill -0 "$emulator_pid" 2>/dev/null || echo 'EMULATOR_PROCESS_EXITED=1' | tee -a "$preflight_log"
              tail -n 80 "$emulator_log" | tee -a "$preflight_log"
            fi
            echo 'ADB_WAIT_FOR_DEVICE_FAILED' | tee -a "$preflight_log"
            exit 1
          fi

          ready=0
          readiness_attempts=30
          if [[ "$YUJIAN_RUNTIME_BACKEND" == "github-hosted" ]]; then
            # The hosted API 28 x86_64 emulator may run without KVM and reports
            # boot_completed only after its full software-rendered startup.
            # Emulator logs explicitly allow two minutes or more; keep the
            # self-hosted KVM window unchanged and give hosted runners 6 minutes.
            readiness_attempts=180
            echo 'EMULATOR_READINESS_WINDOW_SECONDS=360' | tee -a "$preflight_log"
          fi
          for readiness_attempt in $(seq 1 "$readiness_attempts"); do
            state="$("$adb" get-state 2>&1 | tr -d '\r' | head -n 1 || true)"
            boot="$("$adb" shell getprop sys.boot_completed 2>&1 | tr -d '\r' | head -n 1 || true)"
            sdk="$("$adb" shell getprop ro.build.version.sdk 2>&1 | tr -d '\r' | head -n 1 || true)"
            printf 'READINESS attempt=%s state=%s boot_completed=%s sdk=%s\n' \
              "$readiness_attempt" "$state" "$boot" "$sdk" | tee -a "$preflight_log"
            if [[ "$state" == "device" && "$boot" == "1" && "$sdk" == "${{ matrix.api_level }}" ]]; then
              ready=1
              break
            fi
            sleep 2
          done

          # Required diagnostics are captured before any APK installation.
          "$adb" shell getprop sys.boot_completed | tr -d '\r' | tee -a "$preflight_log"
          "$adb" devices -l | tee -a "$preflight_log"
          "$adb" shell df -h /data | tee -a "$preflight_log"
          package_log="${preflight_log}.packages"
          "$adb" shell pm list packages > "$package_log" 2>&1 || true
          head -n 20 "$package_log" | tee -a "$preflight_log"

          if (( ready != 1 )); then
            echo 'ADB_DEVICE_NOT_FULLY_READY' | tee -a "$preflight_log"
            exit 1
          fi

          display_profile_log="evidence/runtime/${{ matrix.gate }}/infra/display_profile.log"
          "$adb" shell wm size reset | tee "$display_profile_log"
          physical_size="$("$adb" shell wm size | tee -a "$display_profile_log" | tr -d '\r' | awk -F': ' '/Physical size:/ {print $2; exit}')"
          if [[ "$physical_size" != "1080x1920" ]]; then
            printf 'ANDROID_NATIVE_PROFILE_INVALID physical_size=%s expected=1080x1920 gate=%s\n' \
              "$physical_size" "${{ matrix.gate }}" | tee -a "$display_profile_log"
            exit 1
          fi
          "$adb" shell wm density 480 | tee -a "$display_profile_log"
          "$adb" shell wm density | tee -a "$display_profile_log"
          "$adb" shell settings put system font_scale 1.0
          "$adb" shell settings get system font_scale | tee -a "$display_profile_log"
          echo 'ANDROID_NATIVE_PROFILE_READY=1080x1920@480dpi' | tee -a "$display_profile_log"

      - name: Run unified Android Runtime Harness
        id: runtime_gate
        if: ${{ matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true) }}
        continue-on-error: true
        shell: bash
        run: |
          if [[ "$YUJIAN_RUNTIME_BACKEND" == "github-hosted" ]]; then
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            test -n "$sdk_root"
            export ADB="$sdk_root/platform-tools/adb"
          else
            export ADB=/opt/android-sdk/platform-tools/adb
          fi
          bash scripts/run_android_runtime_gate.sh --gate "${{ matrix.gate }}" --api-level "${{ matrix.api_level }}" --build-sha "$GITHUB_SHA" --app-apk build/runtime-apks/app-debug.apk --test-apk build/runtime-apks/app-debug-androidTest.apk --evidence-dir "evidence/runtime/${{ matrix.gate }}"

      - name: Materialize runtime status when emulator action fails before Harness startup
        if: ${{ always() && (matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true)) }}
        run: |
          result="evidence/runtime/${{ matrix.gate }}/runtime_gate_result.json"
          if [[ ! -s "$result" ]]; then
            mkdir -p "$(dirname "$result")"
            python3 scripts/android_runtime/result.py \
              --output "$result" \
              --gate "${{ matrix.gate }}" \
              --api-level "${{ matrix.api_level }}" \
              --build-sha "$GITHUB_SHA" \
              --adb-state unknown \
              --boot-completed unknown \
              --data-free-kb "" \
              --preflight FAIL \
              --install NOT_RUN \
              --instrumentation NOT_RUN \
              --evidence NOT_RUN \
              --classification BLOCKED_INFRA \
              --failure-phase EMULATOR_RUNNER \
              --failure-reason EMULATOR_RUNNER_FAILED_BEFORE_HARNESS \
              --summary-file "${GITHUB_STEP_SUMMARY:-}"
          fi

      - name: Upload runtime gate status and diagnostics
        if: ${{ always() && (matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true)) }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-gate-${{ matrix.gate }}-${{ github.sha }}-${{ needs.build.outputs.model_id }}
          path: evidence/runtime/${{ matrix.gate }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce runtime gate classification
        if: ${{ always() && (matrix.required == true || (github.event_name == 'workflow_dispatch' && inputs.run_runtime_parity == true)) }}
        run: |
          result="evidence/runtime/${{ matrix.gate }}/runtime_gate_result.json"
          classification="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["classification"])' "$result")"
          if [[ "${{ steps.runtime_gate.outcome }}" != "success" || "$classification" != "PASS" ]]; then
            echo "Runtime gate failed: classification=$classification action_outcome=${{ steps.runtime_gate.outcome }}"
            exit 1
          fi

  # A diagnostic-only commit can run the exact failing test first and then
  # the complete Normal Home suite without starting unrelated API 28 jobs.
  # Branch pushes with the explicit marker own exact-HEAD device evidence.
  # Avoid a duplicate PR merge-ref emulator job on every synchronize event.
  normal-home-brand-title-validation:
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[normal-home-brand-title-validation]')) || (github.event_name == 'pull_request' && github.event.action != 'synchronize' && github.event.pull_request.head.ref == 'audit/design-system-v3-1-phase1-master-baseline') }}
    needs: build
    runs-on: [self-hosted, yujian-android, api28]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frozen runtime APK pair
        uses: actions/download-artifact@v4
        with:
          name: YuJian-runtime-apks-${{ github.sha }}-${{ needs.build.outputs.model_id }}
          path: build/runtime-apks

      - name: Verify exact APK pair
        run: |
          set -euo pipefail
          test -s build/runtime-apks/app-debug.apk
          test -s build/runtime-apks/app-debug-androidTest.apk
          (cd build/runtime-apks && sha256sum -c SHA256SUMS)

      - name: Install runtime evidence dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user --break-system-packages Pillow
          python3 -c 'from PIL import Image; print("Pillow", Image.__version__)'

      - name: Prepare API 28 self-hosted emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "/opt/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/opt/android-sdk/emulator" >> "$GITHUB_PATH"
          test -e /dev/kvm
          adb=/opt/android-sdk/platform-tools/adb
          emulator=/opt/android-sdk/emulator/emulator
          evidence="evidence/runtime/normal-home-brand-title-v1/infra"
          mkdir -p "$evidence"
          test -x "$adb"
          test -x "$emulator"
          "$adb" start-server > "$evidence/adb-start.log" 2>&1

          existing_device="$("$adb" devices | awk 'NR > 1 && $2 == "device" {print $1; exit}')"
          if [[ -n "$existing_device" ]]; then
            existing_api="$("$adb" -s "$existing_device" shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r' || true)"
            if [[ "$existing_api" != "28" ]]; then
              "$adb" -s "$existing_device" emu kill >> "$evidence/adb-start.log" 2>&1 || true
              for attempt in $(seq 1 30); do
                if ! "$adb" devices | awk 'NR > 1 && $2 == "device" {found=1} END {exit !found}'; then break; fi
                sleep 1
              done
              existing_device=""
            fi
          fi

          if [[ -z "$existing_device" ]]; then
            avd_list="$("$emulator" -list-avds 2>&1)"
            avd_name="$(printf '%s\n' "$avd_list" | awk '/28/ {print; exit}')"
            if [[ -z "$avd_name" ]]; then
              printf 'No API 28 AVD found:\n%s\n' "$avd_list" | tee "$evidence/avd-list.log"
              exit 1
            fi
            nohup "$emulator" -avd "$avd_name" -no-snapshot -no-window \
              -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none \
              -partition-size 4096 -skin 1080x1920 > "$evidence/emulator.log" 2>&1 &
          fi

          timeout 120s "$adb" wait-for-device
          ready=0
          for attempt in $(seq 1 60); do
            state="$("$adb" get-state 2>/dev/null | tr -d '\r' || true)"
            boot="$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            api="$("$adb" shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r' || true)"
            printf 'READINESS attempt=%s state=%s boot=%s api=%s\n' "$attempt" "$state" "$boot" "$api" | tee -a "$evidence/runner-readiness.log"
            if [[ "$state" == "device" && "$boot" == "1" && "$api" == "28" ]]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          "$adb" shell wm size 1080x1920 | tee "$evidence/wm-size-before-test.log"
          "$adb" shell wm density | tee "$evidence/wm-density-before-test.log"
          "$adb" shell settings get system font_scale | tee "$evidence/font-scale-before-test.log"
          "$adb" devices -l | tee "$evidence/adb-devices.log"

      - name: Run targeted test, Normal Home suite, and evidence capture
        id: validation
        continue-on-error: true
        env:
          ADB: /opt/android-sdk/platform-tools/adb
          APP_APK: build/runtime-apks/app-debug.apk
          TEST_APK: build/runtime-apks/app-debug-androidTest.apk
          API_LEVEL: '28'
          BUILD_SHA: ${{ github.sha }}
          EVIDENCE_DIR: evidence/runtime/normal-home-brand-title-v1
        run: bash scripts/android_runtime/run_normal_home_brand_title_validation.sh

      - name: Upload targeted validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: normal-home-brand-title-validation-${{ github.sha }}-${{ needs.build.outputs.model_id }}
          path: evidence/runtime/normal-home-brand-title-v1
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce targeted validation result
        if: ${{ always() }}
        run: |
          result="evidence/runtime/normal-home-brand-title-v1/normal_home_brand_title_result.json"
          test -s "$result"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$result")"
          if [[ "${{ steps.validation.outcome }}" != "success" || "$status" != "PASS" ]]; then
            echo "Normal Home brand-title validation failed: status=$status action_outcome=${{ steps.validation.outcome }}"
            exit 1
          fi
