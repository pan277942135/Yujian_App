name: Camera Capture P0 V2 Product Runtime

on:
  push:
    branches:
      - fix/recognition-camera-capture-p0-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yujian-camera-capture-p0-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: [self-hosted, yujian-android, api28]
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read runtime authority and camera capabilities
        shell: bash
        run: |
          set -uo pipefail
          out="evidence/camera-runtime-inventory"
          mkdir -p "$out"
          report="$out/camera_preflight.txt"
          {
            printf 'RUNNER_NAME=%s\n' "${RUNNER_NAME:-unknown}"
            printf 'RUNNER_OS=%s\n' "${RUNNER_OS:-unknown}"
            printf 'RUNNER_ARCH=%s\n' "${RUNNER_ARCH:-unknown}"
            printf 'MACHINE_NAME=%s\n' "$(hostname)"
            printf '\n--- OS ---\n'
            cat /etc/os-release
            uname -a

            adb="/opt/android-sdk/platform-tools/adb"
            emulator="/opt/android-sdk/emulator/emulator"
            printf '\nADB_BIN=%s\nEMULATOR_BIN=%s\n' "$adb" "$emulator"
            test -x "$adb" || { echo 'ADB_MISSING=1'; exit 1; }
            test -x "$emulator" || { echo 'EMULATOR_MISSING=1'; exit 1; }
            "$adb" version 2>&1
            "$emulator" -version 2>&1

            printf '\n--- AVD list ---\n'
            avd_list="$("$emulator" -list-avds 2>&1)"
            printf '%s\n' "$avd_list"
            avd_name="$(printf '%s\n' "$avd_list" | awk '/28/ {print; exit}')"
            if [[ -z "$avd_name" ]]; then
              avd_name="$(printf '%s\n' "$avd_list" | awk 'NF {print; exit}')"
            fi
            printf 'SELECTED_AVD=%s\n' "${avd_name:-none}"
            if [[ -z "$avd_name" ]]; then
              echo 'ANDROID_AVD_NOT_FOUND=1'
              exit 1
            fi

            printf '\n--- AVD ini and config.ini ---\n'
            printf 'ANDROID_AVD_HOME=%s\nANDROID_USER_HOME=%s\nHOME=%s\n'               "${ANDROID_AVD_HOME:-unset}" "${ANDROID_USER_HOME:-unset}" "$HOME"
            avd_ini=''
            for candidate in               "${ANDROID_AVD_HOME:-}/$avd_name.ini"               "${ANDROID_USER_HOME:-}/avd/$avd_name.ini"               "$HOME/.android/avd/$avd_name.ini"; do
              if [[ -n "$candidate" && -f "$candidate" ]]; then avd_ini="$candidate"; break; fi
            done
            printf 'AVD_INI_PATH=%s\n' "${avd_ini:-not-found}"
            if [[ -n "$avd_ini" ]]; then
              cat "$avd_ini"
              avd_dir="$(sed -n 's/^path=//p' "$avd_ini" | head -n 1)"
              if [[ -n "$avd_dir" && -f "$avd_dir/config.ini" ]]; then
                printf 'AVD_CONFIG_PATH=%s\n' "$avd_dir/config.ini"
                cat "$avd_dir/config.ini"
              else
                echo 'AVD_CONFIG_PATH=not-found'
              fi
            else
              echo 'AVD_CONFIG_PATH=not-found'
            fi

            printf '\n--- Current workflow camera arguments ---\n'
            rg -n -C 1 'camera-(back|front)|emulator_options:' .github/workflows/android.yml || true

            printf '\n--- Emulator help camera options ---\n'
            "$emulator" -help > "$out/emulator_help.txt" 2>&1
            help_rc=$?
            printf 'EMULATOR_HELP_EXIT=%s\n' "$help_rc"
            grep -in -C 3 camera "$out/emulator_help.txt" || true

            "$emulator" -help-all > "$out/emulator_help_all.txt" 2>&1
            help_all_rc=$?
            printf 'EMULATOR_HELP_ALL_EXIT=%s\n' "$help_all_rc"
            grep -in -C 3 camera "$out/emulator_help_all.txt" || true

            printf '\n--- Existing ADB devices (read-only) ---\n'
            "$adb" devices -l 2>&1
            serials="$("$adb" devices | awk 'NR > 1 && $2 == "device" && $1 ~ /^emulator-/ {print $1}')"
            for serial in $serials; do
              printf '\n--- Existing device %s ---\n' "$serial"
              "$adb" -s "$serial" shell getprop sys.boot_completed 2>&1
              "$adb" -s "$serial" shell getprop ro.build.version.sdk 2>&1
              "$adb" -s "$serial" shell dumpsys media.camera 2>&1 ||                 "$adb" -s "$serial" shell dumpsys camera 2>&1 || true
            done
          } 2>&1 | tee "$report"
          test -s "$report"

      - name: Upload camera inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-runtime-inventory-${{ github.sha }}
          path: evidence/camera-runtime-inventory
          if-no-files-found: error
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      model_id: ${{ steps.model_trace.outputs.model_id }}
    env:
      YUJIAN_API_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
      YUJIAN_FISH_KNOWLEDGE_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
      YUJIAN_FEEDBACK_BASE_URL: https://yujian-model-factory-console-571785698442.asia-east1.run.app
    steps:
      - name: Checkout product source
        uses: actions/checkout@v4

      - name: Checkout frozen camera runtime harness
        uses: actions/checkout@v4
        with:
          ref: 7da54bff8ad316393ccf94ecc76dba7fb646a1d2
          path: camera-harness

      - name: Verify camera-only product source changes
        shell: bash
        run: |
          set -euo pipefail
          product_base="43d40b25b0667e89f2b67d62edf5d483e75302e7"
          harness_parent="7da54bff8ad316393ccf94ecc76dba7fb646a1d2"
          git fetch --no-tags origin "$product_base"
          git diff --check "$product_base" "$GITHUB_SHA"
          unexpected="$(git diff --name-only "$product_base" "$GITHUB_SHA" -- app/src/main/ | grep -Ev '^(app/src/main/java/com/yujian/ai/ui/screens/IdentifyScreen.kt|app/src/main/java/com/yujian/ai/ui/identify/RecognitionCameraCaptureContract.kt)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'UNEXPECTED_PRODUCT_SOURCE_CHANGES\n%s\n' "$unexpected"
            exit 1
          fi
          printf 'PRODUCT_BASE_SHA=%s\nPRODUCT_SOURCE_SHA=%s\nHARNESS_PARENT_SHA=%s\nBUILD_SHA=%s\n' \
            "$product_base" "$GITHUB_SHA" "$harness_parent" "$GITHUB_SHA" | tee build-source-provenance.txt
          cat build-source-provenance.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python asset verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow for asset verification
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Verify frozen runtime asset contracts
        run: |
          python3 scripts/verify_empty_home_runtime_v2.py
          python3 scripts/verify_normal_home_runtime_v1.py
          python3 scripts/verify_recognition_design_closure_v1_1.py
          python3 scripts/verify_recognition_runtime_contract.py

      - name: Test camera runtime gate permission handling
        run: bash camera-harness/scripts/android_runtime/tests/test_camera_runtime_gate.sh

      - name: Bootstrap verified recognition assets
        run: python3 scripts/bootstrap_android_recognition_assets.py

      - name: Read production model identity
        id: model_trace
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re
          path = pathlib.Path('app/src/main/assets/model_release_contract.json')
          contract = json.loads(path.read_text(encoding='utf-8'))
          if contract.get('build_sha') != '${{ github.sha }}':
              raise SystemExit('model snapshot build_sha does not match this infrastructure build')
          model_id = str(contract.get('model_id') or '')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+', model_id):
              raise SystemExit(f'invalid model_id for artifact naming: {model_id!r}')
          print(f'model_id={model_id}')
          print(f'model_sha256={contract["sha256"]}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve stable SDK AAPT2
        shell: bash
        run: |
          set -euo pipefail
          aapt2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$aapt2"
          echo "YUJIAN_AAPT2=$aapt2" >> "$GITHUB_ENV"

      - name: Compile unit and camera instrumentation tests
        run: |
          gradle -Pandroid.aapt2FromMavenOverride="$YUJIAN_AAPT2" \
            test :app:assembleDebug :app:assembleDebugAndroidTest \
            --stacktrace --no-daemon --max-workers=2

      - name: Stage exact runtime APK pair and provenance
        shell: bash
        run: |
          set -euo pipefail
          out="build/camera-runtime-apks"
          mkdir -p "$out"
          cp app/build/outputs/apk/debug/app-debug.apk "$out/app-debug.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$out/app-debug-androidTest.apk"
          cp app/src/main/assets/model_release_contract.json "$out/model_release_contract.json"
          cat build-source-provenance.txt > "$out/camera_runtime_provenance.txt"
          printf 'MODEL_ID=%s\nMODEL_SHA256=%s\n' \
            "${{ steps.model_trace.outputs.model_id }}" \
            "${{ steps.model_trace.outputs.model_sha256 }}" >> "$out/camera_runtime_provenance.txt"
          release_name="YuJian_CameraP0_V2_${GITHUB_SHA:0:12}_MODEL_CROP_M1_v0.2.apk"
          cp "$out/app-debug.apk" "$out/$release_name"
          {
            printf 'CAMERA_RELEASE_APK=%s\n' "$release_name"
            printf 'CAMERA_RELEASE_APK_BYTES=%s\n' "$(stat -c '%s' "$out/$release_name")"
          } >> "$out/camera_runtime_provenance.txt"
          (cd "$out" && sha256sum app-debug.apk app-debug-androidTest.apk model_release_contract.json "$release_name" > SHA256SUMS)
          cat "$out/camera_runtime_provenance.txt" >> "$GITHUB_STEP_SUMMARY"
          cat "$out/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload camera runtime APK pair
        uses: actions/upload-artifact@v4
        with:
          name: camera-runtime-apks-${{ github.sha }}
          path: build/camera-runtime-apks
          if-no-files-found: error
          retention-days: 14

  camera-runtime:
    needs: [inventory, build]
    runs-on: [self-hosted, yujian-android, api28]
    timeout-minutes: 60
    steps:
      - name: Checkout product source
        uses: actions/checkout@v4

      - name: Checkout frozen camera runtime harness
        uses: actions/checkout@v4
        with:
          ref: 7da54bff8ad316393ccf94ecc76dba7fb646a1d2
          path: camera-harness

      - name: Download runner inventory
        uses: actions/download-artifact@v4
        with:
          name: camera-runtime-inventory-${{ github.sha }}
          path: evidence/camera-runtime-inventory

      - name: Download frozen APK pair
        uses: actions/download-artifact@v4
        with:
          name: camera-runtime-apks-${{ github.sha }}
          path: build/camera-runtime-apks

      - name: Verify APK provenance and source freeze
        shell: bash
        run: |
          set -euo pipefail
          (cd build/camera-runtime-apks && sha256sum -c SHA256SUMS)
          grep -Fx "PRODUCT_SOURCE_SHA=$GITHUB_SHA" build/camera-runtime-apks/camera_runtime_provenance.txt
          grep -Fx 'HARNESS_PARENT_SHA=7da54bff8ad316393ccf94ecc76dba7fb646a1d2' build/camera-runtime-apks/camera_runtime_provenance.txt
          grep -Fq 'cameraSelector = CameraSelector.DEFAULT_BACK_CAMERA' app/src/main/java/com/yujian/ai/ui/screens/IdentifyScreen.kt
          grep -Fq 'setEnabledUseCases(CameraController.IMAGE_CAPTURE)' app/src/main/java/com/yujian/ai/ui/screens/IdentifyScreen.kt
          git fetch --no-tags origin 43d40b25b0667e89f2b67d62edf5d483e75302e7
          unexpected="$(git diff --name-only 43d40b25b0667e89f2b67d62edf5d483e75302e7 "$GITHUB_SHA" -- app/src/main/ | grep -Ev '^(app/src/main/java/com/yujian/ai/ui/screens/IdentifyScreen.kt|app/src/main/java/com/yujian/ai/ui/identify/RecognitionCameraCaptureContract.kt)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'UNEXPECTED_PRODUCT_SOURCE_CHANGES\n%s\n' "$unexpected"
            exit 1
          fi

      - name: Verify installed emulator camera mode support
        id: camera_caps
        shell: bash
        run: |
          set -euo pipefail
          out="evidence/camera-runtime-v1"
          mkdir -p "$out"
          emulator="/opt/android-sdk/emulator/emulator"
          inventory="evidence/camera-runtime-inventory/camera_preflight.txt"
          help_all="$out/emulator_help_all.txt"
          "$emulator" -help-all > "$help_all" 2>&1
          grep -i -A5 -B2 'camera-back' "$help_all" > "$out/camera_mode_help.txt"
          avd_name="$(sed -n 's/^SELECTED_AVD=//p' "$inventory" | head -n 1)"
          test -n "$avd_name"
          test "$avd_name" = "yujian-api28"
          grep -Eq '^hw.camera.back[[:space:]]*=[[:space:]]*emulated' "$inventory"
          modes="$out/camera_mode_help.txt"
          valid_modes="$out/camera_valid_modes.txt"
          sed -n '/Valid values for <mode> are:/,$p' "$modes" |
            sed -n 's/^[[:space:]]*\([[:alnum:]_]*\)[[:space:]]*->.*/\1/p' > "$valid_modes"
          if ! grep -qx 'emulated' "$valid_modes"; then
            echo "The pinned API 28 harness configuration requires the already-proven emulated back-camera mode."
            cat "$modes"
            exit 1
          fi
          camera_mode="emulated"
          {
            printf 'SELECTED_AVD=%s\n' "$avd_name"
            printf 'VALID_CAMERA_BACK_MODES=%s\n' "$(paste -sd, "$valid_modes")"
            printf 'SELECTED_CAMERA_BACKEND=%s\n' "$camera_mode"
            printf 'HOST_WEBCAM_DEPENDENCY=NO\n'
          } | tee "$out/camera_mode_selection.txt"
          echo "avd_name=$avd_name" >> "$GITHUB_OUTPUT"
          echo "camera_mode=$camera_mode" >> "$GITHUB_OUTPUT"

      - name: Start camera-enabled API 28 AVD and wait for readiness
        id: runtime_prep
        continue-on-error: true
        shell: bash
        env:
          ADB: /opt/android-sdk/platform-tools/adb
        run: |
          set -euo pipefail
          out="evidence/camera-runtime-v1"
          mkdir -p "$out"
          echo "/opt/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/opt/android-sdk/emulator" >> "$GITHUB_PATH"
          adb="/opt/android-sdk/platform-tools/adb"
          emulator="/opt/android-sdk/emulator/emulator"
          avd_name="${{ steps.camera_caps.outputs.avd_name }}"
          camera_mode="${{ steps.camera_caps.outputs.camera_mode }}"
          emulator_log="$out/emulator.log"
          preflight="$out/runner_preflight.txt"
          command="$emulator -avd $avd_name -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back $camera_mode -partition-size 4096"
          printf 'RUNNER_NAME=%s\nRUNNER_OS=%s\nAVD=%s\nCAMERA_BACKEND=%s\nEFFECTIVE_LAUNCH_COMMAND=%s\n' \
            "${RUNNER_NAME:-unknown}" "${RUNNER_OS:-unknown}" "$avd_name" "$camera_mode" "$command" \
            | tee "$preflight"
          "$adb" start-server >> "$preflight" 2>&1

          old_devices="$("$adb" devices | awk 'NR > 1 && $2 == "device" && $1 ~ /^emulator-/ {print $1}')"
          for serial in $old_devices; do
            printf 'STOPPING_PREEXISTING_EMULATOR=%s\n' "$serial" | tee -a "$preflight"
            "$adb" -s "$serial" emu kill >> "$preflight" 2>&1 || true
          done
          for attempt in $(seq 1 30); do
            remaining="$("$adb" devices | awk 'NR > 1 && $2 == "device" && $1 ~ /^emulator-/ {print $1}')"
            if [[ -z "$remaining" ]]; then break; fi
            if (( attempt == 30 )); then
              printf 'PREEXISTING_EMULATOR_DID_NOT_STOP=%s\n' "$remaining" | tee -a "$preflight"
              exit 1
            fi
            sleep 1
          done

          nohup "$emulator" -avd "$avd_name" -no-snapshot -no-window \
            -gpu swiftshader_indirect -noaudio -no-boot-anim \
            -camera-back "$camera_mode" -partition-size 4096 \
            > "$emulator_log" 2>&1 &
          emulator_pid=$!
          printf 'EMULATOR_PID=%s\n' "$emulator_pid" | tee -a "$preflight"

          if ! timeout 120s "$adb" wait-for-device >> "$preflight" 2>&1; then
            echo "ADB_WAIT_FOR_DEVICE=FAIL" | tee -a "$preflight"
            tail -n 100 "$emulator_log" >> "$preflight" || true
            exit 1
          fi

          ready=0
          for attempt in $(seq 1 90); do
            state="$("$adb" get-state 2>&1 | tr -d '\r' | head -n 1 || true)"
            boot="$("$adb" shell getprop sys.boot_completed 2>&1 | tr -d '\r' | head -n 1 || true)"
            api="$("$adb" shell getprop ro.build.version.sdk 2>&1 | tr -d '\r' | head -n 1 || true)"
            pm_ok=0
            timeout 10s "$adb" shell pm list packages > "$out/packages.txt" 2>&1 && pm_ok=1 || true
            system_ui="$("$adb" shell pidof com.android.systemui 2>/dev/null | tr -d '\r' || true)"
            launcher="$("$adb" shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.HOME 2>&1 | tr -d '\r' | tail -n 1 || true)"
            camera_service="$("$adb" shell service check media.camera 2>&1 | tr -d '\r' | tail -n 1 || true)"
            printf 'READINESS attempt=%s state=%s boot_completed=%s api=%s pm=%s system_ui=%s launcher=%s camera_service=%s\n' \
              "$attempt" "$state" "$boot" "$api" "$pm_ok" "${system_ui:-missing}" \
              "${launcher:-missing}" "${camera_service:-missing}" | tee -a "$preflight"
            if [[ "$state" == "device" && "$boot" == "1" && "$api" == "28" &&
                  "$pm_ok" == "1" && -n "$system_ui" && -n "$launcher" &&
                  "$camera_service" == *"found"* ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          "$adb" shell dumpsys media.camera > "$out/camera_service_boot_preflight.txt" 2>&1 || \
            "$adb" shell dumpsys camera > "$out/camera_service_boot_preflight.txt" 2>&1 || true
          if (( ready != 1 )); then
            echo "EMULATOR_READINESS=FAIL" | tee -a "$preflight"
            tail -n 100 "$emulator_log" >> "$preflight" || true
            exit 1
          fi
          echo "EMULATOR_READINESS=PASS" | tee -a "$preflight"
          echo "PACKAGE_MANAGER_RESPONSIVE=PASS" | tee -a "$preflight"
          echo "SYSTEM_UI_AND_LAUNCHER_READY=PASS" | tee -a "$preflight"
          echo "CAMERA_SERVICE_RESPONSIVE=PASS" | tee -a "$preflight"

      - name: Run production CameraX runtime gate
        id: camera_gate
        if: ${{ always() && steps.runtime_prep.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          ADB: /opt/android-sdk/platform-tools/adb
        run: |
          bash camera-harness/scripts/run_android_runtime_gate.sh \
            --gate camera-runtime-v1 --api-level 28 --build-sha "$GITHUB_SHA" \
            --app-apk build/camera-runtime-apks/app-debug.apk \
            --test-apk build/camera-runtime-apks/app-debug-androidTest.apk \
            --evidence-dir evidence/runtime/camera-runtime-v1

      - name: Run existing runtime smoke gate
        id: smoke_gate
        if: ${{ always() && steps.runtime_prep.outcome == 'success' && steps.camera_gate.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          ADB: /opt/android-sdk/platform-tools/adb
        run: |
          bash camera-harness/scripts/run_android_runtime_gate.sh \
            --gate camera-runtime-smoke --api-level 28 --build-sha "$GITHUB_SHA" \
            --app-apk build/camera-runtime-apks/app-debug.apk \
            --test-apk build/camera-runtime-apks/app-debug-androidTest.apk \
            --evidence-dir evidence/runtime/existing-harness-smoke

      - name: Stop camera-enabled emulator
        if: ${{ always() && hashFiles('evidence/camera-runtime-v1/runner_preflight.txt') != '' }}
        shell: bash
        env:
          ADB: /opt/android-sdk/platform-tools/adb
        run: |
          set -uo pipefail
          adb="/opt/android-sdk/platform-tools/adb"
          "$adb" emu kill >/dev/null 2>&1 || true
          for attempt in $(seq 1 30); do
            if ! "$adb" devices | awk 'NR > 1 && $2 == "device" && $1 ~ /^emulator-/ {found=1} END {exit !found}'; then
              echo "CAMERA_EMULATOR_STOPPED=YES"
              exit 0
            fi
            sleep 1
          done
          echo "CAMERA_EMULATOR_STOPPED=NO"
          exit 1

      - name: Materialize runtime status and summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          camera_result="evidence/runtime/camera-runtime-v1/runtime_gate_result.json"
          smoke_result="evidence/runtime/existing-harness-smoke/runtime_gate_result.json"
          mkdir -p evidence/runtime/camera-runtime-v1 evidence/runtime/existing-harness-smoke
          if [[ ! -s "$camera_result" ]]; then
            python3 camera-harness/scripts/android_runtime/result.py \
              --output "$camera_result" --gate camera-runtime-v1 --api-level 28 \
              --build-sha "$GITHUB_SHA" --adb-state unknown --boot-completed unknown \
              --data-free-kb "" --preflight FAIL --install NOT_RUN --instrumentation NOT_RUN \
              --evidence NOT_RUN --classification BLOCKED_INFRA \
              --failure-phase EMULATOR_RUNNER --failure-reason CAMERA_RUNTIME_PREPARATION_FAILED \
              --summary-file "$GITHUB_STEP_SUMMARY"
          fi
          if [[ ! -s "$smoke_result" ]]; then
            python3 camera-harness/scripts/android_runtime/result.py \
              --output "$smoke_result" --gate camera-runtime-smoke --api-level 28 \
              --build-sha "$GITHUB_SHA" --adb-state unknown --boot-completed unknown \
              --data-free-kb "" --preflight NOT_RUN --install NOT_RUN --instrumentation NOT_RUN \
              --evidence NOT_RUN --classification BLOCKED_INFRA \
              --failure-phase EMULATOR_RUNNER --failure-reason EXISTING_RUNTIME_SMOKE_NOT_RUN \
              --summary-file "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "## Camera Capture P0 V2 Product Runtime"
            echo
            echo "- Product Base SHA: 43d40b25b0667e89f2b67d62edf5d483e75302e7"
            echo "- Product Source SHA: $GITHUB_SHA"
            echo "- Frozen Harness Parent: 7da54bff8ad316393ccf94ecc76dba7fb646a1d2"
            echo "- Camera gate: $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["classification"])' "$camera_result")"
            echo "- Existing runtime smoke: $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["classification"])' "$smoke_result")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload camera runtime and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-runtime-evidence-${{ github.sha }}
          path: |
            evidence/camera-runtime-inventory
            evidence/camera-runtime-v1
            evidence/runtime/camera-runtime-v1
            evidence/runtime/existing-harness-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Enforce camera and smoke gate results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          camera_class="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["classification"])' evidence/runtime/camera-runtime-v1/runtime_gate_result.json)"
          smoke_class="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["classification"])' evidence/runtime/existing-harness-smoke/runtime_gate_result.json)"
          if [[ "$camera_class" != "PASS" || "$smoke_class" != "PASS" ]]; then
            echo "Camera gate classification=$camera_class; existing smoke classification=$smoke_class"
            exit 1
          fi



  release-camera-apk:
    needs: [build, camera-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download validated CameraX runtime APK pair
        uses: actions/download-artifact@v4
        with:
          name: camera-runtime-apks-${{ github.sha }}
          path: build/camera-runtime-apks

      - name: Package the validated Camera P0 V2 APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          (cd build/camera-runtime-apks && sha256sum -c SHA256SUMS)
          release_name="YuJian_CameraP0_V2_${GITHUB_SHA:0:12}_MODEL_CROP_M1_v0.2.apk"
          mkdir -p build/camera-release
          cp "build/camera-runtime-apks/$release_name" "build/camera-release/$release_name"
          bytes="$(stat -c '%s' "build/camera-release/$release_name")"
          sha="$(sha256sum "build/camera-release/$release_name" | awk '{print $1}')"
          test "$bytes" -gt 0
          printf 'PRODUCT_BASE_SHA=43d40b25b0667e89f2b67d62edf5d483e75302e7\nPRODUCT_SOURCE_SHA=%s\nHARNESS_PARENT_SHA=7da54bff8ad316393ccf94ecc76dba7fb646a1d2\nBUILD_SHA=%s\nAPK_FILENAME=%s\nAPK_BYTES=%s\nAPK_SHA256=%s\n' \
            "$GITHUB_SHA" "$GITHUB_SHA" "$release_name" "$bytes" "$sha" \
            | tee build/camera-release/camera_release_provenance.txt
          (cd build/camera-release && sha256sum "$release_name" camera_release_provenance.txt > SHA256SUMS)
          {
            printf 'APK_FILENAME=%s\nAPK_BYTES=%s\nAPK_SHA256=%s\n' "$release_name" "$bytes" "$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Upload validated Camera P0 V2 APK
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: YuJian_CameraP0_V2_${{ github.sha }}_MODEL_CROP_M1_v0.2
          path: build/camera-release
          if-no-files-found: error
          retention-days: 14

      - name: Report APK artifact
        shell: bash
        run: |
          {
            echo "## Camera P0 V2 Validated APK"
            echo
            echo "- Filename: ${{ steps.package.outputs.APK_FILENAME }}"
            echo "- Bytes: ${{ steps.package.outputs.APK_BYTES }}"
            echo "- SHA-256: ${{ steps.package.outputs.APK_SHA256 }}"
            echo "- Artifact ID: ${{ steps.upload_apk.outputs.artifact-id }}"
            echo "- Product Source SHA: $GITHUB_SHA"
            echo "- Build SHA: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
