name: Android startup smoke
on:
  push:
    branches: ['control/startup-crash-recovery-v1']
    paths: ['.github/workflows/startup-smoke.yml']
  workflow_run:
    workflows: ['Android CI']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  startup:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'fix/startup-crash-recovery-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Select original or replacement APK
        id: apk
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.eventName === 'push' ? 41139905943 : context.payload.workflow_run.id;
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: run});
            const artifact = data.artifacts.find(x => x.name.startsWith('YuJian-debug-') && !x.expired);
            if (!artifact) throw new Error('Installable APK artifact unavailable');
            core.setOutput('name', artifact.name);
            core.setOutput('run', String(run));
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          run-id: ${{ steps.apk.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: startup-input
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold and warm launch diagnostic
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p startup-evidence
            apk=$(find startup-input -name 'YuJian-debug.apk' -print -quit)
            test -n "$apk"
            sha256sum "$apk" | tee startup-evidence/APK_SHA256.txt
            adb install -r "$apk"
            adb logcat -c
            adb shell am start -W -n com.yujian.ai.uiv2/com.yujian.ai.MainActivity | tee startup-evidence/launch.txt
            sleep 12
            adb logcat -d -b crash > startup-evidence/crash.txt
            adb logcat -d > startup-evidence/logcat.txt
            adb shell pidof com.yujian.ai.uiv2 > startup-evidence/pid.txt || true
            adb shell uiautomator dump /sdcard/startup.xml || true
            adb pull /sdcard/startup.xml startup-evidence/startup.xml || true
            adb exec-out screencap -p > startup-evidence/startup.png
            if test -s startup-evidence/pid.txt && ! grep -q 'com.yujian.ai.uiv2' startup-evidence/crash.txt; then echo PASS > startup-evidence/STATUS; else echo FAIL > startup-evidence/STATUS; fi
            adb shell am force-stop com.yujian.ai.uiv2
            adb shell am start -W -n com.yujian.ai.uiv2/com.yujian.ai.MainActivity > startup-evidence/relaunch.txt
            sleep 5
            adb shell pidof com.yujian.ai.uiv2 > startup-evidence/relaunch-pid.txt || true
            adb logcat -d -b crash > startup-evidence/relaunch-crash.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-startup-evidence-${{ github.event.workflow_run.head_sha || github.sha }}
          path: startup-evidence
          if-no-files-found: warn
      - name: Replacement must show normal Home without a crash
        if: github.event_name == 'workflow_run'
        run: |
          test -f startup-evidence/STATUS
          test "$(cat startup-evidence/STATUS)" = PASS
          test -s startup-evidence/relaunch-pid.txt
          ! grep -q 'com.yujian.ai.uiv2' startup-evidence/relaunch-crash.txt
          ! grep -q '启动诊断' startup-evidence/startup.xml
      - name: Original APK diagnostic result (not device acceptance)
        if: github.event_name == 'push' && always()
        run: |
          echo '## Original delivered APK startup reproduction' >> "$GITHUB_STEP_SUMMARY"
          cat startup-evidence/STATUS >> "$GITHUB_STEP_SUMMARY" || echo INFRA_NOT_RUN >> "$GITHUB_STEP_SUMMARY"
