name: Design Manager Pages

on:
  push:
    branches:
      - main
      - ops/pages-recovery-nh01-preview-20261021
      - design/nh01-responsive-authority-consolidation-v1
    paths:
      - "design/**"
      - "previews/**"
      - "release/design_manager/**"
      - "scripts/verify_design_manager_navigation.py"
      - "scripts/verify_design_manager_hifi_release.py"
      - "scripts/verify_design_manager_browser.mjs"
      - "scripts/verify_design_manager_live.py"
      - "scripts/verify_nh01_pr_preview_live.mjs"
      - "scripts/design/validate_nh01_responsive_layout_contract_v2.py"
      - "scripts/design/build_nh01_responsive_preview_site.py"
      - ".github/workflows/experience-governance.yml"
      - ".github/workflows/design-manager-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "design/**"
      - "previews/**"
      - "scripts/design/**"
      - "scripts/verify_nh01_pr_preview_live.mjs"
      - "scripts/design/build_nh01_responsive_preview_site.py"
      - "scripts/verify_design_manager_navigation.py"
      - "scripts/verify_design_manager_hifi_release.py"
      - "scripts/verify_design_manager_browser.mjs"
      - "scripts/verify_design_manager_live.py"
      - ".github/workflows/design-manager-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "design-manager-pages"
  cancel-in-progress: false

env:
  BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    outputs:
      site_build_sha: ${{ steps.site_build.outputs.site_sha }}
      publish_preview: ${{ steps.publish_gate.outputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout production Pages baseline for isolated NH01 preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/design/nh01-responsive-authority-consolidation-v1'
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-baseline

      - name: Set up Python for NH01 schema validation
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate NH01 structured bundle
        run: |
          python -m pip install --disable-pip-version-check -r scripts/design/requirements_nh01_cloud.txt PyYAML==6.0.3
          python3 scripts/design/build_nh01_cloud_bundle.py
          python3 scripts/design/validate_nh01_cloud_bundle.py
          python3 scripts/design/build_nh01_authority_inventory.py
          python3 scripts/design/verify_nh01_cloud_viewer.py
          python3 -m unittest discover -s scripts/design/tests -p 'test_*.py' -v
          python3 scripts/design/validate_nh01_responsive_layout_contract_v2.py

      - name: Setup Node for browser verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/dm-playwright" playwright@1.63.0
          "$RUNNER_TEMP/dm-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Validate design registry and hi-fi assets
        run: |
          python3 scripts/design_manager.py validate
          python3 scripts/verify_design_manager_hifi_release.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static site
        id: site_build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          SITE_BUILD_SHA="${BUILD_SHA}"
          ISOLATED_NH01_PUSH=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/design/nh01-responsive-authority-consolidation-v1" ]; then
            ISOLATED_NH01_PUSH=true
            SITE_BUILD_SHA="$(git -C production-baseline rev-parse HEAD)"
            cp -R production-baseline/design _site/design
            if [ -d production-baseline/previews ]; then cp -R production-baseline/previews _site/previews; fi
          else
            cp -R design _site/design
            if [ -d previews ]; then cp -R previews _site/previews; fi
          fi
          echo "SITE_BUILD_SHA=${SITE_BUILD_SHA}" >> "$GITHUB_ENV"
          echo "ISOLATED_NH01_PUSH=${ISOLATED_NH01_PUSH}" >> "$GITHUB_ENV"
          echo "site_sha=${SITE_BUILD_SHA}" >> "$GITHUB_OUTPUT"
          BUILD_SHORT="${SITE_BUILD_SHA:0:12}"
          sed -i "s/__DESIGN_MANAGER_BUILD__/${SITE_BUILD_SHA}/g" _site/design/manager/index.html
          sed -i "s/__DESIGN_MANAGER_BUILD_SHORT__/${BUILD_SHORT}/g" _site/design/manager/index.html
          sed -i "s/__NH01_SOURCE_SHA__/${SITE_BUILD_SHA}/g" _site/design/manager/nh01_acceptance/index.html
          sed -i "s/__NH01_VIEWER_BUILD__/${SITE_BUILD_SHA}/g" _site/design/manager/nh01_acceptance/index.html
          if [ "${ISOLATED_NH01_PUSH}" = false ] && [ -f _site/previews/pr-176/index.html ]; then
            sed -i "s/__NH01_PREVIEW_BUILD__/${BUILD_SHA}/g" _site/previews/pr-176/index.html
          fi
          if [ "${ISOLATED_NH01_PUSH}" = false ] && [ -f _site/previews/pr-176/design/manager/nh01_acceptance/gemini-native-preview.html ]; then
            sed -i "s/__NH01_GEMINI_PREVIEW_BUILD__/${BUILD_SHA}/g" _site/previews/pr-176/design/manager/nh01_acceptance/gemini-native-preview.html
            sed -i "s/__NH01_PREVIEW_DEPLOYMENT_SHA__/${SITE_BUILD_SHA}/g" _site/previews/pr-176/design/manager/nh01_acceptance/gemini-native-preview.html
          fi
          if [ "${ISOLATED_NH01_PUSH}" = true ]; then
            python3 scripts/design/build_nh01_responsive_preview_site.py \
              --source-root . --site-root _site \
              --source-sha "${BUILD_SHA}" --deployment-sha "${BUILD_SHA}" --base-site-sha "${SITE_BUILD_SHA}" \
              --workflow-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          printf '{"sha":"%s","short_sha":"%s"}\n' "${SITE_BUILD_SHA}" "${BUILD_SHORT}" > _site/design/manager/build.json
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./design/manager/">
            <title>YuJian Design Manager</title>
          </head>
          <body>
            <p><a href="./design/manager/">Open YuJian Design Manager</a></p>
          </body>
          </html>
          EOF

      - name: Verify Design Manager navigation artifact
        run: python3 scripts/verify_design_manager_navigation.py --site _site --expected-build "${SITE_BUILD_SHA}"

      - name: Verify NH01 PR preview routes and interactions
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_PATH="previews/pr-176/design/manager/nh01_acceptance/gemini-native-preview.html"
          MANIFEST_ARGS=()
          if [ "${ISOLATED_NH01_PUSH}" = true ]; then
            PREVIEW_PATH="previews/nh01-responsive-v2/design/manager/nh01_acceptance/gemini-native-preview.html"
            MANIFEST_ARGS+=(--deployment-manifest-path "previews/nh01-responsive-v2/NH01_RESPONSIVE_PREVIEW_DEPLOYMENT_V1.json")
          fi
          PLAYWRIGHT_MODULE_DIR="$RUNNER_TEMP/dm-playwright/node_modules" \
            node scripts/verify_nh01_pr_preview_live.mjs \
              --root _site \
              --expected-build "${BUILD_SHA}" \
              --expected-manager-build "${SITE_BUILD_SHA}" \
              --expected-deployment-sha "${BUILD_SHA}" \
              --output "$RUNNER_TEMP/nh01-pr-preview-build-report.json" \
              --preview-path "${PREVIEW_PATH}" \
              "${MANIFEST_ARGS[@]}"

      - name: Upload NH01 responsive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NH01-Responsive-Preview-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/nh01-pr-preview-build-report.json
            ${{ runner.temp }}/nh01-responsive-preview/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce P3-06 evidence gate and set isolated publish eligibility
        id: publish_gate
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/design/nh01-responsive-authority-consolidation-v1" ]; then
            python3 - <<'PY'
          import json, os, pathlib, sys
          report=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"],"nh01-pr-preview-build-report.json").read_text())
          contract=json.loads(pathlib.Path("design/pages/home/normal_home/responsive/NH01_RESPONSIVE_LAYOUT_V2.json").read_text())
          expected=os.environ["BUILD_SHA"]
          if report.get("status") != "PASS" or report.get("checks",{}).get("contract",{}).get("source_sha") != expected:
              raise SystemExit("P3-06 exact-SHA browser verification did not complete successfully")
          if report.get("p3_06_status") != "PASS":
              pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a").write("publish=false\n")
              print("P3-06_STATUS="+str(report.get("p3_06_status")))
              print("P3-06_BLOCKERS="+json.dumps(report.get("p3_06_blockers",[]),ensure_ascii=False))
              raise SystemExit("P3-06 acceptance is blocked; freeze and isolated deployment are prohibited")
          publish = contract.get("status") == "SPEC_FROZEN" and report.get("checks",{}).get("contract",{}).get("deployment_sha") == expected
          pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a").write("publish="+str(publish).lower()+"\n")
          print("P3-06_STATUS=PASS")
          print("INDEPENDENT_PREVIEW_DEPLOYMENT="+str(publish).upper())
          PY
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify hi-fi Pages artifact
        run: python3 scripts/verify_design_manager_hifi_release.py --site _site --expected-build "${SITE_BUILD_SHA}"

      - name: Verify browser routes and responsive preview
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_MODULE_DIR="$RUNNER_TEMP/dm-playwright/node_modules" \
            node scripts/verify_design_manager_browser.mjs \
              --root _site \
              --expected-build "${SITE_BUILD_SHA}" \
              --output-dir "$RUNNER_TEMP/dm-build-browser"

      - name: Serve and verify NH01 Acceptance Center
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory _site > "$RUNNER_TEMP/nh01-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/design/manager/nh01_acceptance/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/design/manager/nh01_acceptance/ >/dev/null
          PLAYWRIGHT_MODULE_DIR="$RUNNER_TEMP/dm-playwright/node_modules" \
            node scripts/design/verify_nh01_viewer_browser.mjs \
              --base-url=http://127.0.0.1:8765 \
              --expected-source-sha="$SITE_BUILD_SHA" \
              --output-dir "$RUNNER_TEMP/nh01-browser"
          mkdir -p "$RUNNER_TEMP/nh01-preview-diff"
          python3 scripts/design/compare_nh01_structured_preview.py \
            --structured "$RUNNER_TEMP/nh01-browser/NH01_Structured_Preview_1080x1920.png" \
            --output-dir "$RUNNER_TEMP/nh01-preview-diff" \
            --source-sha "$SITE_BUILD_SHA"
          python3 scripts/design/record_nh01_browser_evidence.py \
            --report "$RUNNER_TEMP/nh01-browser/NH01_Browser_Viewer_Report.json" \
            --site-root _site \
            --expected-source-sha "$SITE_BUILD_SHA" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --preview-diff-report "$RUNNER_TEMP/nh01-preview-diff/NH01_ROI_Report.json" \
            --preview-screenshot "$RUNNER_TEMP/nh01-browser/NH01_Structured_Preview_1080x1920.png" \
            --preview-diff-dir "$RUNNER_TEMP/nh01-preview-diff"
          PLAYWRIGHT_MODULE_DIR="$RUNNER_TEMP/dm-playwright/node_modules" \
            node scripts/design/verify_nh01_viewer_browser.mjs \
              --base-url=http://127.0.0.1:8765 \
              --expected-source-sha="$SITE_BUILD_SHA" \
              --require-browser-diff \
              --output-dir "$RUNNER_TEMP/nh01-browser-final"
          python3 scripts/design/record_nh01_browser_evidence.py \
            --report "$RUNNER_TEMP/nh01-browser-final/NH01_Browser_Viewer_Report.json" \
            --site-root _site \
            --expected-source-sha "$SITE_BUILD_SHA" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --preview-diff-report "$RUNNER_TEMP/nh01-preview-diff/NH01_ROI_Report.json" \
            --preview-screenshot "$RUNNER_TEMP/nh01-browser/NH01_Structured_Preview_1080x1920.png" \
            --preview-diff-dir "$RUNNER_TEMP/nh01-preview-diff"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Upload build browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: Design-Manager-Browser-Build-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/dm-build-browser/
          if-no-files-found: error
          retention-days: 14

      - name: Upload NH01 structured preview comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: NH01-Structured-Preview-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/nh01-browser-final/
            ${{ runner.temp }}/nh01-preview-diff/
            ${{ runner.temp }}/nh01-pr-preview-build-report.json
            ${{ runner.temp }}/nh01-responsive-preview/
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ops/pages-recovery-nh01-preview-20261021')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/design/nh01-responsive-authority-consolidation-v1' && needs.build.outputs.publish_preview == 'true')
    environment:
      name: design-manager-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    env:
      SITE_BUILD_SHA: ${{ needs.build.outputs.site_build_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Setup Python and Node for live verification
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node for live browser verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/dm-playwright" playwright@1.63.0
          "$RUNNER_TEMP/dm-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify published SHA and original asset bytes
        run: |
          python3 scripts/verify_design_manager_live.py \
            --url "${{ steps.deployment.outputs.page_url }}" \
            --expected-build "${SITE_BUILD_SHA}" \
            --output "$RUNNER_TEMP/dm-live-evidence/live-verification.json"

      - name: Verify live browser routes and responsive preview
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_MODULE_DIR="$RUNNER_TEMP/dm-playwright/node_modules" \
            node scripts/verify_design_manager_browser.mjs \
              --url "${{ steps.deployment.outputs.page_url }}" \
              --expected-build "${SITE_BUILD_SHA}" \
              --output-dir "$RUNNER_TEMP/dm-live-evidence/browser"

      - name: Verify live NH01 PR preview routes and interactions
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_PATH="previews/pr-176/design/manager/nh01_acceptance/gemini-native-preview.html"
          MANIFEST_ARGS=()
          if [ "${GITHUB_REF}" = "refs/heads/design/nh01-responsive-authority-consolidation-v1" ]; then
            PREVIEW_PATH="previews/nh01-responsive-v2/design/manager/nh01_acceptance/gemini-native-preview.html"
            MANIFEST_ARGS+=(--deployment-manifest-path "previews/nh01-responsive-v2/NH01_RESPONSIVE_PREVIEW_DEPLOYMENT_V1.json")
          fi
          PLAYWRIGHT_MODULE_DIR="$RUNNER_TEMP/dm-playwright/node_modules" \
            node scripts/verify_nh01_pr_preview_live.mjs \
              --url "${{ steps.deployment.outputs.page_url }}" \
              --expected-build "${BUILD_SHA}" \
              --expected-manager-build "${SITE_BUILD_SHA}" \
              --expected-deployment-sha "${BUILD_SHA}" \
              --preview-path "${PREVIEW_PATH}" \
              --output "$RUNNER_TEMP/dm-live-evidence/nh01-pr-preview-verification.json" \
              "${MANIFEST_ARGS[@]}"

      - name: Upload live release evidence
        uses: actions/upload-artifact@v4
        with:
          name: Design-Manager-Live-Release-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/dm-live-evidence/
          if-no-files-found: error
          retention-days: 30
