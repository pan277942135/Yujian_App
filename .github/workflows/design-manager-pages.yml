name: Design Manager Pages

on:
  push:
    branches:
      - main
      - chore/design-experience-governance-v1
    paths:
      - "design/**"
      - ".github/workflows/design-manager-pages.yml"
      - ".auth_assets/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "design-manager-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize frozen Auth visual authorities
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .auth_assets ]]; then
            mkdir -p design/pages/account_privacy/Login/frozen
            mkdir -p design/pages/account_privacy/Register/frozen
            cat .auth_assets/login_*.b64 | base64 -d > design/pages/account_privacy/Login/frozen/Login_V2_1_Frozen_Final.png
            cat .auth_assets/register_*.b64 | base64 -d > design/pages/account_privacy/Register/frozen/Register_V2_Frozen_Final.png

            test "$(sha256sum design/pages/account_privacy/Login/frozen/Login_V2_1_Frozen_Final.png | awk '{print $1}')" = "2d338ae93153339f96d8d06759f4676ca9ee9df83a071375ed537683b6ce114c"
            test "$(sha256sum design/pages/account_privacy/Register/frozen/Register_V2_Frozen_Final.png | awk '{print $1}')" = "14f63ae6e051f955fbefb020840c24f42e86ced88476f2fb7e0d233733ee4d35"

            rm -rf .auth_assets

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "feat(design): archive final Auth visual authorities"
              git push origin HEAD:chore/design-experience-governance-v1
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R design _site/design
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./design/manager/">
            <title>YuJian Design Manager</title>
          </head>
          <body>
            <p><a href="./design/manager/">Open YuJian Design Manager</a></p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: design-manager-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
