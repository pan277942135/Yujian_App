name: Design Governance

on:
  push:
    branches: [main]
    paths:
      - "design/**"
      - "scripts/design_manager.py"
      - "scripts/verify_design_manager_navigation.py"
      - "scripts/verify_design_manager_hifi_release.py"
      - "scripts/validate_swos_phase0_contracts.py"
      - "scripts/tests/test_swos_phase0_contracts.py"
      - "scripts/verify_design_manager_browser.mjs"
      - "scripts/verify_design_manager_live.py"
      - ".github/workflows/design-manager-pages.yml"
      - ".github/workflows/experience-governance.yml"
  pull_request:
    branches: [main]
    paths:
      - "design/**"
      - "scripts/design_manager.py"
      - "scripts/verify_design_manager_navigation.py"
      - "scripts/verify_design_manager_hifi_release.py"
      - "scripts/validate_swos_phase0_contracts.py"
      - "scripts/tests/test_swos_phase0_contracts.py"
      - "scripts/verify_design_manager_browser.mjs"
      - "scripts/verify_design_manager_live.py"
      - ".github/workflows/design-manager-pages.yml"
      - ".github/workflows/experience-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for browser verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/dm-playwright" playwright@1.63.0
          "$RUNNER_TEMP/dm-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Compile Design Manager
        run: python3 -m py_compile scripts/design_manager.py

      - name: Validate design registry
        run: python3 scripts/design_manager.py validate

      - name: Design Manager navigation regression gate
        run: python3 scripts/verify_design_manager_navigation.py

      - name: Hi-fi release and asset integrity gate
        run: python3 scripts/verify_design_manager_hifi_release.py

      - name: SWOS Phase 0 cross-contract consistency gate
        run: |
          python3 scripts/validate_swos_phase0_contracts.py
          python3 scripts/tests/test_swos_phase0_contracts.py

      - name: Browser navigation, modal, and responsive gate
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_MODULE_DIR="$RUNNER_TEMP/dm-playwright/node_modules" \
            node scripts/verify_design_manager_browser.mjs \
              --root "$GITHUB_WORKSPACE" \
              --output-dir "$RUNNER_TEMP/dm-governance-browser"

      - name: RR09 Motion V2 six-frame real-photo browser verification
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_MODULE_DIR="$RUNNER_TEMP/dm-playwright/node_modules" \
            node scripts/verify_rr09_motion_browser.mjs \
              --root "$GITHUB_WORKSPACE" \
              --output-dir "$RUNNER_TEMP/rr09-motion-evidence"

      - name: Upload RR09 Motion V2 browser screenshots and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RR09-Motion-V2-Review-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rr09-motion-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Print design summary
        run: python3 scripts/design_manager.py summary

      - name: Upload Design Manager
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-Design-Manager-${{ github.sha }}
          path: |
            design/manager/
            design/registry/experience_registry_v1.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: Design-Manager-Browser-${{ github.sha }}
          path: ${{ runner.temp }}/dm-governance-browser/
          if-no-files-found: error
          retention-days: 14
