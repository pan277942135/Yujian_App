name: Recognition QA Test Users
on:
  push:
    paths:
      - 'app/src/androidTest/assets/qa/recognition/v1/test_users.json'
      - 'app/src/androidTest/java/com/yujian/ai/RecognitionQaUserFixtureSeedTest.kt'
      - 'scripts/validate_recognition_qa_test_users.py'
      - 'tests/test_recognition_qa_test_users.py'
      - 'tests/test_recognition_test_case_catalog.py'
      - 'scripts/validate_recognition_test_case_catalog.py'
      - 'docs/qa/recognition_main_journey/test_case_catalog_v1.json'
      - 'docs/qa/recognition_main_journey/e2e_scenarios_v1.json'
      - 'docs/qa/recognition_main_journey/test_inputs_v1.json'
      - 'docs/qa/recognition_main_journey/seven_decisions_v1.json'
      - '.github/workflows/recognition-qa-test-users.yml'
  pull_request:
    paths:
      - 'app/src/androidTest/assets/qa/recognition/v1/test_users.json'
      - 'app/src/androidTest/java/com/yujian/ai/RecognitionQaUserFixtureSeedTest.kt'
      - 'scripts/validate_recognition_qa_test_users.py'
      - 'tests/test_recognition_qa_test_users.py'
      - 'tests/test_recognition_test_case_catalog.py'
      - 'scripts/validate_recognition_test_case_catalog.py'
      - 'docs/qa/recognition_main_journey/test_case_catalog_v1.json'
      - 'docs/qa/recognition_main_journey/e2e_scenarios_v1.json'
      - 'docs/qa/recognition_main_journey/test_inputs_v1.json'
      - 'docs/qa/recognition_main_journey/seven_decisions_v1.json'
      - '.github/workflows/recognition-qa-test-users.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate fixture contract and stable states
        run: python3 scripts/validate_recognition_qa_test_users.py
      - name: Validate 66 + 10 case coverage and QA state bindings
        run: python3 scripts/validate_recognition_test_case_catalog.py
      - name: Negative and regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_recognition_qa_test_users.py' -v
          python3 -m unittest discover -s tests -p 'test_recognition_test_case_catalog.py' -v
