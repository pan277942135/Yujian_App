<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neutral non-NH01 workspace fixture</title>
  <link rel="stylesheet" href="/design/manager/nh01_structured_workspace.css">
  <style>
    body { margin: 0; padding: 20px; background: #eef3f0; font: 14px/1.45 system-ui, sans-serif; }
    .fixture-page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; width: 100%; min-height: 100%; padding: 18px; box-sizing: border-box; color: #203c49; background: #fff; container-type: inline-size; }
    .fixture-header { padding: 16px; color: #fff; background: #315c74; border-radius: 12px; }
    .fixture-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .fixture-section { min-width: 0; min-height: 120px; padding: 16px; border: 1px solid #cad9df; border-radius: 12px; background: #f7fafb; }
    .fixture-copy { margin: 0; font-size: calc(16px * var(--page-workspace-font-scale,1)); line-height: 1.45; overflow-wrap: anywhere; }
    .fixture-action { min-width: 48px; min-height: 44px; padding: 10px 18px; border: 0; border-radius: 22px; color: #fff; background: #117b78; cursor: pointer; }
    .fixture-resource { display: flex; align-items: center; gap: 10px; min-height: 70px; }
    .fixture-resource img { width: 48px; height: 48px; border: 1px dashed #b55e4b; object-fit: cover; }
    .fixture-status { color: #963f34; font-weight: 700; }
    [data-workspace-selected] { outline: 2px solid #a67b35; outline-offset: 2px; }
    @container (max-width: 600px) { .fixture-grid { grid-template-columns: minmax(0,1fr); } .fixture-section { min-height: 82px; } }
    .fixture-error { padding: 7px 10px; color: #8d443b; border-radius: 8px; background: #fff0eb; }
  </style>
</head>
<body>
  <div id="fixture-workspace"></div>
  <script src="/design/manager/page_workspace_adapters.js"></script>
  <script src="/scripts/design/tests/fixtures/non_nh01_workspace_fixture.js"></script>
</body>
</html>
