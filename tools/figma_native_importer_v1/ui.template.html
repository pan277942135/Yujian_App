<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light dark; font: 12px Inter, -apple-system, BlinkMacSystemFont, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); }
      h1 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
      p { margin: 6px 0; line-height: 1.45; }
      .meta { color: var(--figma-color-text-secondary, #666); overflow-wrap: anywhere; }
      .card { border: 1px solid var(--figma-color-border, #ddd); border-radius: 8px; padding: 10px; margin: 12px 0; }
      .label { font-weight: 600; }
      .status { min-height: 34px; padding: 8px 0; line-height: 1.45; }
      .status[data-kind="error"] { color: #c43d3d; }
      .status[data-kind="success"] { color: #16834a; }
      .actions { display: flex; gap: 8px; margin-top: 8px; }
      button { min-height: 34px; border: 0; border-radius: 6px; padding: 0 12px; background: var(--figma-color-bg-brand, #18a0fb); color: #fff; font: inherit; cursor: pointer; }
      button.secondary { color: var(--figma-color-text, #222); background: var(--figma-color-bg-secondary, #eee); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
      .foot { color: var(--figma-color-text-tertiary, #888); font-size: 10px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>YuJian Native Importer · NH01</h1>
    <div class="card">
      <p><span class="label">Source</span> Morning_Lake_Master_V1.png · 941 × 1672</p>
      <p class="meta">GitHub source SHA-256<br /><code id="sha"></code></p>
      <p><span class="label">Target</span> node <code id="target"></code> · IMAGE / FIT</p>
      <p class="meta" id="document"></p>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">Loading bundled original PNG bytes…</div>
    <div class="actions">
      <button id="import" disabled>Verify and import to 41:32</button>
      <button id="export" class="secondary" disabled>Export frame 41:30</button>
    </div>
    <p class="foot">The plugin uses no network. It will not create an overlay node or overwrite unrelated existing fills.</p>

    <script type="application/json" id="import-config">__IMPORT_CONFIG_JSON__</script>
    <script type="application/json" id="asset-bundle">__ASSET_BUNDLE_JSON__</script>
    <script>
      (() => {
        const config = JSON.parse(document.getElementById('import-config').textContent);
        const bundledAssets = JSON.parse(document.getElementById('asset-bundle').textContent);
        const asset = config.assets[0];
        const status = document.getElementById('status');
        const importButton = document.getElementById('import');
        const exportButton = document.getElementById('export');
        let sourceBytes = null;
        let sourceVerified = false;
        let targetReady = false;
        let importVerified = false;

        document.getElementById('sha').textContent = asset.sourceSha256;
        document.getElementById('target').textContent = asset.targetNodeId;
        document.getElementById('document').textContent =
          `${config.document.expectedName} · ${config.page.expectedName}`;

        function setStatus(message, kind) {
          status.textContent = message;
          status.dataset.kind = kind || 'info';
        }

        function send(message) {
          parent.postMessage({ pluginMessage: message }, '*');
        }

        function decodeBase64(value) {
          const binary = atob(value);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
          return bytes;
        }

        function updateButtons() {
          importButton.disabled = !(sourceVerified && targetReady);
          exportButton.disabled = !importVerified;
        }

        function prepareBundledSource() {
          const encoded = bundledAssets[asset.id];
          if (typeof encoded !== 'string' || encoded.length === 0) {
            setStatus('The configured source bytes are missing from this package.', 'error');
            return;
          }
          sourceBytes = decodeBase64(encoded);
          send({ type: 'SOURCE_BYTES', assetId: asset.id, bytes: sourceBytes });
          setStatus(`Checking exact source bytes (${sourceBytes.length.toLocaleString()} bytes)…`);
        }

        importButton.addEventListener('click', () => {
          if (!sourceVerified || !targetReady) return;
          importButton.disabled = true;
          setStatus('Importing original bytes with figma.createImage(bytes)…');
          send({ type: 'IMPORT_ASSET', assetId: asset.id });
        });

        exportButton.addEventListener('click', () => {
          if (!importVerified) return;
          exportButton.disabled = true;
          setStatus('Exporting the configured 1080 × 1920 verification frame…');
          send({ type: 'EXPORT_FRAME' });
        });

        function downloadPng(bytes, fileName) {
          const blob = new Blob([bytes], { type: 'image/png' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        onmessage = (event) => {
          const message = event.data && event.data.pluginMessage;
          if (!message) return;
          if (message.type === 'SOURCE_VERIFIED') {
            sourceVerified = true;
            setStatus(`Source SHA-256 verified: ${message.sourceSha256}.`);
            updateButtons();
          } else if (message.type === 'TARGET_STATUS') {
            targetReady = Boolean(message.ready);
            if (message.ready) {
              setStatus(`Target ready: ${message.nodeId} · ${message.nodeType} · ${message.fillState}.`);
            } else {
              setStatus(message.error || 'The target did not pass the safety checks.', 'error');
            }
            updateButtons();
          } else if (message.type === 'IMPORT_RESULT') {
            importVerified = Boolean(message.ok);
            importButton.disabled = false;
            setStatus(message.ok
              ? `IMAGE fill verified on ${message.nodeId} · ${message.scaleMode}. Internal Figma imageHash: ${message.imageHash}.`
              : (message.error || 'Import failed; no unrelated node was changed.'), message.ok ? 'success' : 'error');
            updateButtons();
          } else if (message.type === 'FRAME_EXPORT') {
            exportButton.disabled = false;
            if (message.ok) {
              downloadPng(message.bytes, message.fileName);
              setStatus(`Exported ${message.fileName} (${message.width} × ${message.height}). Compare it with the Frozen page before visual acceptance.`, 'success');
            } else {
              setStatus(message.error || 'Frame export failed.', 'error');
            }
          } else if (message.type === 'ERROR') {
            importButton.disabled = false;
            exportButton.disabled = !importVerified;
            setStatus(message.error || 'Importer error.', 'error');
          }
        };

        prepareBundledSource();
        updateButtons();
      })();
    </script>
  </body>
</html>
