status_semantics:
  FROZEN: "Authoritative and immutable unless explicitly superseded by a new approved version."
  READY: "Contract exists and is structurally usable; runtime acceptance may still be NOT_RUN."
  ACTIVE_CLOSURE: "Contract is authoritative but current acceptance/evidence closure remains active."
  PARTIAL: "Some required contract dimensions exist; missing dimensions remain explicit."
  MISSING: "No authoritative contract exists for the declared dimension."
  DEFERRED: "Explicitly deferred and not required for the currently claimed scope."
  NOT_CONFIRMED: "Authoritative sources conflict or provenance is incomplete."
  HISTORICAL: "Historical provenance only; cannot promote current state."

global_acceptance_rules:
  - "A feature is accepted only when all required contract dimensions and gates for its claimed scope are satisfied on the same source SHA."
  - "A contract registry PASS is structural traceability only; it never promotes runtime, visual, journey or release status."
  - "Missing or partial domain contracts are reported as OPEN_GAP and cannot be silently substituted."
  - "Frozen design assets and model/backend contracts are immutable by default."
  - "Every runtime/evidence record must carry source SHA, workflow run, device/API, suite, artifact and APK SHA when verified."
  - "N009 remains the only human release gate."

