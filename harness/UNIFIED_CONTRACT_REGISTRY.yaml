# UNIFIED_CONTRACT_REGISTRY.yaml — 渔见 Contract Layer V1
schema_version: "1.0"
registry_id: "yujian-unified-contract-registry"
status: "ACTIVE"
purpose: "Single machine-readable contract resolution layer binding Product, Feature, Journey, Child Surface, Route, Page, Design, Component, Asset, State, Data/API, Model, Android Implementation, Runtime, Accessibility, Evidence and Release contracts without replacing their authoritative source files."
source_of_truth_rule: "This registry is the static contract index and resolver. Domain authorities remain authoritative; this layer never stores live Work status or release progress."
dynamic_state_rule: "Live execution status, current branch, current PR, current SHA and evidence observations belong to PROJECT_MASTER_STATE.yaml and WORK_EXECUTION_STATE.json on the active Work branch."
project:
  repository: "pan277942135/Yujian_App"
  control_branch: "main"
  backend_repository: "pan277942135/Yujian"
  backend_main_sha: "738954105d545d9c354136b8b93f3562058fcf30"

resolution:
  resolver_version: "V1"
  lookup_key: "feature_id + child_surface_id + contract_domain"
  precedence:
    - "live repository at the claimed execution SHA"
    - "Effective Authority Registry"
    - "feature/page/domain authority contract"
    - "Android implementation contract"
    - "runtime gate contract"
    - "evidence manifest/result"
    - "historical reports (provenance only)"
  conflict_rule: "If authorities disagree, stop promotion and mark NOT_CONFIRMED or BLOCKED; never choose by recency, convenience or agent judgment."
  missing_rule: "MISSING means no authoritative source exists; do not substitute a generic contract."
  historical_rule: "HISTORICAL evidence cannot establish current-head PASS."
  inheritance_rule: "A feature may inherit shared foundation contracts, but page-owned contracts override only within their declared scope."
  frozen_rule: "FROZEN bytes, tokens, component IDs, model thresholds and protected backend contracts cannot be altered by implementation work without explicit authorization."

domain_catalog:
  product:
    description: "Product behavior/decisions"
    authority_family: "PROJECT_MASTER_STATE.yaml"
    role: "PRIMARY"
  feature:
    description: "Feature scope and acceptance mapping"
    authority_family: "harness/FEATURE_MATRIX.yaml"
    role: "PRIMARY"
  journey:
    description: "J01-J20 user journey semantics"
    authority_family: "design/system_v3/00_Product_Master_Flow/master_flow_v3_1.json + harness/FEATURE_MATRIX.yaml"
    role: "PRIMARY"
  child_surface:
    description: "Page/feature sub-surface ownership"
    authority_family: "harness/FEATURE_MATRIX.yaml"
    role: "PRIMARY"
  route:
    description: "Android navigation route ownership"
    authority_family: "harness/FEATURE_MATRIX.yaml + app/src/main/java/com/yujian/ai/YujianApp.kt"
    role: "PRIMARY"
  page:
    description: "Page Contract structure/state/data/acceptance"
    authority_family: "design/system_v3/08_Page_Contracts/"
    role: "DOMAIN"
  visual:
    description: "Visual authority and pixel targets"
    authority_family: "design/system_v3/10_Page_Visual_Acceptance_Contracts/"
    role: "DOMAIN"
  component:
    description: "Shared component registry"
    authority_family: "design/system_v3/05_Component_System/Component_Registry_V3_FINAL.json"
    role: "SHARED"
  token:
    description: "Typography/Color/Geometry token authorities"
    authority_family: "design/system_v3/04_Design_Tokens/ + 07_Responsive_System/"
    role: "SHARED"
  asset:
    description: "Asset registry and frozen binary identity"
    authority_family: "design/system_v3/06_Asset_System/"
    role: "SHARED"
  state:
    description: "State machine/binding"
    authority_family: "page state contracts + Android State Binding"
    role: "DOMAIN"
  data:
    description: "Data/API/database semantics"
    authority_family: "page Data Contracts + protected Backend repository"
    role: "DOMAIN"
  model:
    description: "Production model release contract"
    authority_family: "scripts/production_model_contract.py + backend release mobile-model-v0.2"
    role: "SHARED"
  implementation:
    description: "Android implementation ownership and bindings"
    authority_family: "design/system_v3/09_Android_Implementation_Contracts/"
    role: "DOMAIN"
  runtime:
    description: "Device/runtime acceptance"
    authority_family: "scripts/run_android_runtime_gate.sh + page runtime gates"
    role: "EXECUTION"
  accessibility:
    description: "Responsive/accessibility contract"
    authority_family: "page accessibility matrices + visual accessibility contracts"
    role: "DOMAIN"
  evidence:
    description: "Evidence provenance and acceptance outputs"
    authority_family: "runtime/evidence manifests + harness evidence rules"
    role: "EXECUTION"
  release:
    description: "APK provenance/release authorization"
    authority_family: "harness/PHASE_TASK_STATE_MACHINE.yaml + branch-local PROJECT_MASTER_STATE.yaml"
    role: "EXECUTION"

