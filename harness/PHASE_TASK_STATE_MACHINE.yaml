# PHASE_TASK_STATE_MACHINE.yaml — 渔见 V1

schema_version: "1.0"
machine_id: "yujian-phase-task-state-machine"
status: "ACTIVE"
purpose: "Canonical static execution controller defining P0-P9 phases, N001-N010 task topology, dependencies, gate bindings, recovery semantics and release rules."
dynamic_state_rule: "This file contains no live Work status, current task, current SHA, queue status, retry counters or observed evidence. Those belong to branch-local execution state."
source_of_truth_rule: "This file controls execution state and dependency semantics; PROJECT_MASTER_STATE remains the project snapshot, FEATURE_MATRIX remains the feature execution index, and contracts/evidence remain authoritative for their domains."

project:
  repository: "pan277942135/Yujian_App"
  control_branch: "main"
  master_state: "PROJECT_MASTER_STATE.yaml"
  feature_matrix: "harness/FEATURE_MATRIX.yaml"
  unified_contract_registry: "harness/UNIFIED_CONTRACT_REGISTRY.yaml"
  unified_contract_schema: "harness/UNIFIED_CONTRACT_SCHEMA_V1.md"
  contract_resolution_protocol: "harness/CONTRACT_RESOLUTION_PROTOCOL.md"
  current_work_state: "WORK_EXECUTION_STATE.json"

execution_policy:
  unified_contract_registry: "harness/UNIFIED_CONTRACT_REGISTRY.yaml"
  unified_contract_validator: "scripts/validate_unified_contract.py"
  auto_advance_within_authorized_scope: true
  auto_recovery_enabled: true
  no_unbounded_retry: true
  max_automatic_repairs_per_failing_gate: 2
  total_attempts_per_gate: 3
  parallel_execution: "Only tasks explicitly marked PARALLEL may run independently; phase advancement never bypasses dependency gates."
  final_human_gate: "N009"
  main_merge_allowed: true
  main_merge_requires_green_checks: true
  main_merge_policy: "GREEN_REQUIRED_CHECKS_WITHIN_AUTHORIZED_SCOPE; NO_EXTRA_PER_PR_APPROVAL; N009_RESERVED_FOR_RELEASE"
  force_push_allowed: false
  rebase_allowed: false
  history_rewrite_allowed: false
  contract_resolution_required: true
  contract_registry_is_execution_authority: false
  contract_registry_role: "Resolver/index only; domain contract files remain authoritative."

phase_order:
  - "P0"
  - "P1"
  - "P2"
  - "P3"
  - "P4"
  - "P5"
  - "P6"
  - "P7"
  - "P8"
  - "P9"

phases:
  P0:
    name: "Product Goal / Decisions"
    entry_condition: "Product scope and decisions are available."
    exit_condition: "Frozen product decisions are recorded and validated."
    release_scope: "FOUNDATION"
