next_action_queue:
  exact_order:
    - "N001"
    - "N002"
    - "N003"
    - "N004"
    - "N005"
    - "N006"
    - "N007"
    - "N008"
    - "N009"
    - "N010"
  queue_policy: "Do not reorder, delete or silently replace N001-N010. A task may add recovery substeps but cannot bypass the declared dependency semantics."

recovery:
  interruption:
    restart_from: "latest committed checkpoint"
    read_order:
      - "CONTROL_PLANE_REGISTRY.yaml"
      - "AGENTS.md"
      - "PROJECT_MASTER_STATE.yaml"
      - "WORK_EXECUTION_STATE.json"
      - "harness/FEATURE_MATRIX.yaml"
      - "harness/PHASE_TASK_STATE_MACHINE.yaml"
      - "harness/UNIFIED_CONTRACT_REGISTRY.yaml"
      - "harness/build-log.md"
    resume_rule: "Resume the current task from the last durable WORK_EXECUTION_STATE checkpoint; after task closure, select the first READY next action whose static dependencies and named blockers are satisfied."
  failure:
    classify_before_retry: true
    retry_same_gate_max: 2
    third_failure: "Stop automatic repair for that gate, classify the blocker, preserve evidence, and continue only independent tasks."
    infrastructure_failure: "Do not rewrite product code merely to satisfy an infrastructure failure."
    frozen_authority_conflict: "BLOCKED_DEPENDENCY until provenance is resolved."
    product_failure: "BLOCKED_PRODUCT after retry budget is exhausted."
  idempotency:
    task_key: "task_id + source_sha + gate_id"
    rerun_rule: "Reuse existing checkpoint/evidence where valid; never duplicate successful durable outputs."
    evidence_rule: "Never delete failed evidence; supersede it with a new exact-SHA result."

release_scope:
  current: "PRIMARY_RELEASE"
  primary_features:
    - "home_empty_v2"
    - "home_normal_v1"
    - "recognition_flow_v1_2"
    - "recognition_result_v1"
    - "fish_record_detail_v2"
    - "fish_memory_bside_v1"
  primary_journeys: "J01-J20"
  secondary_features_do_not_block_current_primary_release_unless:
    - "they share a release-scope dependency"
    - "they introduce a P0/P1 regression in the primary journey"
    - "the release scope is explicitly expanded"
  release_blockers: ["B001", "B002", "B003", "B004", "B006"]
  human_gate: "N009"
