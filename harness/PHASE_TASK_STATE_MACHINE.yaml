state_machine:
  task_states:
    - "READY"
    - "WAITING"
    - "RUNNING"
    - "VALIDATING"
    - "FAIL"
    - "RECOVERING"
    - "BLOCKED"
    - "PASS"
    - "CLOSED"
    - "FINAL_GATE"
    - "CANCELLED"
  queue_status_labels:
    - "READY"
    - "WAITING_FOR_N001"
    - "PARALLEL"
    - "WAITING"
    - "FINAL_GATE"
    - "BLOCKED_BY_B008"
  phase_states:
    - "NOT_STARTED"
    - "READY"
    - "IN_PROGRESS"
    - "BLOCKED"
    - "PASS"
    - "FINAL_GATE"
  terminal_states:
    task: ["CLOSED", "CANCELLED"]
    release: ["COMPLETE", "COMPLETE_WITH_BLOCKED_INFRA", "BLOCKED_PRODUCT", "BLOCKED_DEPENDENCY"]
  transitions:
    READY_to_RUNNING:
      when: "All task dependencies are PASS/CLOSED, no named blocker is OPEN, and the task is within authorized scope."
    WAITING_to_READY:
      when: "All dependency tasks are PASS/CLOSED and required blockers are closed."
    RUNNING_to_VALIDATING:
      when: "Implementation/execution step has produced the declared outputs."
    VALIDATING_to_PASS:
      when: "All required assertions and evidence gates pass on the exact claimed SHA."
    VALIDATING_to_FAIL:
      when: "A required assertion fails and the failure is attributable to the task scope."
    VALIDATING_to_BLOCKED:
      when: "Execution cannot continue because a named dependency, infrastructure condition, frozen-source conflict, or human decision is required."
    FAIL_to_RECOVERING:
      when: "Failure is retryable and retry_count < retry_budget."
    RECOVERING_to_RUNNING:
      when: "A bounded corrective action is recorded and the retry checkpoint is durable."
    RECOVERING_to_BLOCKED:
      when: "The failure is non-retryable, retry budget is exhausted, or a dependency is required."
    PASS_to_CLOSED:
      when: "Task outputs, evidence, state update and Git checkpoint are durable."
    FINAL_GATE_to_CLOSED:
      when: "Human release authorization is recorded and release package is complete."
  forbidden_transitions:
    - "WAITING -> PASS"
    - "BLOCKED -> PASS"
    - "FAIL -> PASS without VALIDATING"
    - "PASS -> PASS on a different source SHA without revalidation"
    - "P8 -> P9 when any required release gate is not PASS"
    - "any state -> RELEASE without N009 human authorization"

blocker_semantics:
  blockers_compatibility_field: "Legacy combined blocker index; entry_blockers and target_blockers are authoritative for task execution."
  entry_blockers: "A named prerequisite that must be CLOSED before the task can enter RUNNING."
  target_blockers: "A named blocker the task is explicitly intended to close; it may remain OPEN while the task is READY/RUNNING."
  target_only_task_rule: "An OPEN target_blocker does not force BLOCKED."
  entry_blocker_rule: "Any OPEN entry_blocker forces WAITING or BLOCKED."
  n001_target: ["B001"]
  n002_target: ["B002"]
  n004_target: ["B003", "B004"]
  n007_target: ["B006"]
  n010_target_and_entry: ["B008"]

retry_policy:
  initial_attempt: 1
  automatic_repairs: 2
  maximum_attempts: 3
  retry_key: "task_id + source_sha + gate_id"
  preserve_failed_evidence: true
  on_exhaustion:
    PRODUCT: "BLOCKED_PRODUCT"
    DEPENDENCY: "BLOCKED_DEPENDENCY"
    INFRASTRUCTURE: "COMPLETE_WITH_BLOCKED_INFRA"
    EVIDENCE: "BLOCKED_PRODUCT"
    CONFLICT: "BLOCKED_DEPENDENCY"
  no_unbounded_retry: true

checkpoint_contract:
  required_fields:
    - "task_id"
    - "phase"
    - "feature_refs"
    - "journey_refs"
    - "status"
    - "queue_status"
    - "source_sha"
    - "branch"
    - "retry_count"
    - "retry_budget"
    - "last_attempt"
    - "failure_class"
    - "recovery_action"
    - "human_required"
    - "dependencies"
    - "blockers"
    - "evidence_required"
    - "evidence_observed"
    - "completion"
    - "next_action"
  checkpoint_rule: "Persist a checkpoint after each state transition that changes execution, evidence, blocker or source SHA."

evidence_gate:
  exact_sha_required: true
  required_provenance:
    - "source_sha"
    - "workflow_run_id"
    - "device_or_runner"
    - "test_suite"
    - "apk_artifact"
    - "apk_sha256_when_verified"
  acceptance_layers:
    - "static_validation"
    - "build"
    - "unit_test"
    - "android_test_compile"
    - "apk_packaging"
    - "device_runtime"
    - "visual_geometry"
    - "motion_accessibility"
    - "journey_e2e"
    - "release_provenance"
  shortcut_rules:
    - "Build PASS does not imply Runtime PASS."
    - "Unit PASS does not imply Journey PASS."
    - "Historical PASS does not imply Current PASS."
    - "Artifact existence does not imply Release Ready."
    - "AI/agent statement does not imply Evidence."

parallelism:
  allowed:
    - "N004 may run in parallel with N001 when its own inputs are available."
    - "Independent evidence collection may run in parallel after its producing gate is available."
    - "Secondary feature closure may proceed while primary runtime is blocked when it does not mutate the blocked dependency."
  forbidden:
    - "N002 or N003 may not bypass N001."
    - "P9 may not bypass N001-N008."
    - "A task may not execute while a named prerequisite is WAITING or BLOCKED."
    - "Parallel work may not modify frozen authorities or backend/API/database contracts without explicit scope."

