release_rules:
  feature_accepted: "Required implementation + required tests + current-branch runtime + required evidence PASS, with no unresolved P0/P1 blocker for the claimed scope."
  feature_release_ready: "Feature accepted + required release dependencies PASS + APK provenance bound to exact source SHA."
  forbidden_shortcuts:
    - "Build PASS => Runtime PASS"
    - "Unit PASS => End-to-end PASS"
    - "Historical PASS => Current PASS"
    - "Artifact exists => Release ready"
    - "AI statement => Evidence"
gap_policy:
  open_gaps_are_expected: "YES"
  validator_behavior: "Structural integrity errors fail the validator; product incompleteness is reported as OPEN_GAP and does not by itself fail matrix integrity."
  historical_status_rule: "Registry/history PASS is never promoted to current-branch PASS without exact-SHA runtime/evidence."
